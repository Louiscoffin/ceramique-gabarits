/* Le menu vit en position fixe : le bouton est dans la barre collante
   d'une colonne qui défile, un menu posé dans le flux s'en détacherait. */
let svgMenuEl=null, svgMenuTick=null;
function closeSvgMenu(){
  if(svgMenuTick){ clearInterval(svgMenuTick); svgMenuTick=null; }
  if(svgMenuEl){ svgMenuEl.remove(); svgMenuEl=null; }
}
function placeSvgMenu(){
  if(!svgMenuEl||!svgMenuEl.anchor) return;
  const r=svgMenuEl.anchor.getBoundingClientRect();
  const vw=document.documentElement.clientWidth, vh=document.documentElement.clientHeight;
  if(r.bottom<0||r.top>vh){ closeSvgMenu(); return; }
  const w=svgMenuEl.offsetWidth, h=svgMenuEl.offsetHeight;
  const below=r.bottom+6, above=r.top-h-6;
  svgMenuEl.style.top = Math.max(8, (below+h<=vh-8||above<8) ? Math.min(below, vh-h-8) : above)+'px';
  svgMenuEl.style.left= Math.max(8, Math.min(r.left, vw-w-8))+'px';
}
document.addEventListener('click', e=>{ if(svgMenuEl && !svgMenuEl.contains(e.target)) closeSvgMenu(); }, true);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSvgMenu(); });
window.addEventListener('scroll', placeSvgMenu, true);
window.addEventListener('resize', placeSvgMenu);
function svgMenu(anchor, pick, subCotes){
  closeSvgMenu();
  const m=document.createElement('div');
  m.className='svgmenu';
  /* le contour seul d'abord : c'est celui qu'on donne à une découpeuse. Pris
     par erreur, le fichier coté faisait découper aussi cotes et textes. */
  m.innerHTML=
    `<button type="button" data-nu="1">${D('Pour une découpeuse','For a cutting machine')}<span>${D('Cricut, laser… le contour seul, sans cote ni texte','Cricut, laser… the outline only, no dimensions or text')}</span></button>`+
    `<button type="button" data-nu="0">${D('Pour lire ou imprimer','To read or print')}<span>${subCotes||D('contour, pièce finie en pointillé et cotes','outline, finished piece dashed and dimensions')}${D(' — à ne pas envoyer à une découpeuse',' — not for a cutting machine')}</span></button>`;
  m.anchor=anchor; document.body.appendChild(m);
  m.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const nu=b.dataset.nu==='1'; closeSvgMenu(); pick(nu); });
  svgMenuEl=m; placeSvgMenu();
  svgMenuTick=setInterval(placeSvgMenu, 100);
}

function tourTarget(st){
  if(!st.sel) return null;

}
function startTour(){
  endTour(false); closeModal(); drawer(false);
  track('tour_start', {});
  if(state.route!=='atelier' || state.tab!=='volume'){ state.route='atelier'; state.tab='volume'; render(); }
  const ov=document.createElement('div'); ov.id='tourOv';
  ov.innerHTML=`<div id="tourHole" class="none"></div>
    <div id="tourCard" role="dialog" aria-modal="true" aria-labelledby="tourH"></div>`;
  document.body.appendChild(ov);
  TOUR={ steps:tourSteps(), i:0 };
  addEventListener('resize', tourPlace); document.addEventListener('scroll', tourPlace, true);
  tourShow(0);
}
function endTour(done){
  if(!TOUR && !tourEl('tourOv')) return;
  tourEl('tourOv')?.remove();
  removeEventListener('resize', tourPlace); document.removeEventListener('scroll', tourPlace, true);
  if(TOUR && TOUR.drawer) drawer(false);
  if(TOUR && done!==false) track(TOUR.i>=TOUR.steps.length-1 ? 'tour_done' : 'tour_skip', {step:TOUR.i+1, steps:TOUR.steps.length});
  TOUR=null;
  if(done!==false){ try{ localStorage.setItem(TOUR_SEEN,'1') }catch(e){} }
}
function tourShow(i){
  const S=TOUR.steps, st=S[i]; TOUR.i=i;
  const mob=innerWidth<=860, wantDrawer=!!(st.drawer && mob);
  if(TOUR.drawer!==wantDrawer){ drawer(wantDrawer); TOUR.drawer=wantDrawer; }
  const last=i===S.length-1;
  const card=tourEl('tourCard');
  card.innerHTML=`<button class="tx" data-t="x" aria-label="${D('Fermer la visite','Close the tour')}">×</button>
    <div class="tk">${st.k || `${i} / ${S.length-2}`}</div>
    <h3 id="tourH">${st.h}</h3>${st.b}
    <div class="tnav"><span class="dots">${S.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</span>
      ${i===0?`<button class="ghost" data-t="x">${D('Passer','Skip')}</button>`:`<button class="ghost" data-t="prev">←</button>`}
      <button class="btn" data-t="next">${i===0?D('C’est parti','Let’s go'):last?D('Terminer','Finish'):D('Suivant','Next')}</button></div>`;
  card.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.t;
    if(a==='x') return endTour();
    if(a==='prev') return tourShow(Math.max(0,TOUR.i-1));
    if(last) return endTour();
    tourShow(TOUR.i+1);
  });
  const el=tourTarget(st);
  if(el){
    /* la barre du haut colle en haut de page sur mobile (et y prend de la place) */
    const tb=$('#topbar'), under = tb && !tb.contains(el) && getComputedStyle(tb).position==='sticky';
    el.style.scrollMarginTop = (under ? tb.offsetHeight+14 : 16)+'px';
    if(!st.drawer) el.scrollIntoView({block: mob ? 'start' : 'nearest'});
  }
  tourPlace();
  setTimeout(tourPlace, 260);                       // après le tiroir et le défilement
  card.querySelector('[data-t="next"]').focus({preventScroll:true});
}
/* placement synchrone : un requestAnimationFrame ne part pas quand l'onglet
   est en arrière-plan, et le projecteur restait alors sur l'étape d'avant */
function tourPlace(){
  if(!TOUR) return;
  {
    const st=TOUR.steps[TOUR.i], hole=tourEl('tourHole'), card=tourEl('tourCard'); if(!hole||!card) return;
    const W=innerWidth, H=innerHeight, m=16, g=14, cw=card.offsetWidth, ch=card.offsetHeight;
    const el=tourTarget(st), R=el && el.getBoundingClientRect();
    let r=null;
    if(R && R.width && R.height){
      const p=6, top=Math.max(4,R.top-p), left=Math.max(4,R.left-p);
      r={ left, top, right:Math.min(W-4,R.right+p), bottom:Math.min(H-4,R.bottom+p) };
      r.width=r.right-r.left; r.height=r.bottom-r.top;
    }
    if(r){ hole.classList.remove('none');
      Object.assign(hole.style,{left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px'}); }
    else hole.classList.add('none');
    let x, y;
    if(!r){ x=(W-cw)/2; y=(H-ch)/2; }
    else if(W<=860){ x=(W-cw)/2; y = (r.top+r.height/2 > H*.55) ? m : H-ch-m; }
    else if(r.right+g+cw+m<=W){ x=r.right+g; y=r.top; }
    else if(r.left-g-cw>=m){ x=r.left-g-cw; y=r.top; }
    else if(r.bottom+g+ch+m<=H){ x=r.left; y=r.bottom+g; }
    else if(r.top-g-ch>=m){ x=r.left; y=r.top-g-ch; }
    else { x=W-cw-m; y=H-ch-m; }
    card.style.left=Math.max(m,Math.min(x,W-cw-m))+'px';
    card.style.top =Math.max(m,Math.min(y,H-ch-m))+'px';
  }
}
document.addEventListener('keydown',e=>{
  if(!TOUR) return;
  if(e.key==='Escape'){ e.stopImmediatePropagation(); endTour(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); TOUR.i<TOUR.steps.length-1 ? tourShow(TOUR.i+1) : endTour(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); tourShow(Math.max(0,TOUR.i-1)); }
}, true);

               'Clear the shape book, purchases and current piece?'))) return;
  Object.values(LS).forEach(k=>localStorage.removeItem(k));
  state.carnet=[]; state.owned={}; state.trial=null; giftAll();
  state.draft=newDraft(model(DEFAULT_MODEL)); state.route='atelier';
  render(); toast(FEATURES.proto ? D('Prototype réinitialisé','Prototype reset') : D('Tout est réinitialisé','Everything is reset'));
}
/* ===================== reprise de la V1 =====================
   Servie à la même adresse que la V1, la V2 lit ses clés au premier passage :
   réglages (langue, unité, papier, retrait), dernière pièce, carnet.
   LECTURE SEULE : rien n'est effacé, l'ancienne version retrouve tout.
   Les formes que la V2 ne sait pas faire (fond libre, anneau, kurinuki, tour)
   restent dans la V1 : on le dit, avec le lien. */
function migrateV1(){
  let done=false; try{ done=!!localStorage.getItem('atelier-migre-v1') }catch(e){}
  if(done) return null;
  let vs=null, vc=null;
  try{ vs=JSON.parse(localStorage.getItem('gabarits-state')); vc=JSON.parse(localStorage.getItem('gabarits-carnet')); }catch(e){}
  try{ localStorage.setItem('atelier-migre-v1', String(Date.now())); }catch(e){}
  if(!vs && !(Array.isArray(vc) && vc.length)) return null;
  const out={ prefs:false, pieces:0, left:0 };
  /* une pièce V1 (forme + cotes + terre) → entrée de carnet V2 */
  const toEntry=(o, name)=>{
    const r=(+o.retrait||12)/100, dr=draftFromV1(o.shape, o.dims, name); if(!dr) return null;
    const p=dr.parts[0];
    if(o.coteType==='cru'){                              // cotes saisies au cru : on revient au fini
      const f=1-r; p.dBase*=f; p.sections.forEach(x=>{ x.d*=f; x.h*=f; });
      if(p.anse){ p.anse.h*=f; p.anse.p*=f; p.anse.w*=f; } if(p.bec) p.bec.d*=f;
    }
    if(+o.ep>0) p.thick=Math.round(o.ep*(1-r)*10)/10;   // V1 : plaque crue · V2 : paroi finie
    return dr;
  };
  if(vs && !localStorage.getItem(LS.prefs)){
    if(vs.lang==='fr'||vs.lang==='en') state.lang=vs.lang;
    if(['cm','in'].includes(vs.unit)) state.unit=vs.unit;
    if(PAPERS[vs.paper]) state.paper=vs.paper;
    if(+vs.retrait>=0 && +vs.retrait<=25) state.shrink=+vs.retrait/100;
    out.prefs=true;
  }
  if(vs && vs.shape && vs.dims && !localStorage.getItem(LS.draft)){
    const dr=toEntry({shape:vs.shape, dims:vs.dims[vs.shape], ep:vs.ep, retrait:vs.retrait, coteType:vs.coteType},
                     vs.projectName || null);
    if(dr) state.draft=dr;
  }
  (Array.isArray(vc)?vc:[]).forEach(c=>{
    if(!c || state.carnet.some(e=>e.id==='v1-'+c.id)) return;
    const dr=toEntry(c, c.name);
    if(!dr){ out.left++; return; }
    state.carnet.push({ id:'v1-'+c.id, name:c.name||dr.name, modelId:dr.modelId, combine:'side',
      parts:dr.parts.map(x=>clonePart(x)), created:Date.now(), updated:Date.now(), fromV1:true });
    out.pieces++;
  });
  persist();
  track('v1_migrated', out);
  return out;
}
/* ===================== liens du site (repris de la V1) =====================
   ?forme= / ?shape= : la forme à ouvrir (accents, ponctuation et noms anglais
   tolérés) · ?lang= : langue imposée par le site · ?abo=1 : déjà inscrit à la
   newsletter depuis le site (www. ne partage pas son stockage avec app.). */
const SHAPE_ALIASES = {
  mug:'tasse', cup:'tasse', box:'boite', cylinder:'cylindre', truncatedcone:'cone',
  plate:'assiette', dish:'plat', tray:'plat', profile:'profil', bottle:'bouteille',
  pitcher:'pichet', jug:'pichet', pyramid:'pyramide', oval:'ovale', prism:'prisme',
  facets:'facettes', vase:'facettes', cushion:'coussin', torus:'tore',
  free:'libre', custom:'libre', bowl:'bol', bol:'bol'
};
function readUrl(){
  const q=new URLSearchParams(location.search), res={};
  const lang=(q.get('lang')||'').toLowerCase();
  if(lang==='fr'||lang==='en') state.lang=lang;
  try{ if(q.get('abo')==='1'){ localStorage.setItem('gabarits-news-sub','1'); localStorage.setItem('gabarits-news-off','1'); } }catch(e){}
  const raw=q.get('forme')||q.get('shape')||'';
  if(raw){
    const k=raw.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z-]/g,'');
    const id=SHAPE_ALIASES[k.replace(/-/g,'')] || (model(k)&&!model(k).extra ? k : k.replace(/-/g,''));   // les alias de la V1 d'abord : ?forme=mug → Tasse & mug
    const m=model(id);
    if(m && shown(m) && owns(m.id)){ state.draft=newDraft(m); state.route='atelier'; state.tab='volume';
      res.shape=id; track('shape_selected', {shape:id, source:'url'}); }
    else if(m && inShop(m)){ state.route='produit'; state.productId=m.id; res.shape=id; }
    else if(['libre','tore'].includes(id) || /^(kur|tour)/.test(id) || (m && HIDE.includes(m.id))) res.v1=id;
  }
  return res;
}
const V1MIG = migrateV1();
const URLIN = readUrl();
{ const h=/^#produit\/([\w-]+)/.exec(location.hash);
  if(h && FEATURES.catalogue && inShop(model(h[1]))){ state.route='produit'; state.productId=h[1]; history.replaceState(null,'',location.pathname); } }
applyTheme();
applyAside();
applySb();
applyDa();
applyPaper();
applyFxMark();
render();
if(URLIN.v1) toastAction(D('Cette forme est dans l’ancienne version de l’outil.','This shape lives in the old version of the tool.'),
  D('Ouvrir ↗','Open ↗'), ()=>{ track('v1_fallback_click',{shape:URLIN.v1, source:'url'});
    window.open(`${V1_URL}?forme=${encodeURIComponent(URLIN.v1)}&lang=${state.lang}`,'_blank'); }, 12000);
else if(V1MIG && (V1MIG.pieces || V1MIG.left))
  toast(D(`${V1MIG.pieces} pièce${V1MIG.pieces>1?'s':''} reprise${V1MIG.pieces>1?'s':''} de l’ancienne version`,
          `${V1MIG.pieces} piece${V1MIG.pieces>1?'s':''} carried over from the old version`)
    + (V1MIG.left ? D(` · ${V1MIG.left} y reste${V1MIG.left>1?'nt':''} (kurinuki, tour, fond libre…)`,
                      ` · ${V1MIG.left} stay${V1MIG.left>1?'':'s'} there (kurinuki, wheel, free base…)`) : ''), 6000);
if(FEATURES.visite && GC.tourAuto && state.route==='atelier'){
  let seen=false; try{ seen=!!localStorage.getItem(TOUR_SEEN) }catch(e){}
  if(!seen) setTimeout(startTour, 500);
}
</script>
