/* ================================================================
   EXPORT PDF — reprend le gabarit de page de l'outil V1 (conversation
   « Modèle PDF imprimable ») : bandeau (marque · pastille · sujet ·
   barre témoin de 50 mm graduée au cm), zone de tracé y = 24 → 282,
   pied (source · cotes · mini-carte d'assemblage · pagination).
   Les gabarits sortent à l'échelle 1:1, mosaïqués sur plusieurs A4
   quand la pièce dépasse la feuille.
   ================================================================ */
const PDF_INK=[35,39,31], PDF_TERRA=[74,114,99], PDF_GREY=[86,90,77],
      PDF_LINE=[227,226,211], PDF_WASH=[244,242,232];
/* Formats d'impression. La zone de tracé se déduit du format : marges de 10 mm,
   bandeau jusqu'à y = 24, pied sur les 15 derniers mm. */
const PAPERS = { a4:{name:'A4', w:210, h:297}, a3:{name:'A3', w:297, h:420}, letter:{name:'Letter', w:215.9, h:279.4} };
const paper = () => PAPERS[state.paper] || PAPERS.a4;
const pdfFormat = () => PAPERS[state.paper] ? state.paper : 'a4';   // nom de format jsPDF (a4 | a3 | letter)
/* Correction d'imprimante : certaines imprimantes (et l'impression depuis un
   téléphone ou une tablette, qui « ajuste » toujours) réduisent la page de
   quelques %. On mesure la barre témoin, on saisit sa longueur, et le PDF
   suivant sort agrandi d'autant (sondage oct. 2026 : « pas la bonne échelle »). */
const printFix = () => { const k=+state.printFix; return k>=.85 && k<=1.15 ? k : 1; };
const PG = { X0:10, Y0:24, W:190, H:258 };          // recalculé par applyPaper()
let SHEET_M = 10, SHEET_R = 200;                    // marges gauche / droite
function applyPaper(id){
  if(id && id!==state.paper) track('paper_changed', {paper:id});
  if(id) state.paper=id;
  const p=paper();
  PG.W = p.w - 2*PG.X0;
  PG.H = p.h - PG.Y0 - 15;
  SHEET_R = p.w - SHEET_M;
}
const pdfPageH = doc => doc.internal.pageSize.getHeight();   // toutes les pages sont en portrait, au format choisi
/* Une page du PDF : même format, toujours en portrait. Mélanger portrait et
   paysage (la V1 le faisait pour les mosaïques) fait sortir une feuille sur
   deux à une autre échelle dès que l'imprimante « ajuste » la page.
   La page s'ouvre sur la correction d'imprimante (agrandissement autour du
   centre), refermée par pdfPaginate. */
function pdfPage(doc, first){
  if(!first) doc.addPage(pdfFormat(), 'portrait');
  const k=printFix();
  if(k===1) return;
  const W=doc.internal.pageSize.getWidth()*72/25.4, H=pdfPageH(doc)*72/25.4;
  doc.internal.write('q', k.toFixed(5), '0 0', k.toFixed(5), ((1-k)*W/2).toFixed(3), ((1-k)*H/2).toFixed(3), 'cm');
}
function pdfNewDoc(){
  const doc=pdfSafeDoc(new window.jspdf.jsPDF({unit:'mm', format:pdfFormat(), orientation:'portrait', compress:true}));
  // Acrobat et le lecteur PDF de Chrome proposent alors « taille réelle » au lieu d'« ajuster »
  try{ doc.viewerPreferences({PrintScaling:'None'}); }catch(e){}
  doc.setProperties({title:'Gabarits céramique', creator:'gabarits-ceramique.com'});
  pdfPage(doc, true);
  return doc;
}

let pdfLibs=false;
async function ensurePdfLibs(){
  if(pdfLibs) return true;
  const load = src => new Promise((ok,ko)=>{ const t=document.createElement('script');
    t.src=src; t.onload=ok; t.onerror=ko; document.head.appendChild(t); });
  try{
    await load('https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js');
    await load('https://unpkg.com/svg2pdf.js@2.2.4/dist/svg2pdf.umd.min.js');
    pdfLibs = !!(window.jspdf && window.jspdf.jsPDF);
  }catch(e){ pdfLibs=false; }
  return pdfLibs;
}

/* Les polices standard du PDF sont en WinAnsi : « ≈ », « × », « → » sortiraient
   en charabia. On patche doc.text une fois pour toutes. */
const PDF_SUBST={'≈':'~','≠':'!=','≤':'<=','≥':'>=','−':'-','×':'x',
  '″':'"','′':"'",'→':'->','←':'<-','↔':'<->','↑':'^','↓':'v',
  'π':'pi','✓':'v','⚠':'!','·':'-','∅':'D'};
const PDF_HIGH='€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ';
function pdfSafeDoc(doc){
  const fix = t => Array.isArray(t) ? t.map(fix) : typeof t!=='string' ? t
    : t.replace(/[^\u0000-\u00ff]/g, c => PDF_SUBST[c]!==undefined ? PDF_SUBST[c]
        : PDF_HIGH.includes(c) ? c : '');
  const txt=doc.text.bind(doc), spl=doc.splitTextToSize.bind(doc), wid=doc.getTextWidth.bind(doc);
  doc.text=(t,...r)=>txt(fix(t),...r);
  doc.splitTextToSize=(t,...r)=>spl(fix(t),...r);
  doc.getTextWidth=t=>wid(fix(t));
  return doc;
}
function pdfFit(doc, txt, max, size, min){
  let s=size; doc.setFontSize(s);
  while(s>(min||5.5) && doc.getTextWidth(txt)>max){ s-=.25; doc.setFontSize(s); }
  if(doc.getTextWidth(txt)>max){
    while(txt.length>2 && doc.getTextWidth(txt+'…')>max) txt=txt.slice(0,-1);
    txt+='…';
  }
  return txt;
}
/* barre témoin de 50 mm graduée au cm — le contrôle « imprimé à 100 % » */
function pdfScaleBar(doc,x,y){
  doc.setDrawColor(...PDF_INK); doc.setLineWidth(.35); doc.line(x,y,x+50,y);
  for(let i=0;i<=5;i++){ const gx=x+i*10; doc.line(gx, y-(i%5?1.4:2.4), gx, y); }
  doc.setFont('helvetica','normal'); doc.setFontSize(5.8); doc.setTextColor(...PDF_GREY);
  doc.text(D('contrôle : cette barre = 50 mm','check: this bar = 50 mm'), x, y+3.2);
  doc.text(printFix()===1 ? '100 %' : `100 % ${D('corr.','corr.')} ${fixPct(printFix())}`, x+50, y+3.2, {align:'right'});
}
function pdfChip(doc, letter, x, y){
  doc.setFillColor(...PDF_TERRA); doc.roundedRect(x,y,6.2,6.2,1.4,1.4,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(String(letter).length>2?5.5:9);
  doc.setTextColor(255,255,255);
  doc.text(String(letter), x+3.1, y+4.3, {align:'center'});
}
function pdfBand(doc, hd, pageW){
  pageW=pageW||doc.internal.pageSize.getWidth(); const M=10, right=pageW-M;
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...PDF_INK);
  doc.text('Gabarits', M, 11.5);
  doc.setTextColor(...PDF_TERRA); doc.text('céramique', M+doc.getTextWidth('Gabarits '), 11.5);
  pdfScaleBar(doc, right-50, 11);
  const x0=M+40, xMax=right-54;
  if(hd.subject){
    let x=x0;
    if(hd.chip){ pdfChip(doc, hd.chip, x, 6.4); x+=8.4; }

    doc.text(pdfFit(doc, hd.subject, xMax-x, 9.5), x, 11);
    if(hd.detail){
      doc.setFont('helvetica','normal'); doc.setTextColor(...PDF_GREY);
      doc.text(pdfFit(doc, hd.detail, xMax-x, 6.8), x, 15);
    }
  }
  doc.setDrawColor(...PDF_INK); doc.setLineWidth(.4); doc.line(M,19,right,19);
  return PG.Y0;
}
/* mini-carte d'assemblage : la grille des feuilles, celle-ci en plein */
function pdfMiniMap(doc, t, xRight, yBase){
  const c=Math.min(2.1, 4.6/t.rows), w=t.cols*c, h=t.rows*c, x=xRight-w, y=yBase-h+.6;   // reste sous la marge de collage
  doc.setLineWidth(.15);
  for(let r=0;r<t.rows;r++) for(let q=0;q<t.cols;q++){
    const cx=x+q*c, cy=y+r*c;
    doc.setDrawColor(...PDF_LINE);
    if(r+1===t.row && q+1===t.col){ doc.setFillColor(...PDF_TERRA); doc.rect(cx,cy,c,c,'F'); }
    else { doc.setFillColor(...PDF_WASH); doc.rect(cx,cy,c,c,'FD'); }
  }
  return x;
}
function pdfFoot(doc, hd, pageW){
  pageW=pageW||doc.internal.pageSize.getWidth(); const M=10, right=pageW-M, y=pdfPageH(doc)-5.5;
  doc.setDrawColor(...PDF_LINE); doc.setLineWidth(.2); doc.line(M, y-3.2, right, y-3.2);
  doc.setFont('helvetica','normal'); doc.setFontSize(6.2); doc.setTextColor(...PDF_GREY);
  doc.text('gabarits-ceramique.com', M, y);
  let xEnd=right-16;
  if(hd.tile) xEnd=pdfMiniMap(doc, hd.tile, xEnd, y)-3;
  if(hd.dims){
    const x=M+doc.getTextWidth('gabarits-ceramique.com')+6;
    doc.setTextColor(...PDF_INK);

/* texte vertical (lu de bas en haut) centré sur cy : jsPDF applique align:'center'

function pdfVText(doc, txt, x, cy){ doc.text(txt, x, cy+doc.getTextWidth(txt)/2, {angle:90}); }

   de la feuille voisine (posée dans la marge, hors du tracé) */
function pdfTileNav(doc, t){
  if(!t) return;
  const {X0,Y0,W,H}=PG;
  doc.setFont('helvetica','bold'); doc.setFontSize(6.4); doc.setTextColor(...PDF_TERRA);
  const arrow=(cx,cy,dir)=>{ doc.setFillColor(...PDF_TERRA); const s=1.5;
    if(dir==='r') doc.triangle(cx,cy-s,cx,cy+s,cx+s*1.5,cy,'F');
    if(dir==='l') doc.triangle(cx,cy-s,cx,cy+s,cx-s*1.5,cy,'F');
    if(dir==='d') doc.triangle(cx-s,cy,cx+s,cy,cx,cy+s*1.5,'F');
    if(dir==='u') doc.triangle(cx-s,cy,cx+s,cy,cx,cy-s*1.5,'F'); };
  const at=t.nav.at||{right:H/2, left:H/2, down:W/2, up:W/2};
  const lab = n => D('feuille ','sheet ')+n;
  if(t.nav.right){ const cy=Y0+at.right; arrow(X0+W-4.5,cy,'r'); pdfVText(doc, lab(t.nav.right), X0+W-6.5, cy); }
  if(t.nav.left){  const cy=Y0+at.left;  arrow(X0+4.5,cy,'l');   pdfVText(doc, lab(t.nav.left),  X0+6.5+1.6,  cy); }
  if(t.nav.down){  const cx=X0+at.down;  arrow(cx,Y0+H-4.5,'d'); doc.text(lab(t.nav.down),  cx, Y0+H-6,  {align:'center'}); }
  if(t.nav.up){    const cx=X0+at.up;    arrow(cx,Y0+4.5,'u');   doc.text(lab(t.nav.up),    cx, Y0+8.5, {align:'center'}); }
}
function pdfPaginate(doc){
  const N=doc.getNumberOfPages();
  for(let i=1;i<=N;i++){
    doc.setPage(i);
    const pageW=doc.internal.pageSize.getWidth();
    doc.setFont('helvetica','normal'); doc.setFontSize(6.2); doc.setTextColor(...PDF_GREY);
    doc.text(`${i}/${N}`, pageW-10, pdfPageH(doc)-5.5, {align:'right'});
    if(printFix()!==1) doc.internal.write('Q');      // referme la correction ouverte par pdfPage
  }
}
/* dessine un fragment SVG. La taille en mm doit être portée par la balise <svg>
   elle-même : sans elle, svg2pdf retombe sur les unités du viewBox et le dessin
   déborde sur le texte. */
async function pdfDrawSvg(doc, svgString, x, y, w, h){
  const wrap=document.createElement('div');
  wrap.style.cssText='position:fixed;left:-9999px;top:0;width:0;height:0;overflow:hidden';
  // svg2pdf ne lit pas les variables CSS (« Parse error ») : on garde la police de repli
  wrap.innerHTML=svgString.replace(/var\(--[^)]*\)\s*,?\s*/g,'').replace('<svg ', `<svg width="${w}mm" height="${h}mm" `);
  document.body.appendChild(wrap);
  try{ await doc.svg(wrap.firstChild, {x, y, width:w, height:h}); }catch(e){}
  // un rendu interrompu laisse jsPDF en mode avancé : toutes les pages suivantes
  // sortiraient retournées et au tiers de leur taille
  if(doc.isAdvancedAPI && doc.isAdvancedAPI()) doc.compatAPI();
  wrap.remove();
}

/* ---------------------------------------------------------------
   Géométrie réelle des gabarits — tout est ramené à un POLYGONE fermé
   en mm (les arcs sont échantillonnés) : un seul chemin à dessiner, à
   translater et à découper proprement d'une feuille à l'autre.
   --------------------------------------------------------------- */
function geomOf(q){
  const P=[];
  const push=(x,y)=>P.push([x,y]);
  switch(q.kind){
    case 'disque': { const r=q.d0/2;
      for(let i=0;i<180;i++){ const t=2*Math.PI*i/180; push(r*Math.cos(t), r*Math.sin(t)); } break; }
    case 'ellipse': { const a=q.w/2, b=q.hh/2;
      for(let i=0;i<180;i++){ const t=2*Math.PI*i/180; push(a*Math.cos(t), b*Math.sin(t)); } break; }
    case 'contour': { q.pts.forEach(p=>push(p[0],p[1])); break; }   /* trous repris plus bas */
    case 'polygone': { const n=q.n||6, R=q.R;
      for(let i=0;i<n;i++){ const t=2*Math.PI*i/n+Math.PI/n; push(R*Math.cos(t), R*Math.sin(t)); } break; }
    case 'panneau': case 'bande': { const w=q.w, h=q.hh;
      push(-w/2,-h/2); push(w/2,-h/2); push(w/2,h/2); push(-w/2,h/2); break; }
    case 'trapeze': { const a=q.w0/2, b=q.w1/2, h=q.hh;
      push(-a,h/2); push(a,h/2); push(b,-h/2); push(-b,-h/2); break; }
    default: {                                   // secteur annulaire
      const ang=Math.min(q.ang,359.5)*Math.PI/180, a0=-ang/2, R=q.R, r=q.r;
      const N=Math.max(24, Math.round(ang*R/2));  // ~2 mm par segment
      for(let i=0;i<=N;i++){ const t=a0+ang*i/N; push(R*Math.sin(t), -R*Math.cos(t)); }
      for(let i=N;i>=0;i--){ const t=a0+ang*i/N; push(r*Math.sin(t), -r*Math.cos(t)); }
    }
  }
  const xs=P.map(p=>p[0]), ys=P.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  // origine ramenée en haut à gauche de l'emprise
  const pts=P.map(p=>[p[0]-x0, p[1]-y0]);
  const g={ pts, w:x1-x0, h:y1-y0, kind:q.kind };
  if(q.holes && q.holes.length)                  // evidements : meme translation
    g.holes=q.holes.map(h=>h.map(p=>[p[0]-x0, p[1]-y0]));
  if(q.kind==='secteur'){                        // le centre du compas, utile au tracé
    g.center=[0-x0, 0-y0]; g.R=q.R; g.r=q.r; g.ang=q.ang;
  }
  const J=q.seg && segJoins(q);
  if(J && J.length) g.joins=J.map(j=>({...j, a:[j.a[0]-x0, j.a[1]-y0], b:[j.b[0]-x0, j.b[1]-y0]}));
  return g;
}
/** les bords d'un tronçon qui se raccordent à un autre tronçon (pas la couture
    de la pièce) : on y imprime un cran et le repère commun « 1|2 », comme les
    crans d'un patron de couture, pour abouter sans décalage */
function segJoins(q){
  const {i, n, closed}=q.seg, J=[];
  const prev = i>1 ? i-1 : closed ? n : 0, next = i<n ? i+1 : closed ? 1 : 0;
  const lab=(a,b)=>{ const lo=Math.min(a,b), hi=Math.max(a,b);
    return lo===1 && hi===n && n>2 ? `${n}|1` : `${lo}|${hi}`; };   // l'anneau se referme : n|1
  const add=(a,b,o)=>{ if(o) J.push({a, b, lab:lab(i,o)}); };
  if(q.kind==='secteur'){
    const ang=Math.min(q.ang,359.5)*Math.PI/180, a0=-ang/2, R=q.R, r=q.r;
    const at=t=>[[r*Math.sin(t), -r*Math.cos(t)], [R*Math.sin(t), -R*Math.cos(t)]];
    add(...at(a0), prev); add(...at(a0+ang), next);
  } else if(q.kind==='bande' || q.kind==='panneau'){
    const w=q.w, h=q.hh;
    if(q.seg.long){ add([-w/2,-h/2],[-w/2,h/2], prev); add([w/2,-h/2],[w/2,h/2], next); }
    else { add([-w/2,-h/2],[w/2,-h/2], prev); add([-w/2,h/2],[w/2,h/2], next); }
  } else if(q.kind==='trapeze'){
    add([-q.w0/2,q.hh/2],[q.w0/2,q.hh/2], prev); add([-q.w1/2,-q.hh/2],[q.w1/2,-q.hh/2], next);
  }
  return J;
}
const rot90 = g => ({ ...g, w:g.h, h:g.w, rot:((g.rot||0)+1)%4,
  pts:g.pts.map(([x,y])=>[g.h-y, x]),
  holes:g.holes?g.holes.map(h=>h.map(([x,y])=>[g.h-y, x])):undefined,
  center:g.center?[g.h-g.center[1], g.center[0]]:undefined,
  joins:g.joins?g.joins.map(j=>({...j, a:[g.h-j.a[1], j.a[0]], b:[g.h-j.b[1], j.b[0]]})):undefined });

/* découpe d'un polygone par un rectangle (Sutherland-Hodgman) : c'est ce qui
   permet de ne dessiner que la portion de pièce qui appartient à la feuille. */
function clipPoly(pts, x0, y0, x1, y1){
  const inside=(p,e)=> e===0? p[0]>=x0 : e===1? p[0]<=x1 : e===2? p[1]>=y0 : p[1]<=y1;
  const cut=(a,b,e)=>{
    const t = e===0 ? (x0-a[0])/(b[0]-a[0]) : e===1 ? (x1-a[0])/(b[0]-a[0])
            : e===2 ? (y0-a[1])/(b[1]-a[1]) : (y1-a[1])/(b[1]-a[1]);
    return [a[0]+t*(b[0]-a[0]), a[1]+t*(b[1]-a[1])];
  };
  let out=pts;
  for(let e=0;e<4 && out.length;e++){
    const inp=out; out=[];
    for(let i=0;i<inp.length;i++){
      const a=inp[i], b=inp[(i+1)%inp.length];
      const ia=inside(a,e), ib=inside(b,e);
      if(ia) out.push(a);
      if(ia!==ib) out.push(cut(a,b,e));
    }
  }
  return out;
}
/* découpe du TRAIT (et non de la surface) par un rectangle : seuls les morceaux
   du contour qui passent sur la feuille sont tracés. Découper la surface
   refermait la pièce par un trait noir le long du raccord — on croyait devoir
   couper là — et reliait par un faux trait les deux bouts d'une pièce creuse
   (secteur, anneau) qui traverse le raccord deux fois. */
function clipLines(pts, x0, y0, x1, y1){
  const out=[]; let cur=null;
  for(let k=0,n=pts.length;k<n;k++){
    const a=pts[k], b=pts[(k+1)%n], dx=b[0]-a[0], dy=b[1]-a[1];
    let t0=0, t1=1, ok=true;
    for(const [p,q] of [[-dx, a[0]-x0],[dx, x1-a[0]],[-dy, a[1]-y0],[dy, y1-a[1]]]){   // Liang-Barsky
      if(Math.abs(p)<1e-12){ if(q<0){ ok=false; break; } continue; }
      const r=q/p;
      if(p<0){ if(r>t1){ ok=false; break; } if(r>t0) t0=r; }
      else   { if(r<t0){ ok=false; break; } if(r<t1) t1=r; }
    }
    if(!ok){ cur=null; continue; }
    const B=[a[0]+t1*dx, a[1]+t1*dy];
    if(cur && t0===0) cur.push(B); else { cur=[[a[0]+t0*dx, a[1]+t0*dy], B]; out.push(cur); }
    if(t1<1) cur=null;
  }
  if(out.length>1){                                   // le contour fermé : le dernier morceau rejoint le premier
    const f=out[0], l=out[out.length-1], e=l[l.length-1];
    if(Math.hypot(e[0]-f[0][0], e[1]-f[0][1])<1e-9){ out[0]=l.concat(f.slice(1)); out.pop(); }
  }
  return out;
}
function pdfLines(doc, lines){
  lines.forEach(L=>{ if(L.length<2) return;
    const d=[]; for(let i=1;i<L.length;i++) d.push([L[i][0]-L[i-1][0], L[i][1]-L[i-1][1]]);
    doc.lines(d, L[0][0], L[0][1], [1,1], 'S', false); });
}
/* point dans un polygone (pair-impair) */
function inPoly(P, x, y){
  let c=false;
  for(let i=0,j=P.length-1;i<P.length;j=i++){ const a=P[i], b=P[j];
    if((a[1]>y)!==(b[1]>y) && x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]) c=!c; }
  return c;
}
/* crans d'un tronçon : un trait qui coupe le bord à son milieu et le repère
   « 1|2 » lu des deux côtés du raccord */
function pdfNotches(doc, joins, ox, oy, P, R){
  joins.forEach(j=>{
    const a=[ox+j.a[0], oy+j.a[1]], b=[ox+j.b[0], oy+j.b[1]], L=Math.hypot(b[0]-a[0], b[1]-a[1]);
    if(L<8) return;
    const m=[(a[0]+b[0])/2, (a[1]+b[1])/2], n=[-(b[1]-a[1])/L, (b[0]-a[0])/L];
    const s = inPoly(P, m[0]+n[0]*2, m[1]+n[1]*2) ? 1 : -1;          // la normale vers l'intérieur
    if(m[0]<R[0]||m[0]>R[2]||m[1]<R[1]||m[1]>R[3]) return;
    doc.setDrawColor(...PDF_TERRA); doc.setLineWidth(.6);
    doc.line(m[0]-n[0]*s*2.5, m[1]-n[1]*s*2.5, m[0]+n[0]*s*3.5, m[1]+n[1]*s*3.5);
    doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(...PDF_TERRA);
    const tx=m[0]+n[0]*s*6.5, ty=m[1]+n[1]*s*6.5+1.2;
    doc.text(j.lab, tx, ty, {align:'center'});
  });
}
function pdfPoly(doc, pts, style){
  if(pts.length<2) return;
  const d=[]; for(let i=1;i<pts.length;i++) d.push([pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]]);
  doc.lines(d, pts[0][0], pts[0][1], [1,1], style||'S', true);
}

/* ---------------------------------------------------------------
   Calepinage : le moins de feuilles possible.
   Chaque feuille, ou chaque mosaïque de feuilles aboutées, est une grille
   au millimètre. Un gabarit posé y marque sa forme réelle élargie de la
   gouttière GAP (le passage des ciseaux) : restent libres ses creux aussi,
   le dedans d'un secteur, l'entre-deux de ses bras, les coins autour d'un
   disque, où un plus petit gabarit vient se loger.
   1. Un gabarit plus grand qu'une feuille ouvre une mosaïque calée en haut
      à gauche ; un autre grand gabarit partage la mosaïque s'il y tient.
   2. Les autres se posent un à un, au plus haut puis au plus à gauche de
      la première feuille qui les accepte (quart de tour permis), sans
      enjamber un raccord de mosaïque, sauf si cela évite une feuille.
   3. Plusieurs ordres et préférences d'orientation sont essayés : on garde
      la solution qui fait le moins de feuilles.
   4. Un gabarit à imprimer sur papier cartonné ne partage sa feuille avec
      les autres que si cela économise une feuille.
   L'étiquette s'écrit DANS la pièce quand elle y tient, comme sur un patron
   de couture : le gabarit découpé garde son nom. Sinon, au-dessus.
   Coordonnées en mm ; (0,0) = coin haut gauche de la zone de tracé.
   --------------------------------------------------------------- */
const LBL = 7;                                  // hauteur d'une étiquette (deux lignes)
const LBLW = 38;                                // largeur mini d'une étiquette
const GAP = 6;                                  // passage des ciseaux entre deux gabarits
/* ---- tronçons : une pièce plus grande qu'une feuille ----
   Plutôt qu'une mosaïque (2 ou 3 feuilles scotchées, surtout vides), la pièce
   est coupée en tronçons qui tiennent chacun sur une feuille et se calent
   avec les autres gabarits ; on les scotche bord à bord avant de tracer.
   Secteur → coupes le long des rayons (tronçons identiques, même compas) ;
   bande, panneau → coupes droites ; trapèze → coupes parallèles aux bases ;
   anneau (donut) → demi-couronnes. Les autres formes restent en mosaïque. */
const SEG_MAX = 6;
const fitsSheet = g => { const W=PG.W-2, H=PG.H-2; return (g.w<=W && g.h<=H) || (g.h<=W && g.w<=H); };
function segmentsOf(q, k){
  const closed = !!q.ring || q.kind==='disque' || (q.kind==='secteur' && q.ang>=359.5), long=q.w>=q.hh;
  const tag=i=>({ letter:`${q.letter}${i+1}`, name:`${q.name} ${i+1}/${k}`, seg:{i:i+1, n:k, of:q.letter, closed, long},
    desc:`${q.desc||''} · ${D('tronçon','segment')} ${i+1}/${k}, ${D('à raccorder bord à bord','tape edge to edge')}` });
  const A=Array.from({length:k},(_,i)=>i);
  if(q.kind==='secteur') return A.map(i=>({...q, ...tag(i), ang:q.ang/k, area:(q.area||0)/k}));
  if(q.ring) return A.map(i=>({...q, ...tag(i), kind:'secteur', R:q.ring.R, r:q.ring.r, ang:360/k, pts:undefined, holes:undefined, area:(q.area||0)/k}));
  if(q.kind==='disque') return A.map(i=>({...q, ...tag(i), kind:'secteur', R:q.d0/2, r:0, ang:360/k, area:(q.area||0)/k}));
  if(q.kind==='bande' || q.kind==='panneau'){
    return A.map(i=>({...q, ...tag(i), w:long?q.w/k:q.w, hh:long?q.hh:q.hh/k, area:(q.area||0)/k}));
  }
  if(q.kind==='trapeze') return A.map(i=>{ const t0=i/k, t1=(i+1)/k;
    return {...q, ...tag(i), w0:q.w0+(q.w1-q.w0)*t0, w1:q.w0+(q.w1-q.w0)*t1, hh:q.hh/k, area:(q.area||0)/k}; });
  return null;
}
/** le plus petit nombre de tronçons qui tiennent chacun sur une feuille (null : pas découpable) */
function segCount(q){
  for(let k=2;k<=SEG_MAX;k++){ const S=segmentsOf(q,k); if(!S) return null; if(fitsSheet(geomOf(S[0]))) return k; }
  return null;
}
/* Le calepinage d'une série de formes est mémorisé : l'écran (récap, planche)
   et le PDF retombent sur exactement les mêmes feuilles. */
const PLAN_CACHE=new Map();
const PLAN_RUNS=16;          // combinaisons entier / tronçons essayées au plus
function planTemplates(st){
  applyPaper();
  /* chaque pièce : entière, ou en k tronçons (k minimal, k+1, k+2) pour celles qui ne
     tiennent pas sur une feuille. On part de « tout entier » et de « tout en tronçons »,
     puis on essaie pièce par pièce les autres découpes (deux passes, budget de temps) ;
     on garde la combinaison qui use le moins de feuilles. À égalité, les pièces entières. */
  const base=[];
  st.parts.forEach((p,pi)=>{
    const finis=pieces(p), gros=pieces(gab(p)), pre=st.parts.length>1?(pi+1)+'·':'';
    gros.forEach((q,qi)=>{ const g=geomOf(q);
      base.push({q, f:finis[qi], pi, p, pre, g, k0: fitsSheet(g) ? 0 : (segCount(q)||0)}); });
  });
  const pk=`${PG.W.toFixed(1)}x${PG.H.toFixed(1)}|${state.lang}|`+base.map(b=>[b.pre, b.q.letter, t(b.q.name), b.q.desc, b.f.desc,
    b.q.count||1, b.q.carton?1:0, b.g.w.toFixed(2), b.g.h.toFixed(2), b.g.pts.length].join('~')).join('/');
  if(PLAN_CACHE.has(pk)) return PLAN_CACHE.get(pk);
  const big=base.map((b,i)=>b.k0?i:-1).filter(i=>i>=0);
  const build=ks=>{ const items=[];
    base.forEach((b,i)=>{ const j=big.indexOf(i), k=j<0?1:ks[j];
      const item=(qq,ff,g)=>({ pi:b.pi, part:b.p, q:qq, fini:ff, g:g||geomOf(qq), rot:0, tag:b.pre+qq.letter, count:qq.count||1 });
      if(k<=1) items.push(item(b.q, b.f, b.g));
      else { const S=segmentsOf(b.q,k), F=segmentsOf(b.f,k); S.forEach((sq,x)=>items.push(item(sq, F[x]))); }
    });
    return items; };
  const run=ks=>{ const items=build(ks); return {ks, items, sheets:packTemplates(items)}; };
  let best=run(big.map(()=>1));
  if(big.length){
    /* un nombre d'essais fixe, pas un temps : un téléphone lent trouvait moins
       bien (plus de feuilles) qu'un ordinateur, et deux calculs de la même pièce
       pouvaient différer */
    let runs=1; const better=r=>r.sheets.length<best.sheets.length;
    const all=run(big.map(i=>base[i].k0)); runs++; if(better(all)) best=all;
    const opts=big.map(i=>[...new Set([1, base[i].k0, Math.min(SEG_MAX,base[i].k0+1), Math.min(SEG_MAX,base[i].k0+2)])]);
    for(let pass=0; pass<2; pass++) big.forEach((_,j)=>opts[j].forEach(k=>{
      if(k===best.ks[j] || runs>=PLAN_RUNS) return;
      const ks=best.ks.slice(); ks[j]=k; const r=run(ks); runs++; if(better(r)) best=r;
    }));
  }
  const res={sheets:best.sheets, items:best.items, where:sheetWhere(best.sheets), segmented:best.ks.some(k=>k>1)};
  if(PLAN_CACHE.size>60) PLAN_CACHE.clear();
  PLAN_CACHE.set(pk, res);
  return res;
}
/* sur quelle(s) planche(s) trouver chaque pièce (repris dans la checklist) */
function sheetWhere(sheets){
  const at={}, where={};
  sheets.forEach(s=>s.items.forEach(e=>{ (at[e.it.tag]=at[e.it.tag]||[]).push(s.no); }));
  Object.keys(at).forEach(tag=>{
    const ns=[...new Set(at[tag])].sort((a,b)=>a-b);
    where[tag] = ns.length===1 ? `${D('planche','sheet')} ${ns[0]}`
      : `${D('planches','sheets')} ${ns[0]}-${ns[ns.length-1]} (${ns.length} ${D('feuilles','pages')})`;
  });
  return where;
}

/* --- masques au millimètre --- */
const HALO = (()=>{                             // disque de la gouttière (+ 1,5 mm d'arrondi de pixel)
  const R=GAP+1.5, r=Math.ceil(R), o=[];
  for(let j=-r;j<=r;j++) for(let i=-r;i<=r;i++) if(i*i+j*j<=R*R) o.push(i,j);
  return {o, r};
})();
/* abscisses où une horizontale coupe un ou plusieurs contours fermés */
function scanX(polys, y){
  const xs=[];
  polys.forEach(P=>{
    for(let k=0,n=P.length;k<n;k++){ const a=P[k], b=P[(k+1)%n];
      if((a[1]<=y && b[1]>y) || (b[1]<=y && a[1]>y)) xs.push(a[0]+(y-a[1])*(b[0]-a[0])/(b[1]-a[1])); }
  });
  return xs.sort((p,q)=>p-q);
}
/** un gabarit orienté : les pixels qu'il touche (étiquette extérieure
    comprise), rangés en plages par ligne pour le test de place, et son
    halo (la forme élargie de GAP) qui devient occupé une fois posé */
function maskOf(g, labOut){
  const oy=labOut?LBL:0, fw=labOut?Math.max(g.w,LBLW):g.w, fh=g.h+oy;
  const cw=Math.floor(fw)+1, ch=Math.floor(fh)+1, core=new Uint8Array(cw*ch);
  const set=(x,y)=>{ const i=Math.floor(x), j=Math.floor(y);
    if(i>=0 && i<cw && j>=0 && j<ch) core[j*cw+i]=1; };
  if(labOut) for(let j=0;j<LBL;j++) for(let i=0;i<cw;i++) core[j*cw+i]=1;
  const P=g.pts;
  for(let k=0,n=P.length;k<n;k++){                       // le trait, tous les 0,25 mm
    const a=P[k], b=P[(k+1)%n], m=Math.max(1, Math.ceil(Math.hypot(b[0]-a[0], b[1]-a[1])/.25));
    for(let s=0;s<=m;s++) set(a[0]+(b[0]-a[0])*s/m, a[1]+(b[1]-a[1])*s/m+oy);
  }
  for(let j=0;j<ch;j++){                                  // le dedans (les évidements restent pleins)
    const xs=scanX([P], j+.5-oy);
    for(let k=0;k+1<xs.length;k+=2){
      const i0=Math.max(0,Math.floor(xs[k])), i1=Math.min(cw-1,Math.floor(xs[k+1]));
      for(let i=i0;i<=i1;i++) core[j*cw+i]=1;
    }
  }
  const ro=new Int32Array(ch+1), rr=[];
  for(let j=0;j<ch;j++){
    ro[j]=rr.length;
    for(let i=0;i<cw;){ if(!core[j*cw+i]){ i++; continue; } const a=i; while(i<cw && core[j*cw+i]) i++; rr.push(a,i); }
  }
  ro[ch]=rr.length;
  const pad=HALO.r, hw=cw+2*pad, hh=ch+2*pad, halo=new Uint8Array(hw*hh), o=HALO.o;
  for(let j=0;j<ch;j++) for(let i=0;i<cw;i++){
    if(!core[j*cw+i]) continue;
    const edge=i===0||j===0||i===cw-1||j===ch-1||!core[j*cw+i-1]||!core[j*cw+i+1]||!core[(j-1)*cw+i]||!core[(j+1)*cw+i];
    if(!edge){ halo[(j+pad)*hw+i+pad]=1; continue; }
    for(let k=0;k<o.length;k+=2) halo[(j+pad+o[k+1])*hw+i+pad+o[k]]=1;
  }
  return {fw, fh, oy, cw, ch, core, ro, runs:Int32Array.from(rr), pad, hw, hh, halo};
}
/** une place pour l'étiquette DANS la pièce : une case de LBL mm de haut, à
    3 mm au moins du trait et des évidements, au plus près du centre de la
    matière. excl(x,y) écarte des points (raccords de mosaïque). Le mandrin
    garde sa languette libre : la consigne de collage y est imprimée. */
function labelSpot(g, carton, excl, want){
  const cw=Math.floor(g.w)+1, ch=Math.floor(g.h)+1, ok=new Uint8Array(cw*ch);
  const polys=[g.pts].concat(g.holes||[]);
  const tab = carton ? 15+6 : 0, vert=g.h>g.w;
  for(let j=0;j<ch;j++){
    const xs=scanX(polys, j+.5);
    for(let k=0;k+1<xs.length;k+=2)
      for(let i=Math.max(0,Math.ceil(xs[k]-.5)); i<=Math.min(cw-1,Math.floor(xs[k+1]-.5)); i++) ok[j*cw+i]=1;
  }
  // à 3 mm du trait : érosion carrée, une passe par ligne puis une par colonne
  const E=3, tmp=new Uint8Array(cw*ch);
  for(let j=0;j<ch;j++){ const b=j*cw;
    for(let i=0, run=0;i<cw;i++){ run=ok[b+i]?run+1:0; if(run>2*E) tmp[b+i-E]=1; } }
  ok.fill(0);
  for(let i=0;i<cw;i++)
    for(let j=0, run=0;j<ch;j++){ run=tmp[j*cw+i]?run+1:0; if(run>2*E) ok[(j-E)*cw+i]=1; }
  if(tab || excl) for(let j=0;j<ch;j++) for(let i=0;i<cw;i++){
    if(!ok[j*cw+i]) continue;
    if((tab && (vert ? j+1>g.h-tab : i+1>g.w-tab)) || (excl && excl(i+.5, j+.5))) ok[j*cw+i]=0;
  }
  let sx=0, sy=0, n=0;
  for(let j=0;j<ch;j++) for(let i=0;i<cw;i++) if(ok[j*cw+i]){ sx+=i+.5; sy+=j+.5; n++; }
  if(!n) return null;
  // la plus large d'abord (le texte entier), puis des cases plus étroites (texte resserré)
  const W0=Math.max(LBLW, Math.min(120, Math.round(want||56)));
  const WS=[...new Set([W0, Math.round(W0*.8), Math.round(W0*.65), 56, 46, LBLW].filter(w=>w<=W0 && w>=LBLW))].sort((a,b)=>b-a);
  const tx=sx/n, ty=sy/n, LH=LBL, best=WS.map(()=>null);
  // hauteur libre sous chaque pixel, puis les plages assez hautes, ligne par ligne
  const vr=new Uint16Array(cw*(ch+1));
  for(let j=ch-1;j>=0;j--) for(let i=0;i<cw;i++) vr[j*cw+i]=ok[j*cw+i]?vr[(j+1)*cw+i]+1:0;
  for(let j=0;j+LH<=ch;j++){
    const b=j*cw, cy=(j+LH/2-ty)**2;
    for(let i=0;i<cw;){
      if(vr[b+i]<LH){ i++; continue; }
      const a=i; while(i<cw && vr[b+i]>=LH) i++;
      WS.forEach((LW,k)=>{
        if(i-a<LW) return;
        const x=Math.min(i-LW, Math.max(a, Math.round(tx-LW/2))), d=(x+LW/2-tx)**2+cy;
        if(!best[k] || d<best[k].d) best[k]={x, y:j, w:LW, d};
      });
    }
  }
  const k=best.findIndex(Boolean);
  return k<0 ? null : {x:best[k].x, y:best[k].y, w:best[k].w};
}
/* les orientations d'un gabarit (quarts de tour, doublons écartés), gardées
   en cache d'un calcul à l'autre : la forme seule les détermine */
const VAR_CACHE=new Map();
/* largeur naturelle de l'étiquette (deuxième ligne : cotes du gabarit et de la pièce finie) */
const labelWant = it => 1.02*Math.max(
  (it.tag+t(it.q.name)).length+18,
  it.q.desc.replace(/^\d+ × /,'').length+(it.fini?it.fini.desc.replace(/^\d+ × /,'').length+12:0));
function variantsOf(it){
  const g0=it.g, f=v=>v.toFixed(2), want=Math.round(labelWant(it));
  const key=[g0.kind, f(g0.w), f(g0.h), g0.pts.length, g0.pts[0].map(f), g0.pts[g0.pts.length>>1].map(f),
    (g0.holes||[]).length, it.q.carton?1:0, want,
    (g0.joins||[]).map(j=>j.lab).join(',')].join('|');           // deux tronçons identiques n'ont pas les mêmes crans
  let V=VAR_CACHE.get(key);
  if(V) return V;
  V=[]; V.key=key;
  const seen=[];
  let g=g0;
  for(let k=0;k<4;k++){
    if(k) g=rot90(g);
    const M0=maskOf(g, false);                       // doublon d'un quart de tour précédent ?
    if(seen.some(o=>o.cw===M0.cw && o.ch===M0.ch && o.core.every((b,i)=>b===M0.core[i]))) continue;
    seen.push(M0);
    const lab=labelSpot(g, !!it.q.carton, null, want);
    V.push({g, rot:k*90, lab, M: lab ? M0 : maskOf(g, true)});
  }
  if(VAR_CACHE.size>400) VAR_CACHE.clear();
  VAR_CACHE.set(key, V);
  return V;
}

/* --- une feuille ou une mosaïque : la grille d'occupation --- */
function canvasNew(cols, rows){
  const cw=Math.ceil(cols*PG.W)+2, ch=Math.ceil(rows*PG.H)+2;
  return {cols, rows, cw, ch, occ:new Uint8Array(cw*ch), prev:new Int16Array(cw*ch).fill(-1), items:[]};
}
/* pour chaque pixel : l'abscisse du dernier pixel occupé à sa gauche (ou -1) */
function canvasRows(C, y0, y1){
  for(let y=Math.max(0,y0); y<=Math.min(C.ch-1,y1); y++){
    const b=y*C.cw; let last=-1;
    for(let x=0;x<C.cw;x++){ if(C.occ[b+x]) last=x; C.prev[b+x]=last; }
  }
}
function canvasStamp(C, M, X, Y){
  const x0=X-M.pad, y0=Y-M.pad;
  for(let j=0;j<M.hh;j++){
    const y=y0+j; if(y<0||y>=C.ch) continue;
    const b=y*C.cw, hb=j*M.hw;
    for(let i=0;i<M.hw;i++){ if(!M.halo[hb+i]) continue; const x=x0+i; if(x>=0 && x<C.cw) C.occ[b+x]=1; }
  }
  canvasRows(C, y0, y0+M.hh-1);
}
/* la pièce tient-elle en (X,Y) ? -1 si oui, sinon le prochain X à essayer */
function canvasHit(C, M, X, Y){
  const prev=C.prev, cw=C.cw, ro=M.ro, rr=M.runs;
  for(let j=0;j<M.ch;j++){
    const b=(Y+j)*cw+X;
    for(let k=ro[j];k<ro[j+1];k+=2){
      const p=prev[b+rr[k+1]-1];
      if(p>=X+rr[k]) return p-rr[k]+1;
    }
  }
  return -1;
}
/* première place libre dans une fenêtre : au plus haut, puis au plus à gauche */
function canvasFit(C, M, wx0, wy0, wx1, wy1){
  const xa=Math.ceil(wx0-1e-6), xb=Math.floor(wx1-M.fw+1e-6);
  const ya=Math.ceil(wy0-1e-6), yb=Math.floor(wy1-M.fh+1e-6);
  for(let Y=ya;Y<=yb;Y++){
    let X=xa;
    while(X<=xb){ const n=canvasHit(C, M, X, Y); if(n<0) return {X, Y}; X=Math.max(X+1, n); }
  }
  return null;
}
/* les flèches de raccord d'une mosaïque se posent après coup, sur le bord,
   là où aucun gabarit ne passe (au milieu si possible) : elles ne
   réservent pas de place et ne coûtent jamais une feuille */
function canvasNavPos(C, items){
  const W=PG.W, H=PG.H, cw=C.cw, ch=C.ch, occ=new Uint8Array(cw*ch);
  C.items.forEach(e=>{ const M=e.v.M;
    for(let j=0;j<M.ch;j++) for(let k=M.ro[j];k<M.ro[j+1];k+=2)
      for(let x=e.X+M.runs[k]; x<e.X+M.runs[k+1]; x++) occ[(e.Y+j)*cw+x]=1; });
  const S=new Int32Array((cw+1)*(ch+1));
  for(let y=0;y<ch;y++){ let row=0; for(let x=0;x<cw;x++){ row+=occ[y*cw+x]; S[(y+1)*(cw+1)+x+1]=S[y*(cw+1)+x+1]+row; } }
  const free=(x0,y0,x1,y1)=>{ x0=Math.max(0,Math.floor(x0-1.5)); y0=Math.max(0,Math.floor(y0-1.5));
    x1=Math.min(cw,Math.ceil(x1+1.5)); y1=Math.min(ch,Math.ceil(y1+1.5));
    return S[y1*(cw+1)+x1]-S[y0*(cw+1)+x1]-S[y1*(cw+1)+x0]+S[y0*(cw+1)+x0]===0; };
  // le long d'un bord : la position libre la plus proche du milieu
  const slide=(len, mid, test)=>{ for(let d=0; d<=len/2-12; d+=2){ if(test(mid-d)) return mid-d; if(d && test(mid+d)) return mid+d; } return mid; };
  return (c,r)=>{ const x0=c*W, y0=r*H;
    return {
      right: slide(H, H/2, y=>free(x0+W-10, y0+y-10, x0+W, y0+y+10)),
      left:  slide(H, H/2, y=>free(x0, y0+y-10, x0+10, y0+y+10)),
      down:  slide(W, W/2, x=>free(x0+x-10, y0+H-10, x0+x+10, y0+H)),
      up:    slide(W, W/2, x=>free(x0+x-10, y0, x0+x+10, y0+10)) }; };
}

/** une passe : les grands gabarits d'abord (mosaïques), puis les autres
    dans l'ordre donné. pref : orientation préférée à l'ouverture d'une
    feuille ('first' telle quelle, 'wide' couchée, 'tall' debout). */
function packRun(V, order, pref){
  const W=PG.W, H=PG.H, Cs=[];
  const fits=v=>v.M.fw<=W+1e-6 && v.M.fh<=H+1e-6;
  const lean=v=>pref==='wide' ? v.M.fh-v.M.fw : pref==='tall' ? v.M.fw-v.M.fh : 0;
  const put=(C, i, v, X, Y)=>{ canvasStamp(C, v.M, X, Y); C.items.push({i, v, X, Y}); };
  const big=order.filter(i=>!V[i].some(fits)), small=order.filter(i=>V[i].some(fits));
  big.forEach(i=>{
    for(const C of Cs) for(const v of V[i]){
      const p=canvasFit(C, v.M, 0, 0, C.cols*W, C.rows*H);
      if(p){ put(C, i, v, p.X, p.Y); return; }
    }
    const o=V[i].map(v=>({v, n:Math.ceil(v.M.fw/W-1e-6)*Math.ceil(v.M.fh/H-1e-6)}))
      .sort((a,b)=>a.n-b.n || lean(a.v)-lean(b.v))[0];
    const C=canvasNew(Math.ceil(o.v.M.fw/W-1e-6), Math.ceil(o.v.M.fh/H-1e-6));
    Cs.push(C); put(C, i, o.v, 0, 0);
  });
  let cross=0;
  small.forEach(i=>{
    const vs=V[i].filter(fits).sort((a,b)=>lean(a)-lean(b));
    for(const C of Cs) for(let r=0;r<C.rows;r++) for(let c=0;c<C.cols;c++){
      let best=null;
      for(const v of vs){
        const p=canvasFit(C, v.M, c*W, r*H, (c+1)*W, (r+1)*H);
        if(p && (!best || p.Y<best.Y || (p.Y===best.Y && p.X<best.X))) best={...p, v};
      }
      if(best){ put(C, i, best.v, best.X, best.Y); return; }
    }
    for(const C of Cs) if(C.cols*C.rows>1) for(const v of vs){   // à cheval sur un raccord, plutôt qu'une feuille de plus
      const p=canvasFit(C, v.M, 0, 0, C.cols*W, C.rows*H);
      if(p){ put(C, i, v, p.X, p.Y); cross++; return; }
    }
    const C=canvasNew(1,1); Cs.push(C); put(C, i, vs[0], 0, 0);
  });
  let n=0;
  Cs.forEach(C=>{ for(let r=0;r<C.rows;r++) for(let c=0;c<C.cols;c++)
    if(C.items.some(e=>e.X<(c+1)*W && e.X+e.v.M.fw>c*W && e.Y<(r+1)*H && e.Y+e.v.M.fh>r*H)) n++; });
  return {Cs, n, cross};
}
/** tous les essais, puis la répartition papier / carton. Le résultat est
    gardé : la même série de formes sur le même papier se recalepine à l'identique */
const PACK_CACHE=new Map();
function packTemplates(items){
  const V=items.map(variantsOf);
  const ck=`${PG.W.toFixed(1)}x${PG.H.toFixed(1)}|`+V.map(v=>v.key).join('/');
  if(PACK_CACHE.has(ck)) return canvasSheets(PACK_CACHE.get(ck), items);
  const M0=i=>V[i][0].M;
  const keys=[ i=>M0(i).fw*M0(i).fh, i=>Math.max(M0(i).fw, M0(i).fh), i=>M0(i).fh, i=>M0(i).fw ];
  const solve=idx=>{
    let best=null; const seen=new Set();
    keys.forEach(key=>{
      const order=idx.slice().sort((a,b)=>key(b)-key(a)), sig=order.join(',');
      if(seen.has(sig)) return; seen.add(sig);
      ['first','wide','tall'].forEach(pref=>{
        const r=packRun(V, order, pref);
        if(!best || r.n<best.n || (r.n===best.n && r.cross<best.cross)) best=r;
      });
    });
    return best;
  };
  const all=items.map((_,i)=>i), isC=i=>!!items[i].q.carton;
  let res=solve(all);
  const pap=all.filter(i=>!isC(i)), car=all.filter(isC);
  if(pap.length && car.length){
    const a=solve(pap), b=solve(car);
    if(a.n+b.n<=res.n) res={Cs:a.Cs.concat(b.Cs), n:a.n+b.n, cross:a.cross+b.cross};   // à égalité, chaque papier sa feuille
  }
  res.Cs.forEach(C=>{ C.occ=null; C.prev=null; });          // seules les positions comptent désormais
  /* les feuilles dans l'ordre du montage : celle qui porte A d'abord, puis B…,
     les tronçons à la suite (A1, A2…), la forme 1 d'un lot avant la forme 2.
     items arrive déjà dans cet ordre : on range par le plus petit indice porté. */
  const first=C=>Math.min(...C.items.map(e=>e.i));
  res.Cs.sort((a,b)=>first(a)-first(b));
  if(PACK_CACHE.size>240) PACK_CACHE.clear();
  PACK_CACHE.set(ck, res.Cs);
  return canvasSheets(res.Cs, items);
}
/** des grilles aux feuilles à imprimer : une feuille par case de mosaïque
    qui porte quelque chose, numérotées dans l'ordre */
function canvasSheets(Cs, items){
  const W=PG.W, H=PG.H, sheets=[];
  const area=P=>{ let a=0; for(let k=0;k<P.length;k++){ const p=P[k], q=P[(k+1)%P.length]; a+=p[0]*q[1]-q[0]*p[1]; } return Math.abs(a)/2; };
  Cs.forEach(C=>{
    const multi=C.cols*C.rows>1;
    // l'étiquette d'une pièce à cheval sur un raccord se déplace hors du raccord
    if(multi) C.items.forEach(e=>{
      if(e.lab!==undefined) return;                     // déjà réglée (calepinage repris du cache)
      const lab=e.v.lab; e.lab=lab;
      if(!lab) return;
      const near=(x,y)=>{ const X=e.X+x, Y=e.Y+y;
        for(let c=1;c<C.cols;c++) if(Math.abs(X-c*W)<2) return true;
        for(let r=1;r<C.rows;r++) if(Math.abs(Y-r*H)<2) return true;
        return false; };
      let cut=false;
      for(let x=lab.x; x<=lab.x+lab.w && !cut; x+=1) for(let y=lab.y; y<=lab.y+LBL; y+=1) if(near(x,y)){ cut=true; break; }
      if(cut){ const l2=labelSpot(e.v.g, !!items[e.i].q.carton, near, lab.w); if(l2) e.lab=l2; }
    });
    const cells=[];
    for(let r=0;r<C.rows;r++) for(let c=0;c<C.cols;c++){
      const x0=c*W, y0=r*H;
      const here=C.items.slice().sort((a,b)=>a.i-b.i).filter(e=>{
        const g=e.v.g, oy=e.Y+e.v.M.oy;
        const P=clipPoly(g.pts.map(([px,py])=>[e.X+px, oy+py]), x0, y0, x0+W, y0+H);
        if(P.length>2 && area(P)>1) return true;
        const lab=e.lab!==undefined?e.lab:e.v.lab;
        const lx=lab?e.X+lab.x:e.X, ly=lab?oy+lab.y:e.Y;
        return lx>=x0 && lx<x0+W && ly>=y0 && ly<y0+H;
      });
      if(here.length) cells.push({c, r, here});
    }
    const base=sheets.length, pos=multi?canvasNavPos(C, items):null;
    const num=(c,r)=>{ const k=cells.findIndex(o=>o.c===c && o.r===r); return k<0?0:k+1; };   // « feuille n sur N » de la mosaïque
    const spans={};
    cells.forEach(L=>L.here.forEach(e=>{ spans[e.i]=(spans[e.i]||0)+1; }));
    cells.forEach((L,k)=>sheets.push({
      cols:C.cols, rows:C.rows, col:L.c+1, row:L.r+1, n:k+1, N:cells.length, no:base+k+1,
      nav: multi ? {right:num(L.c+1,L.r), left:num(L.c-1,L.r), down:num(L.c,L.r+1), up:num(L.c,L.r-1), at:pos(L.c,L.r)} : null,
      items: L.here.map(e=>({ it:items[e.i], g:e.v.g, rot:e.v.rot, M:e.v.M,
        lab: e.lab!==undefined?e.lab:e.v.lab, x:e.X-L.c*W, y:e.Y-L.r*H, spans:spans[e.i] })),
      carton: C.items.some(e=>!!items[e.i].q.carton),
      kind: multi?'tile':'flat' }));
    // l'orientation retenue devient celle du gabarit (vignettes, étiquette)
    C.items.forEach(e=>{ items[e.i].g=e.v.g; items[e.i].rot=e.v.rot; });
  });
  return sheets;
}

/* ---------------------------------------------------------------
   Premières pages : la planche d'assemblage, calquée sur l'aperçu
   « Planche » de l'atelier — titre en capitales espacées, grille
   vue éclatée / spécifications, puis les vignettes des gabarits.
   --------------------------------------------------------------- */
function pdfRule(doc, y, x0, x1, dark){
  doc.setDrawColor(...(dark?PDF_INK:PDF_LINE)); doc.setLineWidth(dark?.3:.15);
  doc.line(x0===undefined?SHEET_M:x0, y, x1===undefined?SHEET_R:x1, y);
}
/* intitulé de section : capitales espacées + filet, comme dans l'aperçu */
function pdfSection(doc, txt, y, x0, x1){
  doc.setFont('courier','bold'); doc.setFontSize(6.6); doc.setTextColor(...PDF_INK);
  doc.setCharSpace(.55); doc.text(txt.toUpperCase(), x0===undefined?SHEET_M:x0, y); doc.setCharSpace(0);
  pdfRule(doc, y+1.6, x0, x1, true);
  return y+5.4;
}
/* tableau clé / valeur à filets pointillés */
function pdfKV(doc, rows, x, w, y){
  rows.forEach(r=>{
    doc.setFont('courier','normal'); doc.setFontSize(6.4); doc.setTextColor(...PDF_GREY);
    doc.text(pdfFit(doc, String(r[0]).toUpperCase(), w*0.58, 6.4), x, y);
    doc.setTextColor(...PDF_INK); doc.setFontSize(6.4);
    doc.text(pdfFit(doc, String(r[1]), w*0.42, 6.4), x+w, y, {align:'right'});
    doc.setLineDashPattern([.4,.7],0); pdfRule(doc, y+1.5, x, x+w); doc.setLineDashPattern([],0);
    y+=4.9;
  });
  return y;
}
function pdfPara(doc, txt, x, w, y, size){
  doc.setFont('courier','normal'); doc.setFontSize(size||6.4); doc.setTextColor(...PDF_INK);
  doc.splitTextToSize(txt, w).forEach(l=>{ doc.text(l, x, y); y+=3.4; });
  return y;
}
/* vignette d'un gabarit — l'équivalent des cartes « .pat » de l'aperçu */
function pdfPatCard(doc, it, x, y, w, h, where){
  doc.setDrawColor(...PDF_LINE); doc.setLineWidth(.2); doc.roundedRect(x, y, w, h, 1.2, 1.2, 'S');
  const dh=h-12.6, g=it.g;
  const sc=Math.min((w-7)/g.w, (dh-6)/g.h);                // la vignette s'arrête au-dessus du renvoi « planche n »
  const ox=x+(w-g.w*sc)/2, oy=y+2+(dh-4-g.h*sc)/2;
  doc.setDrawColor(...PDF_INK); doc.setLineWidth(.3);
  pdfPoly(doc, g.pts.map(([px,py])=>[ox+px*sc, oy+py*sc]));
  if(it.count>1){
    doc.setFont('courier','normal'); doc.setFontSize(5.4); doc.setTextColor(...PDF_GREY);
    doc.text('x'+it.count, x+w-2, y+dh+.5, {align:'right'});
  }
  if(where){
    doc.setFont('courier','normal'); doc.setFontSize(5); doc.setTextColor(...PDF_TERRA);
    doc.text(where, x+2, y+dh+.5);
  }
  let ty=y+h-8.2;
  pdfRule(doc, ty-3, x+1.5, x+w-1.5);
  doc.setFont('courier','bold'); doc.setFontSize(5.6); doc.setTextColor(...PDF_INK);
  doc.setCharSpace(.3);
  doc.text(pdfFit(doc, `${it.tag} · ${t(it.q.name).toUpperCase()}`, w-3, 5.6), x+w/2, ty, {align:'center'});
  doc.setCharSpace(0);
  doc.setFont('courier','normal'); doc.setFontSize(4.9); doc.setTextColor(...PDF_GREY);
  doc.text(pdfFit(doc, it.q.desc, w-3, 4.9), x+w/2, ty+3, {align:'center'});
  doc.text(pdfFit(doc, D('fini : ','finished: ')+it.fini.desc, w-3, 4.9), x+w/2, ty+5.8, {align:'center'});
}
/* yMax : la grille ne descend pas plus bas. Beaucoup de gabarits : plus de
   colonnes et des vignettes moins hautes, plutôt que de passer sous l'encadré */
function pdfPatGrid(doc, items, plan, y, yMax){
  const gap=3, n=items.length;
  let cols=Math.min(5, Math.max(3, n)), h=34;
  if(yMax) for(let c=cols;c<=8;c++){
    const rows=Math.ceil(n/c), hh=Math.min(34, (yMax-y)/rows-gap);
    cols=c; h=Math.max(22, hh);
    if(hh>=26) break;
  }
  const w=(SHEET_R-SHEET_M-gap*(cols-1))/cols;
  items.forEach((it,i)=>{
    const c=i%cols, r=Math.floor(i/cols);
    pdfPatCard(doc, it, SHEET_M+c*(w+gap), y+r*(h+gap), w, h, plan.where[it.tag]);
  });
  return y+Math.ceil(items.length/cols)*(h+gap);
}
/* en-tête de la planche : titre en capitales + ligne de contexte */
function pdfSheetTitle(doc, title, sub){
  let y=PG.Y0+7;
  doc.setFont('courier','bold'); doc.setFontSize(19); doc.setTextColor(...PDF_INK);
  doc.setCharSpace(1.1);
  doc.text(pdfFit(doc, title.toUpperCase(), SHEET_R-SHEET_M, 19, 11), SHEET_M, y);
  doc.setCharSpace(0);
  y+=4.4;
  doc.setFont('courier','normal'); doc.setFontSize(6); doc.setTextColor(...PDF_GREY);
  doc.setCharSpace(.5); doc.text(sub.toUpperCase(), SHEET_M, y); doc.setCharSpace(0);
  return y+5;
}
/* bloc d'une forme : vue éclatée encadrée + spécifications + montage */
async function pdfFormBlock(doc, p, y, opts){
  const LW=88, RX=SHEET_M+LW+8, RW=SHEET_R-RX, VH=opts.viewH||118;
  doc.setDrawColor(...PDF_LINE); doc.setLineWidth(.2);

    +'Reporte chaque lettre au dos de la plaque découpée.',

/* encadré de rappel, repris de la fiche d'atelier V1 */
/** les pièces imprimées en tronçons, pour l'encadré : « A (3), 2·B (2) » */
function segNote(plan){
  const n={}; (plan&&plan.items||[]).forEach(it=>{ if(it.q.seg){ const k=it.tag.replace(/\d+$/,''); n[k]=it.q.seg.n; } });
  const l=Object.keys(n); if(!l.length) return '';
  return D(`En tronçons : ${l.map(k=>`${k} (${n[k]})`).join(', ')}. Les scotcher bord à bord, crans en face (1|2 contre 1|2…), avant de tracer sur la plaque.`,
           `In segments: ${l.map(k=>`${k} (${n[k]})`).join(', ')}. Tape them edge to edge, notches facing (1|2 against 1|2…), before tracing on the slab.`);
}
/** les mosaïques, pour l'encadré */
const tileNote = plan => plan && plan.sheets.some(s=>s.kind==='tile')
  ? D('Mosaïque : couper la marge sur le trait du côté indiqué, poser la feuille sur la marge grise de sa voisine en refermant les losanges, scotcher.',
      'Tiled sheets: cut the margin on the marked side, lay the sheet over its neighbour’s grey margin so the diamonds close up, then tape.') : '';
function pdfBeforeBox(doc, y, extra){
  extra=(extra||[]).filter(Boolean);
  y-=4.4*extra.length;                              // une ligne de plus : l'encadré monte, le pied ne bouge pas
  const h=25+4.4*extra.length, seg=extra.length?extra:null;
  doc.setDrawColor(...PDF_TERRA); doc.setLineWidth(.4);

  doc.setFont('courier','bold'); doc.setFontSize(6.4); doc.setTextColor(...PDF_TERRA);
  doc.setCharSpace(.5); doc.text(D('AVANT DE DÉCOUPER','BEFORE YOU CUT'), SHEET_M+4, y+5.6); doc.setCharSpace(0);
  doc.setFont('courier','normal'); doc.setFontSize(6); doc.setTextColor(...PDF_INK);
  (state.lang==='en' ? [
    `Print on ${paper().name} paper at 100 % / actual size (never “fit to page”), then check the bar in the header: it must measure 50 mm.`,
    'Copy each template letter onto the back of the cut slab: that is what points back to the exploded view.',
    'Printed dimensions are the template’s, already scaled up for shrinkage; the finished size is recalled underneath.'
  ] : [
    `Imprimer sur du ${paper().name}, à 100 % ou « taille réelle » (surtout pas « ajuster »), puis vérifier la barre témoin du bandeau : elle doit mesurer 50 mm.`,
    'Reporter la lettre de chaque gabarit au dos de la plaque découpée : c’est elle qui renvoie à la vue éclatée.',
    'Les cotes imprimées sont celles du gabarit, déjà agrandi du retrait ; la cote finie est rappelée en dessous.'
  ]).concat(seg||[]).forEach((t,i)=>{
    doc.text('•', SHEET_M+4, y+11+i*4.4);

/* marque du centre de compas d'un secteur (souvent hors feuille : on le dit) */
function pdfCenterMark(doc, cx, cy, g, clipRect){

/* raccord de mosaïque, par recouvrement : la feuille de droite (ou du dessous)
   perd sa marge gauche (haute), coupée sur le pointillé, et se pose sur la
   marge grisée de sa voisine. Les demi-losanges de part et d'autre du raccord
   se referment quand les feuilles sont bien calées : plus besoin de couper
   les deux bords au millimètre (sondage : « l'autre moitié de la paroi n'était
   pas à la même cote », « les parois ne formaient pas un cercle »). */
const GLUE = 4.5;
function pdfTileJoin(doc, nav){
  const {X0,Y0,W,H}=PG, x1=X0+W, y1=Y0+H, d=2.6;
  doc.setFillColor(...PDF_WASH);
  if(nav.right) doc.rect(x1, Y0, GLUE, H+(nav.down?GLUE:0), 'F');
  if(nav.down)  doc.rect(X0, y1, W, GLUE, 'F');
  doc.setDrawColor(...PDF_LINE); doc.setLineWidth(.25); doc.setLineDashPattern([2.5,2],0);
  doc.rect(X0, Y0, W, H); doc.setLineDashPattern([],0);
  doc.setDrawColor(...PDF_INK); doc.setLineWidth(.3);       // le bord à couper, en trait plus franc
  if(nav.left) doc.line(X0, Y0, X0, y1);
  if(nav.up)   doc.line(X0, Y0, x1, Y0);
  doc.setFillColor(...PDF_TERRA);
  const tri=(x,y,dir)=>{                                    // demi-losange posé sur le raccord
    if(dir==='l') doc.triangle(x,y-d,x,y+d,x-d,y,'F'); if(dir==='r') doc.triangle(x,y-d,x,y+d,x+d,y,'F');
    if(dir==='u') doc.triangle(x-d,y,x+d,y,x,y-d,'F'); if(dir==='d') doc.triangle(x-d,y,x+d,y,x,y+d,'F'); };
  [.18,.82].forEach(f=>{
    if(nav.right) tri(x1, Y0+H*f, 'l');  if(nav.left) tri(X0, Y0+H*f, 'r');
    if(nav.down)  tri(X0+W*f, y1, 'u');  if(nav.up)   tri(X0+W*f, Y0, 'd');
  });
  doc.setFont('helvetica','normal'); doc.setFontSize(5.4); doc.setTextColor(...PDF_GREY);
  const cut=n=>D(`couper sur ce trait, poser sur la marge grise de la feuille ${n} : les losanges se referment`,
                 `cut on this line, lay over the grey margin of sheet ${n}: the diamonds close up`);
  if(nav.left) pdfVText(doc, cut(nav.left), X0-1.6, Y0+H/2);
  if(nav.up)   doc.text(cut(nav.up), X0+W/2, Y0-1.4, {align:'center'});
  doc.setTextColor(...PDF_TERRA);
  if(nav.right) pdfVText(doc, D(`feuille ${nav.right} par-dessus`,`sheet ${nav.right} goes on top`), x1+GLUE/2+.9, Y0+H*.5);
  if(nav.down)  doc.text(D(`feuille ${nav.down} par-dessus`,`sheet ${nav.down} goes on top`), X0+W*.5, y1+GLUE/2+1, {align:'center'});
}
/* une feuille de gabarits : seule, ou une case de mosaïque. Chaque gabarit
   qui la touche y est tracé, découpé au bord de la zone de tracé. */
function pdfAnySheet(doc, sheet, st, no, total){
  const poster=sheet.cols*sheet.rows>1, its=sheet.items;
  const cartonTxt=D('À IMPRIMER SUR PAPIER CARTONNÉ 160-220 g','PRINT ON 160-220 gsm CARD STOCK');
  const tagOf=it=>it.tag+(it.count>1?` ×${it.count}`:'');
  const listTxt=`${D('à découper','to cut')} : ${its.map(e=>tagOf(e.it)).join(', ')}`;
  if(poster){
    const bigs=its.filter(e=>e.spans>1), lead=bigs.length?bigs:its, rest=its.filter(e=>!lead.includes(e));
    pdfBand(doc, { chip:lead[0].it.tag,
      subject: lead.map(e=>`${e.it.tag} · ${t(e.it.q.name)}${e.it.count>1?` ×${e.it.count}`:''}`).join('  +  '),
      detail:[sheet.carton?cartonTxt:t(st.name),
        `${D('mosaïque','tiled')} ${sheet.cols}×${sheet.rows} · ${D('feuille','sheet')} ${sheet.n} ${D('sur','of')} ${sheet.N}`,
        rest.length?`+ ${rest.map(e=>e.it.tag).join(', ')}`:''].filter(Boolean).join(' · ') });
  } else pdfBand(doc, {
    chip: its.length===1?its[0].it.tag:'',
    subject: its.length===1
      ? `${its[0].it.tag} · ${t(its[0].it.q.name)}${its[0].it.count>1?` ×${its[0].it.count}`:''}`
      : `${D('Planche','Sheet')} ${no} · ${its.length} ${D('gabarits','templates')}`,
    detail: `${sheet.carton?cartonTxt:t(st.name)} · ${listTxt}` });
  const R=[PG.X0, PG.Y0, PG.X0+PG.W, PG.Y0+PG.H];
  const inR=(x,y)=>x>=R[0]-.01 && x<=R[2]+.01 && y>=R[1]-.01 && y<=R[3]+.01;
  if(poster) pdfTileJoin(doc, sheet.nav);

  // le centre du compas ne se marque pas sur un autre gabarit
  const boxes=its.map(e=>({e, x0:PG.X0+e.x, y0:PG.Y0+e.y, x1:PG.X0+e.x+e.M.fw, y1:PG.Y0+e.y+e.M.fh}));
  const covered=(cx,cy,self)=>boxes.some(b=>b.e!==self && cx+25>=b.x0 && cx-4<=b.x1 && cy+4>=b.y0 && cy-4<=b.y1);
  its.forEach(e=>{
    const it=e.it, g=e.g, ox=PG.X0+e.x, oy=PG.Y0+e.y+e.M.oy;
    const P=g.pts.map(([px,py])=>[ox+px, oy+py]);
    doc.setDrawColor(0,0,0); doc.setLineWidth(.5);
    [P].concat((g.holes||[]).map(h=>h.map(([px,py])=>[ox+px, oy+py]))).forEach(L=>pdfLines(doc, clipLines(L, ...R)));
    if(g.joins) pdfNotches(doc, g.joins, ox, oy, P, R);
    if(g.center && !covered(ox+g.center[0], oy+g.center[1], e)) pdfCenterMark(doc, ox+g.center[0], oy+g.center[1], g, R);
    if(it.q.carton && g.center && it.q.tabAng){       // mandrin conique : le trait suit un rayon
      const cx=ox+g.center[0], cy=oy+g.center[1];
      const dir=t=>{ let v=[Math.sin(t), -Math.cos(t)]; for(let i=0;i<(g.rot||0);i++) v=[-v[1], v[0]]; return v; };   // quart(s) de tour du calepinage
      const t=(Math.min(it.q.ang,359.5)/2-it.q.tabAng)*Math.PI/180, u=dir(t);
      doc.setLineDashPattern([2,1.4],0); doc.setLineWidth(.45);
      doc.line(cx+g.r*u[0], cy+g.r*u[1], cx+g.R*u[0], cy+g.R*u[1]);
      doc.setLineDashPattern([],0);
      doc.setFont('courier','bold'); doc.setFontSize(6); doc.setTextColor(35,39,31);
      const um=dir((Math.min(it.q.ang,359.5)/2-it.q.tabAng/2)*Math.PI/180), rr=(g.R+g.r)/2;
      doc.text(D('LANGUETTE','TAB'), cx+rr*um[0], cy+rr*um[1], {align:'center', angle:-Math.atan2(um[1],um[0])*180/Math.PI});
    } else if(it.q.carton && (!it.q.seg || it.q.seg.i===it.q.seg.n)){   // mandrin : trait d'alignement et languette de 15 mm (dernier tronçon seulement)
      const vert=g.h>g.w, L=15;
      doc.setLineDashPattern([2,1.4],0); doc.setLineWidth(.45);
      if(vert) doc.line(ox, oy+g.h-L, ox+g.w, oy+g.h-L);
      else doc.line(ox+g.w-L, oy, ox+g.w-L, oy+g.h);
      doc.setLineDashPattern([],0);
      doc.setFont('courier','bold'); doc.setFontSize(7); doc.setTextColor(35,39,31);
      const msg=pdfFit(doc, D('ALIGNER ICI LE BORD OPPOSÉ · LANGUETTE À COLLER','ALIGN THE OPPOSITE EDGE HERE · GLUE TAB'), (vert?g.w:g.h)-4, 7, 4.5);
      if(vert) doc.text(msg, ox+g.w/2, oy+g.h-L-2, {align:'center'});
      else pdfVText(doc, msg, ox+g.w-L-2, oy+g.h/2);
    }
    // étiquette : dans la pièce si elle y tient, sinon au-dessus (une seule fois)
    if(e.lab){ const bx=ox+e.lab.x, by=oy+e.lab.y;
      if(inR(bx, by)) pdfPieceLabel(doc, it, bx+1, by+3, e.lab.w-2); }
    else { const bx=PG.X0+e.x, by=PG.Y0+e.y;
      if(inR(bx, by)) pdfPieceLabel(doc, it, bx, by+3, e.M.fw); }
  });
  if(poster) pdfTileNav(doc, {nav:sheet.nav});
  pdfFoot(doc, { dims: its.map(e=>`${e.it.tag} ${e.it.q.desc}`).join('   ·   '),
    tile: poster?{cols:sheet.cols, rows:sheet.rows, col:sheet.col, row:sheet.row}:undefined });
}
const pdfFlatSheet = (doc, sheet, st, no, total) => pdfAnySheet(doc, sheet, st, no, total);
const pdfTileSheet = (doc, sheet, st, no) => pdfAnySheet(doc, sheet, st, no);

/* ---------------------------------------------------------------

   --------------------------------------------------------------- */
let pdfBusy=false;
async function exportPDF(st){
  if(pdfBusy) return;
  pdfBusy=true; toast(D('Préparation du PDF…','Building the PDF…'), 9000);
  try{
    if(!await ensurePdfLibs()){ toast(D('Impossible de charger la librairie PDF : vérifie la connexion','Could not load the PDF library: check your connection')); return; }
    applyPaper();
    const doc=pdfNewDoc();
    const plan=planTemplates(st);
    await pdfSheetPage(doc, st, plan);
    if(isSet(st)) for(let i=0;i<st.parts.length;i++) await pdfPartPage(doc, st.parts[i], i, st, plan);
    plan.sheets.forEach((sh,i)=>{
      pdfPage(doc);
      if(sh.kind==='flat') pdfFlatSheet(doc, sh, st, i+1, plan.sheets.length);
      else pdfTileSheet(doc, sh, st, i+1);
    });
    pdfPaginate(doc);
    const url=doc.output('bloburl');
    const slug=(st.name||'piece').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    try{ doc.save(`gabarits-${slug}-${paper().name.toLowerCase()}.pdf`); }catch(e){}
    track('export_pdf', {shape:st.modelId, pages:doc.getNumberOfPages(), feuilles:plan.sheets.length, unit:state.unit, paper:state.paper, fix:printFix()});
    setTimeout(afterExport, 1400);
    toastAction(D(`PDF prêt · ${doc.getNumberOfPages()} pages`,`PDF ready · ${doc.getNumberOfPages()} pages`),
      D('ouvrir dans un onglet','open in a tab'),
      ()=>window.open(url,'_blank'), 12000);
  }catch(e){
    console.error(e); toast(D('Le PDF a échoué : ','PDF failed: ')+(e&&e.message||e), 5000);
  }finally{ pdfBusy=false; }
}

/* ================================================================
   EMPORTE-PIÈCES — un contour paramétrique (cercle, ovale, polygone,
   étoile, fleur, cœur, rectangle arrondi) sorti à l'échelle 1:1.
   Même règle que le reste de l'outil : le trait plein est la pièce
   FINIE, le pointillé le gabarit à découper (retrait compensé).
   ================================================================ */
const CUT_SHAPES = () => [
  {id:'cercle',  t:D('Cercle','Circle'),       p:[]},
  {id:'ovale',   t:D('Ovale','Oval'),          p:[]},
  {id:'polygone',t:D('Polygone','Polygon'),    p:['sides','round']},
  {id:'losange', t:D('Losange','Diamond'),     p:['round']},
  {id:'rect',    t:D('Rectangle','Rectangle'), p:['round']},
  {id:'arche',   t:D('Arche','Arch'),          p:['round']},
  {id:'etoile',  t:D('Étoile','Star'),         p:['branches','branchLen','round']},
  {id:'fleur',   t:D('Fleur','Flower'),        p:['branches','branchLen']},
  {id:'feston',  t:D('Festonné','Scalloped'),  p:['branches','branchLen']},
  {id:'galet',   t:D('Galet','Pebble'),        p:['branches','branchLen','seed']},
  {id:'coeur',   t:D('Cœur','Heart'),          p:[]},
  {id:'goutte',  t:D('Goutte','Teardrop'),     p:[]},
  {id:'feuille', t:D('Feuille','Leaf'),        p:['branchLen']}
];
/* proportion par défaut d'une forme : ce qui la rend reconnaissable */
const CUT_RATIO0 = {ovale:.68, rect:.68, arche:.8, losange:.72};
const cutDef = c => CUT_SHAPES().find(s=>s.id===(c&&c.shape)) || CUT_SHAPES()[0];
const cutHas = (c,k) => cutDef(c).p.includes(k);
const cutName = c => `${D('Emporte-pièce','Cutter')} ${t(cutDef(c).t).toLowerCase()}`;

const ellipsePts = (a,b,N) => { const P=[]; N=N||180;
  for(let i=0;i<N;i++){ const th=2*Math.PI*i/N; P.push([a*Math.cos(th), b*Math.sin(th)]); } return P; };
const regularPts = (n,R) => { const P=[];
  for(let i=0;i<n;i++){ const th=2*Math.PI*i/n - Math.PI/2; P.push([R*Math.cos(th), R*Math.sin(th)]); } return P; };
/* bruit déterministe : la même graine redonne le même galet */
const cutRnd = seed => { let x=Math.sin(seed*127.1)*43758.5453; return ()=>{ x=Math.sin(x*12.9898+78.233)*43758.5453; return x-Math.floor(x); }; };

/** Arrondit chaque sommet par un arc tangent aux deux côtés (rayon bridé
    par la moitié du plus court côté : sinon les branches se mangent). */
function roundPoly(pts, r){
  if(!(r>0)) return pts;
  const n=pts.length, out=[];
  for(let i=0;i<n;i++){
    const V=pts[i], A=pts[(i-1+n)%n], B=pts[(i+1)%n];
    const v1=[A[0]-V[0],A[1]-V[1]], v2=[B[0]-V[0],B[1]-V[1]];
    const l1=Math.hypot(v1[0],v1[1]), l2=Math.hypot(v2[0],v2[1]);
    if(l1<1e-6||l2<1e-6){ out.push(V); continue; }
    const u1=[v1[0]/l1,v1[1]/l1], u2=[v2[0]/l2,v2[1]/l2];
    const ang=Math.acos(Math.max(-1,Math.min(1,u1[0]*u2[0]+u1[1]*u2[1])));
    if(ang<0.02 || Math.PI-ang<0.02){ out.push(V); continue; }
    const tan=Math.min(r/Math.tan(ang/2), l1/2, l2/2), rr=tan*Math.tan(ang/2);
    const P1=[V[0]+u1[0]*tan, V[1]+u1[1]*tan], P2=[V[0]+u2[0]*tan, V[1]+u2[1]*tan];
    const bis=[u1[0]+u2[0], u1[1]+u2[1]], bl=Math.hypot(bis[0],bis[1]);
    if(bl<1e-6){ out.push(V); continue; }
    const d=rr/Math.sin(ang/2), C=[V[0]+bis[0]/bl*d, V[1]+bis[1]/bl*d];
    const a1=Math.atan2(P1[1]-C[1],P1[0]-C[0]);
    let da=Math.atan2(P2[1]-C[1],P2[0]-C[0])-a1;
    while(da>Math.PI) da-=2*Math.PI; while(da<-Math.PI) da+=2*Math.PI;
    const steps=Math.max(3, Math.round(Math.abs(da)*rr/1.1));
    for(let k=0;k<=steps;k++){ const a=a1+da*k/steps; out.push([C[0]+rr*Math.cos(a), C[1]+rr*Math.sin(a)]); }
  }
  return out;
}
/** recentre sur l'origine ; si `size` est donné, met à l'échelle sur le plus grand côté */
function cutFit(P, size){
  const xs=P.map(p=>p[0]), ys=P.map(p=>p[1]);
  const x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
  const y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  const k = size ? size/Math.max(x1-x0, y1-y0) : 1;
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  return P.map(p=>[(p[0]-cx)*k, (p[1]-cy)*k]);
}
/** le contour extérieur, en mm, centré : forme → proportion → rotation → hors-tout */
function cutOuter(c){
  const S=Math.max(10,c.size), R=S/2;
  const n=Math.max(3,Math.min(14,c.sides|0)), b=Math.max(3,Math.min(18,c.branches|0));
  const len=k=>Math.max(1.5, Math.min(R*k, c.branchLen));
  let P;
  switch(c.shape){
    case 'polygone': P=roundPoly(regularPts(n,R), c.round); break;
    case 'losange':  P=roundPoly([[0,-R],[R,0],[0,R],[-R,0]], c.round); break;
    case 'rect':     P=roundPoly([[-R,-R],[R,-R],[R,R],[-R,R]], c.round); break;
    case 'arche': {                                   // pied droit + plein cintre
      const A=[[-R,R],[-R,0]]; const N=64;
      for(let i=0;i<=N;i++){ const th=Math.PI*(1-i/N); A.push([R*Math.cos(th), -R*Math.sin(th)]); }
      A.push([R,R]); P=roundPoly(A, c.round); break;
    }
    case 'etoile': {
      const ri=R-len(.9), A=[];
      for(let i=0;i<2*b;i++){ const rr=i%2?ri:R, th=Math.PI*i/b - Math.PI/2;
        A.push([rr*Math.cos(th), rr*Math.sin(th)]); }
      P=roundPoly(A, c.round); break;
    }
    case 'fleur': {
      const A=len(.8), base=R-A/2; P=[];
      for(let i=0;i<300;i++){ const th=2*Math.PI*i/300, rr=base+(A/2)*Math.cos(b*th);
        P.push([rr*Math.cos(th), rr*Math.sin(th)]); }
      break;
    }
    case 'feston': {                                  // festons : bosses rondes, creux serrés
      const A=len(.6), base=R-A; P=[];
      for(let i=0;i<360;i++){ const th=2*Math.PI*i/360;
        const rr=base+A*Math.pow(Math.abs(Math.cos(b*th/2)), .55);
        P.push([rr*Math.cos(th), rr*Math.sin(th)]); }
      break;
    }
    case 'galet': {                                   // contour organique, reproductible
      const rnd=cutRnd(Math.max(1,c.seed|0)), amp=Math.min(.42, len(.9)/R*.5);
      const ph=[], w=[];
      for(let k=0;k<3;k++){ ph.push(rnd()*Math.PI*2); w.push(rnd()); }
      P=[];
      for(let i=0;i<300;i++){ const th=2*Math.PI*i/300;
        const f = amp*(Math.cos(b*th+ph[0])*(.55+.45*w[0])
                     + .45*Math.cos((b+2)*th+ph[1])*(.4+.6*w[1])
                     + .25*Math.cos((b+5)*th+ph[2])*(.3+.7*w[2]));
        const rr=R*(1+f/1.6); P.push([rr*Math.cos(th), rr*Math.sin(th)]); }
      break;
    }
    case 'coeur': {
      P=[];
      for(let i=0;i<240;i++){ const a=2*Math.PI*i/240;
        P.push([16*Math.pow(Math.sin(a),3),
                -(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))]); }
      break;
    }
    case 'goutte': {                                  // rond en bas, pointe en haut
      P=[];
      for(let i=0;i<240;i++){ const a=2*Math.PI*i/240;
        P.push([R*Math.sin(a)*Math.pow(Math.sin(a/2),2), -R*Math.cos(a)]); }
      break;
    }
    case 'feuille': {                                 // deux arcs : lentille pointue
      const L=R, w=Math.max(3, Math.min(R*.9, len(.9)));
      const rad=(L*L + w*w)/(2*w), cx=w-rad;           // cercle passant par (0,±L) et (w,0)
      const th=Math.asin(L/rad), N=60; P=[];
      for(let i=0;i<=N;i++){ const a=-th+2*th*i/N; P.push([cx+rad*Math.cos(a), rad*Math.sin(a)]); }
      for(let i=N;i>=0;i--){ const a=-th+2*th*i/N; P.push([-(cx+rad*Math.cos(a)), rad*Math.sin(a)]); }
      break;
    }
    case 'ovale': default: P=ellipsePts(R,R);
  }
  P=cutFit(P, S);
  const ry=Math.max(.35, Math.min(1.6, c.ratio||1));
  if(ry!==1) P=P.map(p=>[p[0], p[1]*ry]);
  const a=((c.rot||0)%360)*Math.PI/180;
  if(a) P=P.map(p=>[p[0]*Math.cos(a)-p[1]*Math.sin(a), p[0]*Math.sin(a)+p[1]*Math.cos(a)]);
  return cutFit(P, S);                                 // hors-tout = la taille demandée
}
/** largeur disponible à la hauteur y (segment qui contient l'axe) */
function cutSpanAtY(P, y){
  const xs=[];
  for(let i=0;i<P.length;i++){
    const a=P[i], b=P[(i+1)%P.length];
    if((a[1]<=y&&b[1]>y)||(b[1]<=y&&a[1]>y)) xs.push(a[0]+(y-a[1])/(b[1]-a[1])*(b[0]-a[0]));
  }
  if(xs.length<2) return null;
  xs.sort((u,v)=>u-v);
  for(let i=0;i+1<xs.length;i+=2) if(xs[i]<=0 && xs[i+1]>=0) return [xs[i], xs[i+1]];
  return [xs[0], xs[xs.length-1]];
}
/** les perçages : trou central et/ou trou de suspension posé sous le bord haut */
function cutHoles(c){
  const H=[];
  if(c.hole>1) H.push(ellipsePts(c.hole/2, c.hole/2, 72));
  if(c.hang>1){
    const P=cutOuter(c), ymin=Math.min.apply(null, P.map(p=>p[1])), ymax=Math.max.apply(null, P.map(p=>p[1]));
    const d=c.hang, need=d*0.75+1.5;
    let cy=null;
    for(let y=ymin+d*0.8; y<ymin+(ymax-ymin)*0.55; y+=0.5){
      const sp=cutSpanAtY(P,y);
      if(sp && Math.min(-sp[0], sp[1])>=need){ cy=y+d*0.8; break; }
    }
    if(cy!=null && cy<ymax) H.push(ellipsePts(d/2, d/2, 48).map(p=>[p[0], p[1]+cy]));
  }
  return H;
}
const cutPts = c => cutOuter(c);
/** cotes du gabarit : tout ce qui est en mm grandit du retrait */
const gabCut = c => { const k=1/(1-state.shrink);
  return {...c, size:c.size*k, branchLen:c.branchLen*k, round:(c.round||0)*k,
          hole:(c.hole||0)*k, hang:(c.hang||0)*k}; };
const ringLen = P => { let L=0; for(let i=0;i<P.length;i++){ const a=P[i], b=P[(i+1)%P.length];
  L+=Math.hypot(b[0]-a[0], b[1]-a[1]); } return L; };
const ringArea = P => { let a=0; for(let i=0;i<P.length;i++){ const p=P[i], q=P[(i+1)%P.length];
  a+=p[0]*q[1]-q[0]*p[1]; } return Math.abs(a)/2; };
function cutStats(c){
  const P=cutOuter(c), holes=cutHoles(c);
  const xs=P.map(p=>p[0]), ys=P.map(p=>p[1]);
  return { pts:P, holes, per:ringLen(P),
           perAll:ringLen(P)+holes.reduce((s,h)=>s+ringLen(h),0),
           area:Math.max(0, ringArea(P)-holes.reduce((s,h)=>s+ringArea(h),0)),
           w:Math.max.apply(null,xs)-Math.min.apply(null,xs),
           h:Math.max.apply(null,ys)-Math.min.apply(null,ys) };
}
const cutPoly = P => P.map(p=>`${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(' ');
const cutD = P => 'M'+P.map(p=>`${p[0].toFixed(2)} ${p[1].toFixed(2)}`).join('L')+'Z';
/** contour + perçages en un seul chemin (règle pair-impair : les trous se creusent) */
const cutAllD = S => cutD(S.pts)+S.holes.map(cutD).join('');
function cutSVG(c){
  const F=cutStats(c), G=cutStats(gabCut(c));
  const W=G.w, H=G.h, pad=Math.max(5, W*0.07), sw=Math.max(.5, W*0.005);
  return `<svg viewBox="${(-W/2-pad).toFixed(1)} ${(-H/2-pad).toFixed(1)} ${(W+2*pad).toFixed(1)} ${(H+2*pad).toFixed(1)}"
      xmlns="http://www.w3.org/2000/svg">
    <path d="${cutAllD(G)}" fill="none" stroke="var(--terra)" stroke-width="${sw.toFixed(2)}"
      stroke-dasharray="${(W*0.022).toFixed(2)} ${(W*0.016).toFixed(2)}"/>
    <path d="${cutAllD(F)}" fill="var(--vol-fill)" fill-rule="evenodd" stroke="var(--ink)"
      stroke-width="${(sw*1.2).toFixed(2)}" stroke-linejoin="round"/>
  </svg>`;
}
function cutThumb(id){

/* Récapitulatif de l'emporte-pièce — même grammaire que l'atelier : ce que
   donne la pièce cuite, le retrait qui articule, ce qu'on découpe. Il remplace
   la liste plate sous la forme et l'ancien panneau « Sortie ». Les clés de
   ligne sont préfixées « c » : les tiroirs ouverts (ROPEN) ne se mélangent pas
   avec ceux de l'atelier. */
function cutRecapVals(c){
  const n=cutPlan(c).sheets.length, F=cutStats(c), G=cutStats(gabCut(c));
  const copies=Math.max(1, c.copies|0 || 1);
  return {
    cfdim:`${uNum(F.w)} × ${U(F.h)}`, cgdim:`${uNum(G.w)} × ${U(G.h)}`, cper:U(G.per),
    choles:`${G.holes.length} · ${U(G.perAll-G.per)} ${D('de contour','of outline')}`,
    cargile:uMass(G.area/100*(c.thick/10)*CLAY_DENSITY),     // découpe crue : gabarit × plaque abaissée
    shr:`${Math.round(state.shrink*100)} %`, shk:`${fmt(100/(1-state.shrink))} %`,
    csheets:`${copies>1?`${copies} ${D('ex.','copies')} · `:''}${n} ${n>1?D('feuilles','sheets'):D('feuille','sheet')} ${paper().name}`,
    cfit: G.w<=PG.W && G.h+LBL<=PG.H
      ? D('Le gabarit tient sur une feuille.','The template fits on one sheet.')
      : D('Le gabarit dépasse la feuille : le PDF le découpe en mosaïque à assembler.',
          'The template is bigger than the sheet: the PDF tiles it across several pages.')
  };
}
function cutRecapHTML(c){

    <span class="tick"></span>
    <div class="rdet"${open?'':' hidden'}>
      <div class="sl">
        <span class="slhead">${D('Retrait de la terre','Clay shrinkage')}${COLON()} <b data-rv="shr">${v.shr}</b>

            aria-label="${D('Comment connaître le retrait de ta terre ?','How do I find my clay shrinkage?')}">i</button></span>

      </div>

             'The dashed line in the preview is that enlarged outline: it is what you cut from the slab.')}</p>

/* Bornes et nature de chaque réglage : la réglette explore, le champ pose
   une cote exacte. Les valeurs en mm restent en mm dans la réglette même
   quand l'affichage est en pouces — seule la lecture est convertie. */
const CUT_PRM = {
  size:     {min:20, max:260, kind:'mm'},
  ratio:    {min:35, max:160, kind:'pct', suf:' %'},
  sides:    {min:3,  max:12,  kind:'int'},
  branches: {min:3,  max:16,  kind:'int'},
  branchLen:{min:2,  max:c=>Math.max(6, Math.round(c.size*0.45)), kind:'mm'},
  seed:     {min:1,  max:40,  kind:'int'},
  round:    {min:0,  max:c=>Math.max(2, Math.round(c.size*0.25)), kind:'mm'},
  rot:      {min:0,  max:180, kind:'deg', suf:'°'},
  hole:     {min:0,  max:c=>Math.max(4, Math.round(c.size*0.6)),  kind:'mm'},
  hang:     {min:0,  max:20,  kind:'mm'},
  thick:    {min:2,  max:20,  kind:'mm'},
  copies:   {min:1,  max:16,  kind:'int'}
};
const prmMax = (c,k) => typeof CUT_PRM[k].max==='function' ? CUT_PRM[k].max(c) : CUT_PRM[k].max;
/** valeur affichée : mm/pouces pour les longueurs, % ou entier sinon */
function prmShown(c,k){
  const P=CUT_PRM[k], v=c[k]==null?P.min:c[k];
  return P.kind==='pct' ? Math.round(v*100) : P.kind==='mm' ? uNum(v) : Math.round(v);
}
function prmRow(c, k, lab){
  const P=CUT_PRM[k], v=c[k]==null?P.min:c[k], shown=prmShown(c,k);
  const rv = P.kind==='pct' ? Math.round(v*100) : Math.round(v*10)/10;
  const box = P.kind==='mm'
    ? `<span class="num"><input id="bx-${k}" data-c="${k}" value="${shown}" inputmode="decimal"
         aria-label="${lab}"></span>`
    : `<span class="rv" id="bx-${k}">${shown}${P.suf||''}</span>`;
  return `<div class="prm2">
    <div class="prm2h"><span>${lab}</span>${box}</div>
    <input type="range" data-c="${k}" min="${P.min}" max="${prmMax(c,k)}"
      step="${P.kind==='mm'?0.5:1}" value="${rv}" aria-label="${lab}">
  </div>`;
}

/** un gabarit d'emporte-pièce = un seul contour ; feuille simple ou mosaïque */
function cutPlan(c){
  applyPaper();
  const F=cutStats(c), G=cutStats(gabCut(c));
  const x0=Math.min.apply(null,G.pts.map(p=>p[0])), y0=Math.min.apply(null,G.pts.map(p=>p[1]));
  const g=geomOf({kind:'contour', pts:G.pts});
  g.holes=G.holes.map(h=>h.map(p=>[p[0]-x0, p[1]-y0]));   // même origine que le contour
  const it={ tag:'EP', count:1, rot:0, g,
    q:{ name:cutName(c), desc:`${D('contour','outline')} ${uNum(G.w)} × ${U(G.h)}` },
    fini:{ desc:`${uNum(F.w)} × ${U(F.h)}` } };
  const copies=Math.max(1, Math.min(16, c.copies|0 || 1));
  const list=Array.from({length:copies},(_,i)=>({...it, tag:copies>1?`EP${i+1}`:'EP'}));
  const sheets=packTemplates(list);
  if(copies===1 && sheets.length===1 && sheets[0].kind==='flat'){   // un seul exemplaire qui tient : centré, comme avant
    const e=sheets[0].items[0]; e.x=Math.max(0, Math.floor((PG.W-e.M.fw)/2));
  }
  return {sheets};
}

async function exportCutterPDF(c){
  if(pdfBusy) return;
  track('export_pdf', {shape:'emporte_'+c.shape, kind:'emporte', paper:state.paper, fix:printFix()}); setTimeout(afterExport, 1400);
  pdfBusy=true; toast(D('Préparation du PDF…','Building the PDF…'), 9000);
  try{
    if(!await ensurePdfLibs()){ toast(D('Impossible de charger la librairie PDF : vérifie la connexion','Could not load the PDF library: check your connection')); return; }
    applyPaper();
    const doc=pdfNewDoc();
    const plan=cutPlan(c), st={name:cutName(c)};
    plan.sheets.forEach((sh,i)=>{
      if(i) pdfPage(doc);
      if(sh.kind==='flat') pdfFlatSheet(doc, sh, st, i+1, plan.sheets.length);
      else pdfTileSheet(doc, sh, st, i+1);
    });
    pdfPaginate(doc);
    const url=doc.output('bloburl');
    try{ doc.save(`emporte-piece-${c.shape}-${Math.round(c.size)}mm.pdf`); }catch(e){}
    toastAction(D(`PDF prêt · ${doc.getNumberOfPages()} page(s)`,`PDF ready · ${doc.getNumberOfPages()} page(s)`),
      D('ouvrir dans un onglet','open in a tab'), ()=>window.open(url,'_blank'), 12000);
  }catch(e){
    console.error(e); toast(D('Le PDF a échoué : ','PDF failed: ')+(e&&e.message||e), 5000);
  }finally{ pdfBusy=false; }
}

    cut:{...c, name:cutLabel(c), savedId:undefined}, updated:Date.now() };

const svgNum = n => (Math.round(n*100)/100).toString();
function cutSVGDoc(c, nu){
  const F=cutStats(c), G=cutStats(gabCut(c));
  const poly=(S,attrs)=>`<path d="${cutAllD(S)}" ${attrs}/>`;
  if(nu){                                   // contour de découpe, rien d'autre
    const m=0.5;                            // marge : le trait a une épaisseur
    return `<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
  width="${svgNum(G.w+2*m)}mm" height="${svgNum(G.h+2*m)}mm"

</svg>`;
  }
  const pad=14, x0=-G.w/2-pad, y0=-G.h/2-pad, w=G.w+2*pad, h=G.h+2*pad+6;
  const dimx=G.h/2+7, dimy=G.w/2+7, tick=1.6;

  return `<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
  width="${svgNum(w)}mm" height="${svgNum(h)}mm" viewBox="${svgNum(x0)} ${svgNum(y0)} ${svgNum(w)} ${svgNum(h)}">
  <g id="decoupe" data-layer="${D('découpe','cut')}" fill="none" stroke="#000000" stroke-width="0.4" stroke-linejoin="round">

    ${cote(dimy, -G.h/2, dimy, G.h/2)}
    ${cote(dimy-tick, -G.h/2, dimy+tick, -G.h/2)}${cote(dimy-tick, G.h/2, dimy+tick, G.h/2)}
    <text x="0" y="${svgNum(dimx+4.2)}" text-anchor="middle" font-family="monospace" font-size="3.6"
      fill="#565A4D" stroke="none">${svgNum(G.w)} mm</text>
    <text x="${svgNum(dimy+4)}" y="0" text-anchor="middle" font-family="monospace" font-size="3.6"
      fill="#565A4D" stroke="none" transform="rotate(90 ${svgNum(dimy+4)} 0)">${svgNum(G.h)} mm</text>
    <text x="${svgNum(x0+2)}" y="${svgNum(y0+h-2)}" font-family="monospace" font-size="3.4"
      fill="#565A4D" stroke="none">${esc(cutLabel(c))} · ${D('gabarit à découper','template to cut')} ·
      ${D('retrait','shrinkage')} ${Math.round(state.shrink*100)} % · 1:1 · gabarits-ceramique.com</text>
  </g>

/* Export SVG de l'atelier (repris de la V1) : tous les gabarits de la pièce,
   agrandis du retrait, rangés en étagères, width/height en mm (échelle 1).
   « avec les cotes » : calques decoupe + annotations (repère, nom, cotes) ;
   « le contour seul » : le calque decoupe, rien d'autre (découpeuse, impression 3D). */
function pieceSVGDoc(st, nu){
  const items=[];
  st.parts.forEach((p,pi)=>pieces(gab(p)).forEach(q=>{
    const g=geomOf(q); items.push({q, g, part:st.parts.length>1?t(p.name):''});
  }));
  const GAPX=10, LAB=nu?0:9, MAXW=Math.max(420, ...items.map(it=>it.g.w));
  let x=0, y=0, rowH=0, W=0; const placed=[];
  items.forEach(it=>{
    if(x>0 && x+it.g.w>MAXW){ x=0; y+=rowH+GAPX; rowH=0; }
    placed.push({...it, x, y:y+LAB}); x+=it.g.w+GAPX; rowH=Math.max(rowH, it.g.h+LAB); W=Math.max(W, x-GAPX);
  });
  const H=y+rowH, m=nu?0.5:6, foot=nu?0:8;
  const d=(pts,dx,dy)=>'M'+pts.map(([a,b])=>`${svgNum(a+dx)} ${svgNum(b+dy)}`).join(' L')+' Z';
  const paths=placed.map(it=>`<path d="${d(it.g.pts,it.x,it.y)}${(it.g.holes||[]).map(h=>' '+d(h,it.x,it.y)).join('')}" fill-rule="evenodd"/>`).join('\n    ');
  const head=`<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
  width="${svgNum(W+2*m)}mm" height="${svgNum(H+2*m+foot)}mm" viewBox="${svgNum(-m)} ${svgNum(-m)} ${svgNum(W+2*m)} ${svgNum(H+2*m+foot)}">`;
  const cut=`<g id="decoupe" data-layer="${D('découpe','cut')}" fill="none" stroke="#000000" stroke-width="${nu?0.3:0.4}" stroke-linejoin="round">
    ${paths}
  </g>`;
  if(nu) return `${head}\n  ${cut}\n</svg>`;
  const labs=placed.map(it=>`<text x="${svgNum(it.x)}" y="${svgNum(it.y-4.6)}" font-size="3.4" font-weight="bold">${esc(it.q.letter)} · ${esc(t(it.q.name))}${it.q.count>1?' ×'+it.q.count:''}${it.part?' · '+esc(it.part):''}</text>
    <text x="${svgNum(it.x)}" y="${svgNum(it.y-1.2)}" font-size="2.6">${esc(String(it.q.desc||'').replace(/<[^>]+>/g,''))}</text>`).join('\n    ');
  return `${head}
  ${cut}
  <g id="annotations" data-layer="${D('annotations','annotations')}" font-family="monospace" fill="#565A4D" stroke="none">
    ${labs}
    <text x="0" y="${svgNum(H+foot)}" font-size="3.2">${esc(t(st.name))} · ${D('gabarits à découper','templates to cut')} · ${D('retrait','shrinkage')} ${Math.round(state.shrink*100)} % · 1:1 · gabarits-ceramique.com</text>
  </g>
</svg>`;
}
function exportPieceSVG(st, nu){
  const blob=new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+pieceSVGDoc(st,nu)], {type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const slug=(st.name||'piece').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const a=document.createElement('a');
  a.href=url; a.download=`gabarits-${slug}${nu?'-decoupe':''}.svg`;

    D('ouvrir dans un onglet','open in a tab'), ()=>window.open(url,'_blank'), 10000);
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
