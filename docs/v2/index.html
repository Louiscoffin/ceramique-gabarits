/* ---- manipulation directe sur le volume ----
   Les listeners de déplacement vivent sur window : le SVG est redessiné à
   chaque mouvement, un listener posé sur la poignée mourrait avec elle.
   Le cadrage est figé pendant le geste, sinon la pièce fuit sous le doigt. */
function wireHandles(){
  const stage=$('#stage'); if(!stage) return;
  const svg=stage.querySelector('svg'), hint=$('#hint'), sc=parseFloat(svg.dataset.sc);
  fitHandles(svg);
  const LOCK={sc, wx0:+svg.dataset.wx0, wy1:+svg.dataset.wy1, W2:+svg.dataset.w2, H2:+svg.dataset.h2};
  // le SVG est en « meet » dans la scène : on retire les marges de letterbox
  const toSvg=e=>{
    const r=stage.querySelector('svg').getBoundingClientRect();
    const k=Math.min(r.width/LOCK.W2, r.height/LOCK.H2);
    return {x:(e.clientX-r.left-(r.width-LOCK.W2*k)/2)/k,
            y:(e.clientY-r.top -(r.height-LOCK.H2*k)/2)/k};
  };
  let drag=null;
  const move=e=>{
    if(!drag) return;
    e.preventDefault();
    if(drag.tiltFrom!==undefined){
      state.tilt=Math.max(.10,Math.min(.5,drag.tiltFrom+(e.clientY-drag.cy)/700));
      redrawStage(undefined,LOCK); return;
    }
    const d=cur(), p=toSvg(e);
    if(drag.bec){                                    // le bec de la théière, en coordonnées monde (mm finis)
      const B=d.theiere.bec, G=becGeo(d), wx=LOCK.wx0+(p.x-PAD)/LOCK.sc, wy=LOCK.wy1-(p.y-PAD)/LOCK.sc, was={...B};
      const dx=-(wx+G.Rp), dy=wy-G.ya, perp=Math.abs(dx*G.sa-dy*G.ca), r1=v=>Math.round(v*10)/10;
      if(drag.bec==='tip'){ B.a=r1(Math.max(20,Math.min(70, Math.atan2(dy,Math.max(1,dx))*180/Math.PI))); const L=Math.hypot(dx,dy), m=becGeo(d).Lmin; B.l = L>m ? r1(L) : 0; }
      else if(drag.bec==='base') B.y=Math.round(Math.max(.2,Math.min(.8, wy/G.Hp))*100)/100;
      else if(drag.bec==='dt') B.dt=r1(Math.max(2*d.thick+3, Math.min(B.db-4, 2*perp)));
      else B.db=r1(Math.max(B.dt+4, Math.min(d.sections[0].d*.6, 2*perp)));
      if(!becFits(d)){ d.theiere.bec=was; hint.textContent=D("Le bec sortirait de la panse : son empreinte doit rester entre le fond et l'épaule","The spout would run off the belly: its outline must stay between the base and the shoulder"); return; }
      touched();
      const G2=becGeo(d);
      hint.textContent=`H · ${D('Bec','Spout')} · Ø ${uNum(2*G2.rbO)} → ${U(2*G2.rtO)} · ${U(G2.L)} ${D('à','at')} ${fmt(B.a)}° · ${D('attache','joint')} ${Math.round(B.y*100)} %`;
      redrawStage('bec-'+drag.bec,LOCK); renderDims(true); return;
    }
    const dr=(p.x-drag.start.x)/sc*drag.mirror, dh=-(p.y-drag.start.y)/sc;
    const r=Math.max(10,Math.min(200, drag.r0+dr));
    if(drag.k===0) d.dBase=Math.round(r*2*10)/10;
    else{
      d.sections[drag.k-1].d=Math.round(r*2*10)/10;
      d.sections[drag.k-1].h=Math.round(Math.max(6,Math.min(400, drag.h0+dh))*10)/10;
    }
    touched();
    hint.textContent = drag.k===0
      ? `${D('Fond','Base')} · ${dimWord(d)} ${U(d.dBase)}`
      : `${LETTERS[drag.k-1]} · ${t(d.sections[drag.k-1].name)} · ${dimWord(d)} ${uNum(d.sections[drag.k-1].d)} · h ${U(d.sections[drag.k-1].h)}`;
    redrawStage(drag.k,LOCK); renderDims(true);
  };
  const up=()=>{
    if(!drag) return;
    track('view3d_drag', {shape:setOf().modelId, geste:drag.tiltFrom!==undefined?'inclinaison':drag.bec?'bec':'poignee'});
    drag=null;
    window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up);
    renderPreview(); renderDims(); refreshTopbarState();
  };
  stage.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')) return;
    const dot=e.target.closest('.hdot');
    if(dot && dot.dataset.bec){
      e.preventDefault();
      drag={bec:dot.dataset.bec};
      svg.querySelectorAll('.hdot[data-bec="'+dot.dataset.bec+'"]').forEach(x=>x.classList.add('on'));
    }else if(dot){
      e.preventDefault();
      const k=+dot.dataset.lvl, d=cur(), lv=profile(d);
      drag={k, start:toSvg(e), r0:lv[k].r, h0:k>0?d.sections[k-1].h:0, mirror:(dot.dataset.mirror==='1'||dot.getAttribute('opacity'))?-1:1};
      svg.querySelectorAll('.hdot[data-lvl="'+k+'"]').forEach(x=>x.classList.add('on'));
      document.querySelectorAll('.drow').forEach(r=>r.classList.toggle('on', +r.dataset.lvl===k));
    }else drag={tiltFrom:state.tilt, cy:e.clientY};
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',up);
  });
}
function redrawStage(activeLvl, lock){
  const stage=$('#stage'); if(!stage) return;
  const html=buildSVG(cur(),{W:660,H:450,mode:state.view,handles:true,
    letters:state.view==='exploded',dimline:true,lock});
  const tmp=document.createElement('div'); tmp.innerHTML=html;
  const neo=tmp.firstChild;
  if(activeLvl!==undefined) neo.querySelectorAll('.hdot[data-lvl="'+activeLvl+'"]').forEach(x=>x.classList.add('on'));
  stage.querySelector('svg').replaceWith(neo);
  fitHandles(neo);
}
/* Poignées à taille d'écran constante. Le SVG suit la largeur de la scène
   (×0,47 sur un téléphone) : un rayon en unités SVG y donnait une cible de
   13 px et un point de 3 px. On le recalcule en px CSS — 44 px au doigt. */
function fitHandles(svg){
  const vb=svg && svg.viewBox && svg.viewBox.baseVal; if(!vb || !vb.width) return;
  const r=svg.getBoundingClientRect(), k=Math.min(r.width/vb.width, r.height/vb.height);
  if(!(k>0)) return;
  const touch=matchMedia('(pointer:coarse)').matches;
  const dot=(touch?7:6)/k, hit=(touch?22:14)/k;
  svg.querySelectorAll('.hdot').forEach(c=>c.setAttribute('r', (c.classList.contains('hit')?hit:dot).toFixed(1)));
}
addEventListener('resize', ()=>fitHandles(document.querySelector('#stage svg')));
function refreshTopbarState(){
  const d=state.draft, src=model(d.modelId), sub=$('#topbar .sub');

}

  h+=`
    <div class="drow">
      <span class="lt" style="font-size:7px">${D('EP','WT')}</span><span class="nm">${D('Paroi (finie)','Wall (fired)')}</span>
      <span class="num"><label>e</label><input data-key="thick" value="${uNum(d.thick)}" inputmode="decimal"></span>
      <span class="num" style="opacity:.35"><label></label><input value="·" disabled></span></div>
   ${d.anse?`<div class="drow">
      <span class="lt" style="font-size:7px">${D('ANS','HDL')}</span><span class="nm">${D('Anse','Handle')}</span>
      <span class="num"><label>h</label><input data-key="anse_h" value="${uNum(d.anse.h)}" inputmode="decimal" title="${D('hauteur entre attaches','height between joints')}"></span>

    <div class="drow">
      <span class="lt" style="font-size:7px">${D('ANS','HDL')}</span><span class="nm">${D('Anse · bande','Handle · strip')}</span>
      <span class="num"><label>l</label><input data-key="anse_w" value="${uNum(d.anse.w)}" inputmode="decimal" title="${D('largeur de bande','strip width')}"></span>
      <span class="num" style="opacity:.35"><label></label><input value="·" disabled></span></div>`:''}
   ${isTheiere(d)?`<div class="drow">
      <span class="lt">H</span><span class="nm">${D('Bec · Ø base / bout','Spout · Ø base / tip')}</span>
      <span class="num"><label>Ø</label><input data-key="th_db" value="${uNum(d.theiere.bec.db)}" inputmode="decimal" title="${D('Ø extérieur à la base','outer Ø at the base')}"></span>
      <span class="num"><label>Ø</label><input data-key="th_dt" value="${uNum(d.theiere.bec.dt)}" inputmode="decimal" title="${D('Ø extérieur au bout','outer Ø at the tip')}"></span></div>
    <div class="drow">
      <span class="lt">H</span><span class="nm" title="${D("angle de l'axe au-dessus de l'horizontale · hauteur d'attache en % de la panse","axis angle above horizontal · attachment height as % of the belly")}">${D('Bec · angle / attache','Spout · angle / joint')}</span>
      <span class="num"><label>°</label><input data-key="th_a" value="${fmt(d.theiere.bec.a)}" inputmode="decimal"></span>
      <span class="num"><label>%</label><input data-key="th_y" value="${fmt(d.theiere.bec.y*100)}" inputmode="decimal"></span></div>
    <div class="drow">
      <span class="lt">H</span><span class="nm" title="${D('au moins','at least')} ${U(becGeo(d).Lmin)} : ${D('le bout reste au-dessus du niveau de remplissage','the tip stays above the fill level')}">${D('Bec · longueur','Spout · length')}</span>
      <span class="num"><label>l</label><input data-key="th_l" value="${uNum(becGeo(d).L)}" inputmode="decimal" title="${D('longueur de l’axe ; 0 = la plus courte possible','axis length; 0 = shortest possible')}"></span>
      <span class="num" style="opacity:.6"><label>min</label><input value="${uNum(becGeo(d).Lmin)}" disabled></span></div>`:''}
   ${d.bec?`<div class="drow">
      <span class="lt" style="font-size:7px">${D('BEC','SPT')}</span><span class="nm">${D('Bec (demi-disque)','Spout (half-disc)')}</span>
      <span class="num"><label>Ø</label><input data-key="bec_d" value="${uNum(d.bec.d)}" inputmode="decimal"></span>
      <span class="num" style="opacity:.35"><label></label><input value="·" disabled></span></div>`:''}
   </div>
   <div style="display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap">
     <button class="link" id="dReset">${D('rétablir les cotes du modèle','reset to the model')}</button>
     ${isTheiere(d)?`<span class="tagsm" style="margin-left:auto">${D("le fond suit la panse, le col suit l'épaule",'base follows the belly, neck follows the shoulder')}</span>`
       : isTalon(d)?`<span class="tagsm" style="margin-left:auto">${D('le fond et le talon suivent la paroi','base and foot follow the wall')}</span>`
       : canAddSection(d) ? `<span style="margin-left:auto;display:flex;gap:4px"${d.libre?'':fxAttr(D('atelier libre','free workshop'))}>
           ${d.sections.length>1?`<button class="link" id="dDel">− ${D('section','section')}</button>`:''}
           <button class="link" id="dAdd">+ ${D('section','section')}</button></span>`
       : GC.teasers ? `<button class="link soonlink" data-teaser="libre" style="margin-left:auto">+ ${D('section','section')} ${SOON_TAG()}</button>` : ''}
   </div>`;
  box.innerHTML=h; box.dataset.built='1'; wireUnitToggle();
  box.querySelectorAll('input[data-key]').forEach(inp=>{
    const commit=()=>{
      const raw=parseFloat(String(inp.value).replace(',','.'));
      const xk=XKEYS[inp.dataset.key];
      const v=isFinite(raw) ? (xk&&xk.raw ? raw : uMm(raw)) : NaN;   // saisie -> mm (angle et % : tels quels)
      if(isFinite(v)&&v>0){
        const k=inp.dataset.key;
        if(k==='dBase') d.dBase=v; else if(k==='thick') d.thick=v;
        else if(XKEYS[k]){
          const was=isTheiere(d)?{...d.theiere.bec}:null;
          XKEYS[k].set(d, v);
          if(was && /^th_/.test(k) && !becFits(d)){ d.theiere.bec=was;
            toast(D("Le bec sortirait de la panse : son empreinte doit rester entre le fond et l'épaule","The spout would run off the belly: its outline must stay between the base and the shoulder"), 3600); }
        }
        else{
          const s=d.sections.find(x=>x.id===k.slice(0,-2));
          if(k.endsWith('_d')) s.d=v; else s.h=v;
          if(isTalon(d)) d.dBase=d.sections[0].d;       // le fond a le Ø de la paroi
        }
        touched();
      }
      renderPreview(); renderDims(); refreshTopbarState();
    };
    inp.addEventListener('change',commit);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault(); inp.blur();} });
    inp.addEventListener('focus',()=>{
      const row=inp.closest('.drow');
      document.querySelectorAll('.drow').forEach(r=>r.classList.toggle('on',r===row));
    });
  });
  $('#dReset').onclick=()=>{
    /* une partie ne porte pas son modèle : on le relit sur la pièce (lot compris) */
    const st=setOf(), m=model(st.modelId); if(!m) return;
    const src=partsOf(m)[Math.min(st.active||0, partsOf(m).length-1)];
    Object.assign(d,{dBase:src.dBase,thick:src.thick,sections:src.sections,anse:src.anse,bec:src.bec,tore:src.tore,theiere:src.theiere});
    touched(); renderPreview(); renderDims(); toast(D('Cotes du modèle rétablies','Model dimensions restored'));
  };
  if($('#dDel')) $('#dDel').onclick=()=>{
    d.sections.pop(); touched(); renderPreview(); renderDims();
  };
  if($('#dAdd')) $('#dAdd').onclick=()=>{
    const i=d.sections.length; if(i>=LETTERS.length) return toast(D('Six sections, c’est déjà beaucoup','Six sections is already a lot'));
    const last=d.sections[i-1];
    d.sections.push({id:LETTERS[i], name:'Section '+LETTERS[i], d:last.d, h:Math.round(last.h*.6)});
    touched(); renderPreview(); renderDims();
  };
}
/* ===================== récapitulatif =====================
   Deux blocs titrés — ce que donne la pièce une fois cuite, ce qu'il faut
   découper pour l'obtenir — articulés par la ligne de retrait, qui est
   exactement ce qui fait passer de l'un à l'autre.
   Les cotes d'ensemble du premier bloc se tapent : la pièce entière se met
   à l'échelle, proportions gardées. Tout le reste (équivalences, épaisseur
   de plaque, format de papier, formules) vit dans des tiroirs : à portée
   quand on le cherche, invisible le reste du temps.
   ========================================================= */
const ROPEN = {};                 // tiroirs ouverts, par clé de ligne
let RLOCK = false;                // calculs masqués (forme gratuite non débloquée)
const CHEV = `<svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 1.5 7 5 3.5 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/** une ligne : libellé (dépliable si elle a un tiroir) + valeur (saisie, lue ou verrouillée) */
function rItem(o){
  const lock=!!(o.calc&&RLOCK);
  /* Une ligne verrouillée n'ouvre pas son tiroir : le détail contient les
     mêmes chiffres que la valeur masquée. Libellé et valeur mènent à l'achat. */
  const det=lock?'':(o.det||''), open=!!(det&&ROPEN[o.id]);
  const head = lock
    ? `<button class="rk" data-calcs="1">${o.k}</button>`
    : det
    ? `<button class="rk" data-ropen="${o.id}" aria-expanded="${open}">${o.k}${CHEV}</button>`
    : `<span class="rk">${o.k}</span>`;
  const unit = o.unit?`<span class="ru">${o.unit}</span>`:'';
  const val = lock
    ? `<button class="rv rlock" data-calcs="1" title="${D('Débloquer les calculs','Unlock the figures')} · ${eur(CALCS.price)}">
         <b class="blurv" data-rv="${o.id}" data-mask="1">${maskNum(o.v)}</b>${LOCK_ICON}</button>`
    : o.set
      ? `<span class="rv"><input class="rin" data-rset="${o.set}" data-rv="${o.id}" value="${o.v}"
           inputmode="decimal" aria-label="${o.k}">${unit}</span>`
      : `<span class="rv"><b data-rv="${o.id}">${o.v}</b>${unit}</span>`;
  return `<div class="ritem${open?' open':''}"${o.fx?fxAttr(o.fx):''}>
    <div class="rrow">${head}${val}</div>
    ${o.sub&&!lock?`<div class="rsub">${o.sub}</div>`:''}
    ${det?`<div class="rdet"${open?'':' hidden'}>${det}</div>`:''}
  </div>`;
}
/** ligne de récapitulatif d'une fonction à venir : libellé + « bientôt », clic → teaser */
const rSoon = (k, feature) => `<div class="ritem"><div class="rrow">
    <button class="rk" data-teaser="${feature}">${k}</button>
    <span class="rv"><button class="link soonlink" data-teaser="${feature}">${SOON_TAG()}</button></span></div></div>`;
const rBlock = (title, em, items) =>
  `<div class="rblock"><div class="rbh">${title}<em>${em}</em></div>${items.join('')}</div>`;
const RB_FINI  = () => [D('Pièce finie','Finished piece'),  D('après cuisson','after firing')];
const RB_PLAQ  = () => [D('À découper','To cut'),           D('dans la plaque','from the slab')];

/** la charnière : le retrait, posé entre ce qu'on veut et ce qu'on découpe */
function rPivot(d){
  const open=!!ROPEN.shr, k=1/(1-state.shrink), H=totalH(d);
  const pc=`${Math.round(state.shrink*100)} %`, kx=`${fmt(100/(1-state.shrink))} %`;
  return `<div class="rpiv${open?' open':''}">
    <span class="tick"></span>
    <button class="rpivb" data-ropen="shr" aria-expanded="${open}">
      ${D('retrait','shrinkage')} <b data-rv="shr">${pc}</b><span class="arr">→</span>
      ${D('gabarits à','templates at')} <b data-rv="shk">${kx}</b>${CHEV}</button>
    <span class="tick"></span>
    <div class="rdet"${open?'':' hidden'}>
      <div class="sl">
        <span class="slhead">${D('Retrait de la terre','Clay shrinkage')}${COLON()} <b data-rv="shr">${pc}</b>
          <button class="infodot" data-info="retrait"
            aria-label="${D('Comment connaître le retrait de ta terre ?','How do I find my clay shrinkage?')}">i</button></span>
        <input type="range" id="shrink" min="0" max="20" step="0.5" value="${state.shrink*100}">
      </div>
      <p>${D('Tout ce qui est en dessous sort agrandi à','Everything below comes out scaled to')}
         <b data-rv="shk">${kx}</b>${COLON()} ${D('une paroi de','a wall of')} <b data-rv="hfin">${U(H)}</b>
         ${D('finie se découpe à','finished is cut at')} <b data-rv="hcut">${U(H*k)}</b>.</p>
      <p>${D('À mesurer une fois sur ta terre : tant que tu gardes le même sac et la même cuisson, il ne bouge plus.',
             'Measure it once on your clay: as long as you keep the same bag and the same firing, it stays put.')}</p>
    </div></div>`;
}

/* ---- les trois variantes de récapitulatif ---- */
function recapVessel(st, d){
  const k=1/(1-state.shrink), H=totalH(d), Dm=maxD(d), cl=volumeCl(d), g=clayG(d);
  const rim = d.sections.length ? d.sections[d.sections.length-1].d : d.dBase;
  const wLab = dimWord(d)==='L' ? D('Largeur max','Max width') : D('Ø max','Max Ø');
  const wWord= dimWord(d)==='L' ? D('largeur','width') : 'Ø';
  const np = nPieces(d) + (d.ears&&!d.anse&&!d.bec?1:0);
  const fini = [
    rItem({ id:'h', k:D('Hauteur','Height'), v:uNum(H), unit:uLab(), set:'h',
      det:`<p>${D('Sur le gabarit, cette paroi se découpe à','On the template this wall is cut at')}
             <b data-rv="hcut">${U(H*k)}</b> : ${D('le retrait est déjà dedans','shrinkage is already in it')}.</p>
           <p>${D('Tape une hauteur et toute la pièce suit, proportions gardées.',
                  'Type a height and the whole piece follows, proportions kept.')}</p>
           <p class="fml" data-rv="hequiv">${rEquiv(H)}</p>
           <button class="link" data-rcotes="1">${D('régler section par section','adjust section by section')}</button>`}),
    rItem({ id:'dmax', k:wLab, v:uNum(Dm), unit:uLab(), set:'dmax',
      det:`<p>${D('Fond','Base')} ${wWord} <b data-rv="dbase">${U(d.dBase)}</b> ·
             ${D('ouverture','opening')} ${wWord} <b data-rv="drim">${U(rim)}</b>.</p>
           <p>${D('Découpé à','Cut at')} <b data-rv="dcut">${U(Dm*k)}</b> ${D('sur le gabarit.','on the template.')}</p>
           <p>${D('Tape un Ø et la pièce s’élargit sans changer de hauteur.',
                  'Type a Ø and the piece widens without changing height.')}</p>
           <p class="fml" data-rv="dequiv">${rEquiv(Dm)}</p>`}),
    FEATURES.contenance && rItem({ fx:D('contenance','capacity'), id:'cl', k:D('Contenance','Capacity'), v:uVolNum(cl), unit:uVolLab(), set:'cl', calc:true,
      det:`<p>${D('Mesurée à l’intérieur, épaisseur de plaque déduite, remplie à ras bord. Pour boire, compte un bon centimètre de moins.',
                  'Measured inside, slab thickness deducted, filled to the brim. For drinking, count a good centimetre less.')}</p>
           <p>${D('Tape une contenance : la pièce se met à l’échelle en entier, les proportions ne bougent pas.',
                  'Type a capacity: the whole piece is scaled, the proportions stay put.')}</p>`}),
    !FEATURES.contenance && GC.teasers && rSoon(D('Contenance','Capacity'), 'contenance')
  ].filter(Boolean);
  const plaq = [
    rItem({ id:'slab', k:D('Plaque à abaisser','Slab to roll'), v:uNum(d.thick*k), unit:uLab(), set:'slab',
      sub:`${D('paroi finie','finished wall')} <span data-rv="thick2">${U(d.thick)}</span>`,
      det:`<p>${D('Pour une paroi de','For a wall of')} <b data-rv="thick2">${U(d.thick)}</b>
             ${D('une fois cuite, abaisse la plaque à','once fired, roll the slab to')}
             <b data-rv="slab2">${U(d.thick*k)}</b>${COLON()} ${D('elle perd','it loses')}
             <b data-rv="shr">${Math.round(state.shrink*100)} %</b> ${D('en séchant et en cuisant.','as it dries and fires.')}</p>
           ${FEATURES.plaque ? `<p>${D('Guides de rouleau. Clique pour caler la plaque sur une épaisseur ronde :','Roller guides. Click to set the slab to a round thickness:')}</p>
           <div class="guides" data-rv="guides">${rGuidesHTML(d.thick*k)}</div>
           <p data-rv="gnote">${rGuideNote(d.thick*k)}</p>` : ''}
           <div class="rfield"><span>${D('Paroi finie','Finished wall')}</span>
             <span class="rv"><input class="rin" data-rset="thick" data-rv="thick" value="${uNum(d.thick)}"
               inputmode="decimal" aria-label="${D('Épaisseur de paroi finie','Finished wall thickness')}"><span class="ru">${uLab()}</span></span></div>
           <p>${FEATURES.contenance ? D('Elle commande l’argile, la contenance et le développé des parois.',
                  'It drives the clay, the capacity and the wall development.')
                : D('Elle commande le poids de terre et le développé des parois.',
                  'It drives the clay weight and the wall development.')}</p>`}),
    FEATURES.plaque && rItem({ fx:D('plaque','slab'), id:'plaque', k:D('Plaque à sortir','Slab needed'),
      v:`${uNum(Dm*Math.PI*k)} × ${U(H*k)}`, calc:true,
      det:`<p>${D('De quoi tailler le plus grand gabarit d’un seul tenant, retrait compris.',
                  'Enough to cut the largest template in one piece, shrinkage included.')}</p>
           <p>${D('Abats-la un peu plus large : une plaque trop courte ne se rattrape pas.',
                  'Roll it a little wider: a slab that comes up short cannot be saved.')}</p>
           <p>${D('Mesure prise sur le plus grand gabarit ; les autres se calent autour.',

    rItem({ fx:FEATURES.argile?D('argile','clay'):'', id:'argile', k:clayLab(), v:uMass(clayPrep(g)), calc:true,

      det:`<p><b data-rv="gprep">${uMass(clayPrep(g))}</b> ${D('à prévoir : les','to plan for: the')}

           <p>${D('Abaisser la plaque à la bonne taille, c’est autant de terre qui ne sèche pas sur l’établi : les chutes d’une plaque entamée repartent rarement dans le sac le jour même.',

           ${rPaperHTML()}
           <button class="link" data-rsheet="1">${D('voir la planche','see the sheet')}</button>`})
  ].filter(Boolean);
  return rBlock(...RB_FINI(), fini) + rPivot(d) + rBlock(...RB_PLAQ(), plaq);
}

  const fini=[

    rItem({ id:'dmax', k:D('Ø extérieur','Outer Ø'), v:uNum(T.de), unit:uLab(),
      det:`<p>${D('Trou','Hole')} Ø <b>${U(T.dt)}</b> · ${D('profondeur','depth')} <b>${U(T.p)}</b>.</p>`}),
    FEATURES.contenance && rItem({ fx:D('contenance','capacity'), id:'cl', k:D('Contenance','Capacity'), v:uVolNum(volumeCl(d)), unit:uVolLab(), calc:true,
      det:`<p>${D('L’intérieur de l’anneau, parois déduites.','The inside of the ring, walls deducted.')}</p>`})
  ].filter(Boolean);
  const plaq=[
    rItem({ id:'slab', k:D('Plaque à abaisser','Slab to roll'), v:uNum(d.thick*k), unit:uLab(),

      det:`<p>${D('Faces, bandes et col dans la même plaque.','Faces, strips and neck from the same slab.')}</p>`}),
    rItem({ fx:FEATURES.argile?D('argile','clay'):'', id:'argile', k:clayLab(), v:uMass(clayPrep(g)), calc:true,

    rItem({ id:'gab', k:D('Gabarits','Templates'), v:rSheetsTxt(st, nPieces(d)),

  return rBlock(...RB_FINI(), fini) + rPivot(d) + rBlock(...RB_PLAQ(), plaq);
}
function recapRelief(st, d){

                  'Four battens on edge, taller than the relief so they protect it.')}</p>` })

    rItem({ id:'slab', k:D('Plaque à abaisser','Slab to roll'), v:uNum(u*k), unit:uLab(),
      sub:`${D('niveau fini','finished level')} <span data-rv="ufin">${U(u)}</span>`,
      det:`<p>${D('Un niveau de relief fini fait','A finished relief level is')} <b data-rv="ufin">${U(u)}</b> ;
             ${D('la plaque doit donc être abaissée à','so the slab has to be rolled to')} <b data-rv="uslab">${U(u*k)}</b>,
             ${D('le retrait de séchage et de cuisson en reprend','shrinkage on drying and firing takes back')}
             <b data-rv="shr">${Math.round(state.shrink*100)} %</b>.</p>
           <p>${D('Guides de rouleau :','Roller guides:')}</p>
           <div class="guides" data-rv="guides">${rGuidesHTML(u*k)}</div>
           <p data-rv="gnote">${rGuideNote(u*k)}</p>`}),
    rItem({ fx:D('plaque','slab'), id:'plaque', k:D('Plaque à sortir','Slab needed'), v:`${uNum(side)} × ${U(side)}`, calc:true,
      det:`<p>${D('Le carré équivalent à la surface de toutes les pièces, retrait compris.',
                  'The square equivalent to the area of every piece, shrinkage included.')}</p>` }),
    rItem({ fx:FEATURES.argile?D('argile','clay'):'', id:'argile', k:clayLab(), v:uMass(clayPrep(g)), calc:true,
      sub:`<span data-rv="gnet">${uMass(g)}</span> ${D('dans la pièce','in the piece')} + ${Math.round(CLAY_MARGIN*100)} %`,
      det:`<p><b data-rv="gprep">${uMass(clayPrep(g))}</b> ${D('à prévoir, chutes de découpe comprises.','to plan for, offcuts included.')}</p>
           <p>${D('Les quatre niveaux se découpent dans la même plaque de','All four levels are cut from the same slab of')}
              <b>${U(u)}</b> : ${D('une plaque de trop sèche pour rien.','one slab too many just dries out for nothing.')}</p>` }),
    rItem({ id:'gab', k:D('Gabarits','Templates'),
      v:`${S.pieces} ${D('pièces','pieces')} · ${S.cuts} ${D('découpes','cuts')}`,
      det:`<p data-rv="gsheets">${rSheetsTxt(st, S.pieces)}</p>${rPaperHTML()}
           <button class="link" data-rsheet="1">${D('voir la planche','see the sheet')}</button>` })
  ];
  return rBlock(...RB_FINI(), fini) + rPivot(d) + rBlock(...RB_PLAQ(), plaq);
}

function recapSet(st){
  const S=setStats(st);
  const fini = [
    rItem({ id:'enc', k:D('Encombrement','Footprint'),
      v: st.combine==='stack' ? `${uNum(S.Htot)} × Ø ${U(S.D)}` : `${uNum(S.H)} × Ø ${U(S.D)}`,
      det:`<p>${st.combine==='stack'
          ? D('Les deux formes montées l’une sur l’autre.','Both shapes stacked one on the other.')
          : D('La plus haute et la plus large du lot.','The tallest and the widest of the set.')}</p>
        <p>${D('Choisis une pièce au-dessus de l’aperçu pour régler ses cotes.',
               'Pick a piece above the preview to adjust its dimensions.')}</p>`}),
    FEATURES.contenance && rItem({ fx:D('contenance','capacity'), id:'cl', k:D('Contenance','Capacity'), v:uVolNum(S.cl), unit:uVolLab(), calc:true,
      det:`<p>${D('La plus grande contenance du lot.','The largest capacity in the set.')}</p>`})
  ].filter(Boolean);
  const plaq = [
    rItem({ fx:FEATURES.argile?D('argile','clay'):'', id:'argile', k:clayLab(), v:uMass(clayPrep(S.g)), calc:true,
      sub:`<span data-rv="gnet">${uMass(S.g)}</span> ${D('dans le lot','in the set')} + ${Math.round(CLAY_MARGIN*100)} %`,
      det:`<p>${D('Pour tout le lot, d’un coup : les deux formes se montent dans la même séance, à la même plaque, pour sécher au même rythme.',
                  'For the whole set at once: both shapes are built in the same session, from the same slab, so they dry at the same rate.')}</p>`}),
    rItem({ id:'gab', k:D('Gabarits','Templates'), v:rSheetsTxt(st, S.pieces),
      det:`<p>${D('Tous les gabarits du lot sur les mêmes planches.','Every template in the set on the same sheets.')}</p>
           ${rPaperHTML()}<button class="link" data-rsheet="1">${D('voir la planche','see the sheet')}</button>`})
  ];
  return rBlock(...RB_FINI(), fini) + rPivot(st.parts[0]) + rBlock(...RB_PLAQ(), plaq);
}

/* ---- petits morceaux partagés ---- */
const rEquiv = mm => state.unit==='in' ? `${uNum(mm)} in = ${fmt(mm)} mm` : `${U(mm)} = ${mmIn(mm)} in`;
/* Les guides de rouleau existent en épaisseurs rondes : on cale la plaque
   dessus et on lit ce que ça donnera une fois cuit, plutôt que d'exiger
   une cote au dixième que personne ne peut abaisser. */
const SLAB_GUIDES = [4,5,6,7,8];
const nearGuide = mm => SLAB_GUIDES.reduce((a,b)=>Math.abs(b-mm)<Math.abs(a-mm)?b:a, SLAB_GUIDES[0]);
const rGuidesHTML = slab => SLAB_GUIDES.map(g=>
  `<button class="gchip${Math.abs(g-slab)<.1?' on':''}" data-guide="${g}">${U(g)}</button>`).join('');
function rGuideNote(slab){
  const g=nearGuide(slab), fini=g*(1-state.shrink);
  return Math.abs(g-slab)<.1
    ? D(`Tu es pile sur le guide de <b>${U(g)}</b>.`, `You are right on the <b>${U(g)}</b> guide.`)
    : D(`Le guide le plus proche est <b>${U(g)}</b> : la paroi finirait à <b>${U(fini)}</b>.`,
        `The nearest guide is <b>${U(g)}</b>: the wall would end up at <b>${U(fini)}</b>.`);
}
/* la formule affichée suit le calcul : gabarits (agrandis) × plaque crue */
const rClayFml = d => { const k=1/(1-state.shrink);
  return D(`surface des gabarits × plaque de ${U(d.thick*k)} × ${fmt(CLAY_DENSITY)} g/cm³, + ${Math.round(CLAY_MARGIN*100)} %`,
           `template area × ${U(d.thick*k)} slab × ${fmt(CLAY_DENSITY)} g/cm³, + ${Math.round(CLAY_MARGIN*100)}%`); };
function rSheetsTxt(st, np){
  const n = planTemplates(st).sheets.length;
  return `${np} ${D('pièces','pieces')} · ${n} ${n>1?D('feuilles','sheets'):D('feuille','sheet')} ${paper().name}`;
}
/* format d'impression (A4 · A3 · Letter) + la correction d'imprimante, partagés atelier / emporte-pièces */
const paperSwHTML = id => `<div class="rowsw"><span class="sl">${D("Format d'impression",'Paper size')}</span>
    <span class="unitsw" id="${id}">${Object.keys(PAPERS).map(k=>
      `<button data-p="${k}" class="${pdfFormat()===k?'on':''}">${PAPERS[k].name}</button>`).join('')}</span></div>
  <p class="pfix">${printFix()===1
    ? D('Imprimé trop petit ou trop grand ?','Printed too small or too big?')
    : `${D('Correction d’imprimante','Printer correction')} <b>${fixPct(printFix())}</b> ·`}
    <button class="link" data-pfix="1">${printFix()===1?D('régler l’impression','fix the scale'):D('modifier','change')}</button></p>`;
const rPaperHTML = () => paperSwHTML('papersw');
const fixPct = k => `${k>=1?'+':'−'}${fmt(Math.abs(k-1)*100)} %`;
/** la barre témoin ne mesure pas 50 mm : on demande ce qu'elle mesure */
function openPrintFix(after){
  const was=printFix();
  const m=modal(`
    <div class="mh"><h3>${D('Imprimer à la bonne taille','Print at the right size')}</h3><button class="x" data-close>×</button></div>
    <div class="mb">
      <ol class="pfsteps">
        <li>${D('Dans la fenêtre d’impression, choisir <b>Taille réelle</b> ou <b>100 %</b>, jamais « Ajuster à la page ».',
                'In the print dialog, choose <b>Actual size</b> or <b>100 %</b>, never “Fit to page”.')}</li>
        <li>${D('Mesurer la <b>barre témoin</b> en haut à droite de chaque feuille : elle doit faire <b>50 mm</b>.',
                'Measure the <b>check bar</b> at the top right of each page: it must be <b>50 mm</b>.')}</li>
        <li>${D('Elle reste fausse (téléphone, tablette, imprimante qui réduit toute seule) ? Note ce qu’elle mesure : le prochain PDF compensera.',
                'Still wrong (phone, tablet, a printer that shrinks on its own)? Enter what it measures: the next PDF will make up for it.')}</li>
      </ol>
      <div class="field"><label for="pfMm">${D('Ma barre témoin mesure','My check bar measures')}</label>
        <span class="num" style="max-width:140px"><input id="pfMm" type="number" inputmode="decimal" min="43" max="59" step="0.5" value="${+(50/was).toFixed(1)}"> mm</span></div>
      <p class="pfout" id="pfOut"></p>
      <p class="hint">${D('Les gabarits plus grands qu’une feuille : le format A3 (imprimerie, copy-shop) évite de scotcher des feuilles.',
                        'Templates bigger than a sheet: A3 paper (print shop) saves taping sheets together.')}</p>
      <div class="act">
        ${was!==1?`<button class="ghost" id="pfReset">${D('Sans correction','No correction')}</button>`:''}
        <button class="btn" id="pfOk">${D('Enregistrer','Save')}</button>
      </div>
    </div>`);
  const inp=m.querySelector('#pfMm'), out=m.querySelector('#pfOut');
  const k=()=>{ const v=parseFloat(String(inp.value).replace(',','.')); return v>=43 && v<=59 ? 50/v : null; };
  const show=()=>{ const f=k();
    out.innerHTML = f===null ? D('Entre une longueur entre 43 et 59 mm.','Enter a length between 43 and 59 mm.')
      : Math.abs(f-1)<.002 ? D('Ton imprimante est juste : aucune correction.','Your printer is accurate: no correction.')
      : D(`Les prochains PDF sortiront agrandis de <b>${fixPct(f)}</b> pour compenser.`,`Next PDFs will be scaled by <b>${fixPct(f)}</b> to make up for it.`); };
  inp.oninput=show; show();
  const done=f=>{ state.printFix = f===null || Math.abs(f-1)<.002 ? 1 : Math.round(f*10000)/10000;
    track('print_fix', {fix:state.printFix}); persist(); closeModal(); if(after) after(); };
  m.querySelector('#pfOk').onclick=()=>{ if(k()!==null) done(k()); else inp.focus(); };
  m.querySelector('#pfReset')?.addEventListener('click',()=>done(1));
}
document.addEventListener('click',e=>{ const b=e.target.closest('[data-pfix]'); if(!b) return;
  e.preventDefault(); openPrintFix(()=>{ if(state.route==='emporte' && typeof viewEmporte==='function') viewEmporte(); else { renderPreview(); renderDims(); } }); });

/** valeurs vivantes : relues seules pendant un glisser de poignée, sans
    reconstruire le panneau (ni recalculer le calepinage des planches). */
function recapVals(st, d){
  const k=1/(1-state.shrink), v={};
  v.shr=`${Math.round(state.shrink*100)} %`; v.shk=`${fmt(100/(1-state.shrink))} %`;
  if(state.ensemble && isSet(st)){
    const S=setStats(st);
    v.enc = st.combine==='stack' ? `${uNum(S.Htot)} × Ø ${U(S.D)}` : `${uNum(S.H)} × Ø ${U(S.D)}`;
    v.cl=uVolNum(S.cl); v.gnet=uMass(S.g); v.argile=uMass(clayPrep(S.g));
    v.hfin=U(totalH(st.parts[0])); v.hcut=U(totalH(st.parts[0])*k);
    return v;
  }
  const g=clayG(d);
  v.gnet=uMass(g); v.gprep=uMass(clayPrep(g)); v.argile=uMass(clayPrep(g));
  if(isRelief(d)){
    const S=reliefStats(d), u=reliefUnit(d), side=Math.sqrt(S.area*k*k);
    v.ph=uNum(d.ph); v.pw=uNum(d.pw); v.pd=uNum(d.pd);
    v.phequiv=rEquiv(d.ph); v.pwequiv=rEquiv(d.pw); v.plvl=reliefLevelsHTML(d);
    v.frame=`4 × ${U(d.frameH)}`; v.plaque=`${uNum(side)} × ${U(side)}`;
    v.slab=uNum(u*k); v.uslab=U(u*k); v.ufin=U(u);
    v.guides=rGuidesHTML(u*k); v.gnote=rGuideNote(u*k);
    v.hfin=U(d.ph); v.hcut=U(d.ph*k);
    v.gab=`${S.pieces} ${D('pièces','pieces')} · ${S.cuts} ${D('découpes','cuts')}`;
    return v;
  }
  const H=totalH(d), Dm=maxD(d), rim=d.sections.length?d.sections[d.sections.length-1].d:d.dBase;
  v.h=uNum(H); v.dmax=uNum(Dm); v.cl=uVolNum(volumeCl(d)); v.thick=uNum(d.thick);
  v.hfin=U(H); v.hcut=U(H*k); v.dcut=U(Dm*k);
  v.hequiv=rEquiv(H); v.dequiv=rEquiv(Dm);
  v.dbase=U(d.dBase); v.drim=U(rim);
  v.plaque=`${uNum(Dm*Math.PI*k)} × ${U(H*k)}`; v.gfml=rClayFml(d);
  v.slab=uNum(d.thick*k); v.slab2=U(d.thick*k); v.thick2=U(d.thick);
  v.guides=rGuidesHTML(d.thick*k); v.gnote=rGuideNote(d.thick*k);
  return v;
}

function renderRecap(soft){
  const box=$('#recap'); if(!box) return;
  const st=setOf(), d=cur();
  RLOCK = calcsLocked(st);
  const kind = (state.ensemble && isSet(st)) ? 'set' : isRelief(d) ? 'relief' : isTore(d) ? 'tore' : 'vessel';
  if(soft && box.dataset.rkind===kind && kind!=='tore'){         // glisser de poignée : valeurs seules
    const v=recapVals(st,d);
    box.querySelectorAll('[data-rv]').forEach(el=>{
      const val=v[el.dataset.rv]; if(val===undefined) return;
      if(el.tagName==='INPUT'){ if(el!==document.activeElement) el.value=val; }
      else el.innerHTML = el.dataset.mask ? maskNum(val) : val;
    });
    return;
  }
  box.innerHTML = kind==='set' ? recapSet(st) : kind==='relief' ? recapRelief(st,d) : kind==='tore' ? recapTore(st,d) : recapVessel(st,d);
  box.dataset.rkind = kind;
  wireRecap(box);
}

function wireRecap(box){
  box.querySelectorAll('[data-ropen]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.ropen, host=b.closest('.ritem,.rpiv'), open=!ROPEN[id];
    ROPEN[id]=open; host.classList.toggle('open',open);
    b.setAttribute('aria-expanded',open);
    const det=host.querySelector('.rdet'); if(det) det.hidden=!open;
  });
  box.querySelectorAll('[data-rset]').forEach(inp=>{
    const commit=()=>{
      const raw=parseFloat(String(inp.value).replace(',','.'));
      if(isFinite(raw)&&raw>0){
        const d=cur(), id=inp.dataset.rset;
        const LIM={ph:[120,1200], pw:[80,900], pd:[8,80]};
        let ok=false;
        if(id==='slab'){ d.thick=Math.round(Math.max(1,Math.min(30,uMm(raw)*(1-state.shrink)))*10)/10; ok=true; }
        else if(id==='h')     ok=setFinishedH(d, uMm(raw));
        else if(id==='dmax')  ok=setFinishedD(d, uMm(raw));
        else if(id==='cl')    ok=setCapacity(d, uVolCl(raw));
        else if(id==='thick'){ d.thick=Math.round(Math.max(1,Math.min(30,uMm(raw)))*10)/10; ok=true; }
        else if(LIM[id]){ const L=LIM[id];
          d[id]=Math.round(Math.max(L[0],Math.min(L[1],uMm(raw)))*10)/10; ok=true; }
        if(ok) touched();
      }
      renderPreview(); renderDims(); refreshTopbarState();
    };
    inp.addEventListener('change',commit);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault(); inp.blur();} });
  });
  const sh=box.querySelector('#shrink');
  if(sh){
    sh.oninput=e=>{
      state.shrink=e.target.value/100;
      renderRecap(true);
      if(state.tab==='planche') renderPreview();
    };
    sh.onchange=()=>{ persist(); renderPreview(); renderDims(); };
  }
  const psw=box.querySelector('#papersw');
  if(psw) psw.onclick=e=>{
    const b=e.target.closest('[data-p]'); if(!b||b.dataset.p===state.paper) return;
    applyPaper(b.dataset.p); persist(); renderPreview(); renderDims();
    toast(`${D('Impression en','Printing on')} ${paper().name} : ${planTemplates(setOf()).sheets.length} ${D('planches de gabarits','template sheets')}`);
  };
  box.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>{
    const d=cur(), g=+b.dataset.guide;
    if(isRelief(d)) d.pd=Math.round(Math.max(8,Math.min(80, g*(1-state.shrink)*4))*10)/10;
    else d.thick=Math.round(Math.max(1, g*(1-state.shrink))*10)/10;
    touched(); renderPreview(); renderDims(); refreshTopbarState();
    toast(D(`Plaque abaissée à ${U(g)}, paroi finie ${U(g*(1-state.shrink))}`,
            `Slab rolled to ${U(g)}, finished wall ${U(g*(1-state.shrink))}`));
  });
  box.querySelector('[data-rcotes]')?.addEventListener('click',()=>{
    state.fold.cotes=false; persist(); viewAtelier();
    $('#dims')?.scrollIntoView({block:'nearest', behavior:'smooth'});
  });
  box.querySelector('[data-rsheet]')?.addEventListener('click',()=>{ state.tab='planche'; viewAtelier(); });
  wireCalcs(box); wireInfo(box);
}

const maskNum = v => String(v).replace(/[0-9]/g,'•');
const LOCK_ICON = `<svg class="lockico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`;
/** câble les lignes verrouillées d'un panneau vers la modale d'achat */
function wireCalcs(root){
  (root||document).querySelectorAll('[data-calcs]').forEach(b=>b.onclick=()=>openCalcs());
}

/* ---------------------- aperçu sur photo ---------------------- */
function renderPhoto(box,d){
  box.innerHTML=`<div class="photo" id="photo">
      ${state.photo ? `<img src="${state.photo}" alt="">`
        : `<div class="drop">${D("Dépose ici la photo d'une pièce à reproduire",'Drop a photo of the piece you want to copy')}<br>
             <span style="opacity:.7">${D("la silhouette se superpose, tu ajustes les cotes jusqu'à ce qu'elle épouse la pièce",'the outline sits on top: adjust the dimensions until it matches')}</span>
             <br><br><span class="btn sm" id="pick">${D('choisir une photo','choose a photo')}</span>
             <br><button class="link" id="psample">${D("ou essayer avec une photo d'exemple",'or try with a sample photo')}</button></div>`}
      <div class="ov" id="ov"></div></div>
    ${state.photo?`<div class="sliders">
      <label class="sl">${D('Taille','Size')}<input type="range" id="ps" min="20" max="180" value="${Math.round(state.ph.s*100)}"></label>
      <label class="sl">${D('Opacité','Opacity')}<input type="range" id="po" min="10" max="100" value="${Math.round(state.ph.o*100)}"></label></div>
      <div style="margin-top:8px"><button class="link" id="pdel">${D('retirer la photo','remove the photo')}</button></div>`:''}
    <input type="file" id="pfile" accept="image/*" hidden>`;
  const ph=$('#photo'), file=$('#pfile');
  const drawOv=()=>{
    const ov=$('#ov'); if(!ov) return;
    const w=ph.clientWidth||420, hgt=ph.clientHeight||320;
    const svg=buildSVG(d,{W:w*state.ph.s,H:hgt*state.ph.s,mode:'assemble',
      pal:{ink:'var(--terra-d)',thin:'var(--terra)',hide:'rgba(74,114,99,.45)',
           fill:'rgba(74,114,99,.14)',top:'rgba(74,114,99,.20)'}});
    ov.innerHTML=`<div id="sil" style="position:absolute;left:50%;top:50%;opacity:${state.ph.o};
      transform:translate(calc(-50% + ${state.ph.x}px),calc(-50% + ${state.ph.y}px));
      width:${(w*state.ph.s).toFixed(0)}px;pointer-events:auto;cursor:move;touch-action:none">${svg}</div>`;
    const sil=$('#sil');
    sil.addEventListener('pointerdown',e=>{
      e.preventDefault(); sil.setPointerCapture(e.pointerId);
      const x0=e.clientX,y0=e.clientY,px=state.ph.x,py=state.ph.y;
      const mv=ev=>{ state.ph.x=px+ev.clientX-x0; state.ph.y=py+ev.clientY-y0;
        sil.style.transform=`translate(calc(-50% + ${state.ph.x}px),calc(-50% + ${state.ph.y}px))`; };
      const up=()=>{ sil.removeEventListener('pointermove',mv); sil.removeEventListener('pointerup',up); };
      sil.addEventListener('pointermove',mv); sil.addEventListener('pointerup',up);
    });
  };
  if(state.photo){
    const img=ph.querySelector('img');
    if(img.complete) drawOv(); else img.onload=drawOv;
    $('#ps').oninput=e=>{ state.ph.s=e.target.value/100; drawOv(); };
    $('#po').oninput=e=>{ state.ph.o=e.target.value/100; const s=$('#sil'); if(s) s.style.opacity=state.ph.o; };
    $('#pdel').onclick=()=>{ state.photo=null; renderPreview(); };
  }else{
    $('#pick').onclick=()=>file.click();
    $('#psample').onclick=e=>{ e.stopPropagation();       // sinon le clic ouvre le sélecteur de fichier
      state.photo=PHOTO_SAMPLE; state.ph={x:0,y:0,s:.8,o:.55}; renderPreview(); };
  }
  ph.onclick=e=>{ if(!state.photo) file.click(); };
  file.onchange=e=>{ const f=e.target.files[0]; if(f) readPhoto(f); };
  ['dragenter','dragover'].forEach(t=>ph.addEventListener(t,e=>{e.preventDefault();ph.classList.add('dragover')}));
  ['dragleave','drop'].forEach(t=>ph.addEventListener(t,e=>{e.preventDefault();ph.classList.remove('dragover')}));
  ph.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')) readPhoto(f); });

function readPhoto(f){
  const r=new FileReader();
  r.onload=()=>{ state.photo=r.result; state.ph={x:0,y:0,s:1,o:.55}; renderPreview(); };
  r.readAsDataURL(f);
}

/* ---------------------- enregistrer / renommer / nouvelle ---------------------- */
function saveDraft(asNew){
  const d=state.draft;
  track('piece_saved', {shape:d.modelId, mise_a_jour:!asNew && !!d.savedId});
  const entry={ id:(!asNew&&d.savedId)||uid(), name:d.name, modelId:d.modelId,
    combine:d.combine, parts:d.parts.map(x=>clonePart(x)), updated:Date.now() };
  const i=state.carnet.findIndex(e=>e.id===entry.id);
  if(i>=0){ entry.created=state.carnet[i].created; state.carnet[i]=entry; }
  else{ entry.created=Date.now(); state.carnet.unshift(entry); }
  d.savedId=entry.id; d.dirty=false; persist();
  toast(i>=0?D('Pièce mise à jour dans le carnet','Piece updated in the shape book')
            :D('Pièce ajoutée au carnet','Piece added to the shape book'));
  render();
}
function renameDraft(){
  const m=modal(`<div class="mh"><h3>${D('Renommer la pièce','Rename the piece')}</h3><button class="x" data-close>×</button></div>
    <div class="mb"><div class="field"><label>${D('Nom','Name')}</label>
      <input id="rn" value="${esc(state.draft.name)}" maxlength="42"></div>
      <div class="act"><button class="ghost" data-close>${D('Annuler','Cancel')}</button>
        <button class="btn" id="rok">${D('Renommer','Rename')}</button></div></div>`);
  const inp=m.querySelector('#rn'); inp.focus(); inp.select();
  const ok=()=>{ const v=inp.value.trim(); if(v){ state.draft.name=v; touched(); } closeModal(); render(); };
  m.querySelector('#rok').onclick=ok;
  inp.onkeydown=e=>{ if(e.key==='Enter') ok(); };
}
/* ===================== formes de la V1 =====================
   fromV1 traduit une forme de la V1 (id + cotes à plat, en mm) en pièce V2.
   Il sert trois fois : les modèles prédéfinis de « Nouvelle pièce », les
   liens ?forme= du site, et la reprise du carnet de la V1. */
const V1_URL = 'https://app.gabarits-ceramique.com/';   // à la bascule : 'v1/' (ancienne version)
function v1Part(shape, d){
  const sec=(...a)=>a.map((x,i)=>({id:LETTERS[i], name:x[2]||'Section '+LETTERS[i], d:x[0], h:x[1]}));
  switch(shape){
    case 'cylindre': return {id:'cylindre', dBase:d.d, sections:sec([d.d,d.h,'Paroi'])};
    case 'cone':     return {id:'cone', dBase:d.d1, sections:sec([Math.max(d.d2,2),d.h,'Paroi'])};
    case 'tasse':    return {id:'tasse', dBase:d.d1, sections:sec([d.d2,d.h,'Paroi']), anse:{h:d.ah,p:d.ap,w:d.aw}};
    case 'pichet':   return {id:'pichet', dBase:d.d1, sections:sec([d.d2,d.h,'Paroi']),
                             anse:{h:d.ah,p:d.ap,w:d.aw}, bec:{d:d.db}};
    case 'boite':    return {id:'boite', dBase:d.l, ratio:d.w/d.l, sections:sec([d.l,d.h,'Paroi'])};
    case 'pyramide': return {id:'pyramide', dBase:d.l1, ratio:d.w1/d.l1, sections:sec([d.l2,d.h,'Paroi'])};
    case 'ovale':    return {id:'ovale', dBase:d.da, ratio:d.db/d.da, sections:sec([d.da,d.h,'Paroi'])};
    case 'prisme':   return {id:'prisme', n:d.n, dBase:d.d, sections:sec([d.d,d.h,'Fût'])};
    case 'facettes': return {id:'facettes', n:d.n, dBase:d.d1, sections:sec([Math.max(d.d2,2),d.h,'Paroi'])};
    case 'assiette': return {id:'assiette', dBase:d.d1, sections:sec([d.d2,d.h,'Marli'])};
    case 'plat':     return {id:'plat', dBase:d.l, ratio:d.w/d.l, sections:sec([d.l+2*d.db,d.h,'Bord évasé'])};
    case 'bouteille':return {id:'bouteille', dBase:d.d1, sections:sec([d.d1,d.h1,'Corps'],[d.d2,d.h2,'Épaule'],[d.d2,d.h3,'Col'])};
    case 'coussin':  return {id:'coussin', dBase:Math.round(d.df*.7), ratio:d.p/d.df,
                             sections: d.dc>0 ? sec([d.df,Math.round(d.df*.88),'Corps'],[d.dc,d.hc,'Col'])
                                              : sec([d.df,Math.round(d.df*.88),'Corps'])};
    case 'tore':     return {id:'tore', tore:{de:d.de, dt:d.dtrou, p:d.p, do:d.do, hc:d.hc}, sections:[]};
    case 'profil': {                       // points {r,y} → sections empilées (6 au plus)
      let P=(d.pts||[]).slice().sort((p,q)=>p.y-q.y);
      while(P.length>7){ let iMin=1, dMin=1e9;                    // on fond le palier le plus court
        for(let i=1;i<P.length-1;i++){ const dy=P[i+1].y-P[i-1].y; if(dy<dMin){ dMin=dy; iMin=i; } }
        P.splice(iMin,1); }
      if(P.length<2) return null;
      return {id:'profil', dBase:2*P[0].r, sections:sec(...P.slice(1).map((p,i)=>[2*p.r, p.y-P[i].y]))};
    }
  }
  return null;                            // fond libre, anneau, kurinuki, tour : ancienne version
}
/** pièce V2 depuis une forme V1 (null si la forme n'existe que dans la V1) */
function draftFromV1(shape, dims, name){
  const o=v1Part(shape, dims||{}); if(!o) return null;
  const m=model(o.id); if(!m || !shown(m)) return null;      // masquée dans cette version : elle reste dans la V1
  const dr=newDraft(m, name||m.name), p=dr.parts[0];
  ['dBase','ratio','n'].forEach(k=>{ if(isFinite(o[k])&&o[k]>0) p[k]=Math.round(o[k]*1000)/1000; });
  p.sections=o.sections.map(x=>({...x, d:Math.round(x.d*10)/10, h:Math.round(x.h*10)/10}));
  if(o.anse) p.anse={...o.anse}; if(o.bec) p.bec={...o.bec}; if(o.tore) p.tore={...o.tore};
  return dr;
}

    b.onclick=()=>go('produit',b.dataset.prod);

/* ---- vitrine « bientôt disponible » ----
   La carte ne mène pas à la fiche produit : la forme ne se règle pas encore.
   Elle ouvre une fiche courte (aperçu, description, prix prévu) et une liste
   d'attente par email, UNE PAR PIÈCE : l'adresse ne va que dans la Sheet de la
   liste d'attente (onglet de la pièce), jamais dans la newsletter. On le dit
   en clair dans la section et dans la fiche. La forme demandée est gardée en
   local et envoyée à PostHog (waitlist_submit, shape). */
/* Registre « qui attend quelle forme » : une Google Sheet alimentée par un Apps Script
   (v2/liste-attente/apps-script.gs). Vide = rien n'est envoyé. Requête « simple »
   (formulaire encodé, no-cors) : pas de CORS à régler, la réponse n'est pas lue. */
const WAITLIST_URL = 'https://script.google.com/macros/s/AKfycbwawMV3uzY2Z0JBAp_l-ww_tNTSQM7BnQgyy-YTibzqXQDXSB2x8Gjyouwo2-3DTw3QRw/exec';   // Sheet « Gabarits · liste d'attente » (gabarits.ceramique@gmail.com)
function logWaitlist(email, m){
  if(!WAITLIST_URL) return;
  try{
    fetch(WAITLIST_URL, { method:'POST', mode:'no-cors', body:new URLSearchParams({
      email, forme:m.id, nom:m.name, langue:state.lang, version:EDITION||'config', page:location.pathname }) });
  }catch(e){}
}
/* « Donner une idée du prochain gabarit » : page « Idées » de la même Sheet
   (type=idee dans l'Apps Script). Email facultatif, sans newsletter. */
function logIdea(texte, email){
  if(!WAITLIST_URL) return;
  try{
    fetch(WAITLIST_URL, { method:'POST', mode:'no-cors', body:new URLSearchParams({
      type:'idee', idee:texte, email:email||'', langue:state.lang, version:EDITION||'config', page:location.pathname }) });
  }catch(e){}
}

    <div class="mb" id="ideaBody">
      <p style="font-size:13.5px;line-height:1.55">${D('Quelle pièce aimerais-tu monter à la plaque ? Une forme, un usage, une photo qui t’inspire : décris-la comme tu veux. Les idées les plus demandées passent en premier.',

      <form id="ideaForm" novalidate>
        <textarea id="ideaText" rows="4" maxlength="1000" style="width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:10px;border:1.5px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);resize:vertical"
          placeholder="${D('ex. une théière ronde à anse bambou, un vase à deux cols, des assiettes creuses empilables…','e.g. a round teapot with a bamboo handle, a two-necked vase, stackable deep plates…')}"></textarea>

        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input type="email" id="ideaEmail" placeholder="${D('ton@email.fr','you@email.com')}" autocomplete="email" style="flex:1;min-width:180px">
          <button class="btn" type="submit">${D('Envoyer mon idée','Send my idea')}</button></div>
        <p class="soonfine">${D('Seulement pour te poser une question sur ton idée, ou te prévenir si on la réalise. Pas de newsletter.',
          'Only to ask you about your idea, or tell you if we make it. No newsletter.')}</p>
      </form>
    </div>`, {cls:'modal'});
  const ta=mm.querySelector('#ideaText'); ta.focus();
  mm.querySelector('#ideaForm').addEventListener('submit', e=>{
    e.preventDefault();
    const texte=ta.value.trim(), ei=mm.querySelector('#ideaEmail'), email=ei.value.trim();
    if(texte.length<3){ ta.focus(); ta.style.borderColor='var(--terra-d)'; return; }
    if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ ei.focus(); ei.style.borderColor='var(--terra-d)'; return; }
    track('idea_submit', {avec_email:!!email, longueur:texte.length});
    logIdea(texte, email);
    mm.querySelector('#ideaBody').innerHTML=`<p style="font-size:14px"><b>${D('Merci, c’est noté !','Thanks, noted!')}</b>
      ${D('On lit chaque idée. Les plus demandées deviennent les prochains gabarits.','We read every idea. The most requested become the next templates.')}</p>
      <div class="act"><button class="ghost" id="ideaMore">${D('Une autre idée','Another idea')}</button><button class="btn" data-close>${D('Fermer','Close')}</button></div>`;
    mm.querySelector('[data-close]').onclick=closeModal;
    mm.querySelector('#ideaMore').onclick=openIdea;
  });
}

/** encombrement lisible sur une carte : « 24 mm » ne dit rien d'une assiette */
function cardDims(st){
  const p=st.parts[0], S=setStats(st);
  if(isRelief(p)) return `${uNum(p.ph)} × ${U(p.pw)}`;
  return `${uNum(isSet(st)?S.Htot:S.H)} × ${dimWord(p)==='L'?'L':'Ø'} ${U(S.D)}`;
}

let productPhoto = 0;                            // photo affichée dans la fiche
function viewProduit(){
  const m=model(state.productId); if(!m) return go('catalogue');
  if(lastProductView!==m.id){ lastProductView=m.id; productPhoto=0; track('product_view', {shape:m.id, prix:m.price, possede:owns(m.id)}); }
  state.editing='trial';
  if(!state.trial || state.trial.modelId!==m.id){ state.trial=newDraft(m); state.ensemble=isSet(state.trial); }
  if(state.tab==='planche') state.tab='volume';
  if(!isSet(state.trial)) state.ensemble=false;
  const has=owns(m.id), d=state.trial, S=setStats(d), multi=isSet(d), photos=PRODUCT_PHOTOS[m.id];
  topbar(esc(t(m.name)), `${t(m.family)} · ${t(m.diff)} · ${multi?`${D('lot de','set of')} ${d.parts.length} ${D('formes','shapes')} · `:''}${S.pieces} ${D('pièces à découper','pieces to cut')}`);
  $('#page').innerHTML=`
    <div class="pcols">
      <div class="pgal">
        <div class="panel">
          <div class="ph"><h3>${D('Aperçu','Preview')}</h3>
            <div class="sp"><div class="tabs" id="tabs">
              <button class="tab" data-tab="volume" aria-selected="${state.tab==='volume'}">${D('Volume 3D','3D view')}</button>
              <button class="tab" data-tab="photo"  aria-selected="${state.tab==='photo'}">${D('Sur photo','On a photo')}</button>
            </div></div></div>
          ${multi?`<div class="partbar" id="partbar">
            ${d.parts.map((p,i)=>`<button class="chip${!state.ensemble&&d.active===i?' on':''}" data-part="${i}"><b>${i+1}</b> ${esc(t(p.name))}</button>`).join('')}
            <button class="chip${state.ensemble?' on':''}" data-part="ens">${D('Ensemble','Together')}</button>
            <span class="tagsm" style="margin-left:auto">${D("règle chaque forme avant d'acheter",'set each shape before buying')}</span>
          </div>`:''}
          <div class="pbody" id="preview"></div>
        </div>
        <div class="shotwrap">
          ${shotHTML(d,D('Montée à la plaque, grès chamotté','Slab-built, grogged stoneware'))}
          ${shotHTML(d, multi?D('Les deux formes à la même échelle','Both shapes, same scale')
                          :isRelief(d)?D('Le panneau et ses pièces, repérées','The panel and its lettered pieces')
                          :D('Vue éclatée des sections','Exploded view'), !multi)}
        </div>
        <div class="panel">
          <div class="ph"><h3>${D("Planche d'assemblage",'Assembly sheet')}</h3>
            <span class="sp tagsm">${has?D('incluse','included'):D('aperçu','preview')}</span></div>
          <div class="pbody" id="sheetbox"></div>
        </div>
      </div>
      <div class="stack buybox">
        <div class="panel">
          <div class="pbody stack">
            ${photos?`<figure class="pphoto"><img id="pphoto" src="${photos[productPhoto]||photos[0]}" alt="${esc(t(m.name))}">
              <figcaption>${D("Visuel d'illustration","Illustrative image")}</figcaption></figure>
              ${photos.length>1?`<div class="pthumbs" id="pthumbs">${photos.map((src,i)=>`<button data-ph="${i}" aria-pressed="${i===productPhoto}"
                aria-label="${D('Photo','Photo')} ${i+1}"><img src="${src}" alt=""></button>`).join('')}</div>`:''}`:''}
            <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
              <span class="price">${m.price===0?D('Incluse','Included'):eur(m.pack?PACK.price:m.price)}</span>
              ${tutoPill(m)}
              ${has?`<span class="pill ok">✓ ${D('dans ta bibliothèque','in your library')}</span>`
                   :`<span class="tagsm">${m.pack?`${D('le pack','the pack')} · ${MODELS.filter(x=>x.pack===m.pack).length} ${D('formes','shapes')}`:D('achat unique','one-off purchase')}</span>`}
            </div>
            <p class="note">${esc(D(m.blurb, m.blurbEn||m.blurb))}</p>
            ${has
              ? `<button class="btn lg" id="open">${D("Ouvrir dans l'atelier",'Open in the workshop')}</button>`
              : `<button class="btn lg" id="buy">${m.price===0?D('Ajouter à mes formes','Add to my shapes')
                     :m.pack?`${D('Débloquer le pack','Unlock the pack')} · ${eur(PACK.price)}`:`${D('Acheter','Buy')} · ${eur(m.price)}`}</button>
                 <div class="note" style="text-align:center">${m.pack
                     ? `${D('cette forme et les','this shape and the')} ${MODELS.filter(x=>x.pack===m.pack).length-1} ${D('autres du pack','others in the pack')}`
                     : D('paiement Gumroad · accès immédiat','Gumroad payment · instant access')}</div>`}
            ${m.tuto?`<button class="ghost" id="tuto" style="width:100%">${has?D('Voir le tutoriel 3D','Open the 3D tutorial'):D('Aperçu du tutoriel 3D','Preview the 3D tutorial')} ↗</button>`:''}
            <ul class="incl">
              ${m.tuto?`<li><span><b>${D('le tutoriel 3D pas à pas','the step-by-step 3D tutorial')}</b>${D(', recalculé à tes cotes et à ta terre',', recomputed for your dimensions and clay')}</span></li>`:''}
              <li>${multi?`${D('les','the')} ${d.parts.length} ${D('formes du lot','shapes in the set')} (${d.parts.map(x=>esc(t(x.name)).toLowerCase()).join(' + ')}), ${D('réglables séparément','each adjustable')}`
                          :D("la forme dans l'atelier, cotes réglables à volonté",'the shape in the workshop, dimensions you can change at will')}</li>
              <li>${D("la planche d'assemblage",'the assembly sheet')}${multi?D(' des deux formes',' for both shapes'):` (${isTalon(d.parts[0])?D('pièces repérées A → D','pieces labelled A → D'):isTheiere(d.parts[0])?D('pièces repérées A → M','pieces labelled A → M'):`${D('sections repérées','sections labelled')} A → ${LETTERS[d.parts[0].sections.length-1]}`})`}</li>
              <li>${D("les gabarits à découper, à l'échelle, compensés du retrait",'the cutting templates, full size, shrinkage compensated')}</li>
              <li>${D('impression A4 et réutilisation illimitée','A4 or Letter printing, unlimited reuse')}${isTalon(d.parts[0])?D(' · le mandrin sur papier cartonné',' · the mandrel on card stock'):isTheiere(d.parts[0])?D(' · les deux mandrins sur papier cartonné',' · both mandrels on card stock'):''}</li>
            </ul>
          </div>
        </div>
        <div class="panel">
          <div class="ph"><h3>${state.ensemble&&multi?D('Le lot','The set'):D('Tes cotes','Your dimensions')}</h3>
            <span class="sp">${unitToggleHTML(multi&&!state.ensemble?esc(t(cur().name)):(has?D('réglables','adjustable'):D('avant achat','before buying')))}</span></div>
          <div class="pbody" id="dims"></div>
        </div>
      </div>
    </div>`;
  $('#tabs').onclick=e=>{ const b=e.target.closest('[data-tab]'); if(b){ state.tab=b.dataset.tab; viewProduit(); } };
  $('#partbar')?.addEventListener('click',e=>{
    const b=e.target.closest('[data-part]'); if(!b) return;
    if(b.dataset.part==='ens') state.ensemble=true;
    else{ state.ensemble=false; d.active=+b.dataset.part; }
    viewProduit();
  });
  $('#pthumbs')?.addEventListener('click',e=>{
    const b=e.target.closest('[data-ph]'); if(!b) return;
    productPhoto=+b.dataset.ph; $('#pphoto').src=photos[productPhoto];
    $('#pthumbs').querySelectorAll('[data-ph]').forEach(x=>x.setAttribute('aria-pressed', x===b));
  });
  $('#buy')?.addEventListener('click',()=>m.pack?openPack(m):openBuy(m));
  $('#open')?.addEventListener('click',()=>openInAtelier(m));
  $('#tuto')?.addEventListener('click',()=>window.open(tutoURL(d, m),'_blank'));
  renderPreview(); renderDims();
  renderSheetInto($('#sheetbox'), d, {locked:!has, model:m});
}
function shotHTML(d,cap,exploded){
  const P={ink:'#23271F',thin:'#565A4D',hide:'rgba(86,90,77,.35)',fill:'rgba(255,254,250,.62)',top:'rgba(231,239,233,.85)'};
  if(isSet(d))
    return `<div class="shot">${setSVG(exploded?{...d,combine:'side'}:d,
      {W:340,H:340,tilt:exploded?.26:.30,pal:P,labels:!!exploded})}<span class="cap">${cap}</span></div>`;
  const one = d.parts ? d.parts[0] : d;            // un lot d'une seule forme
  return `<div class="shot">${buildSVG(one,{W:340,H:340,mode:exploded?'exploded':'assemble',
    letters:!!exploded, tilt:exploded?.26:.30,
    pal:{ink:'#23271F',thin:'#565A4D',hide:'rgba(86,90,77,.35)',fill:'rgba(255,254,250,.62)',top:'rgba(231,239,233,.85)'}})}
    <span class="cap">${cap}</span></div>`;
}
function openInAtelier(m){
  state.draft = {...state.trial, savedId:null, dirty:false, parts:state.trial.parts.map(x=>clonePart(x))};
  state.editing='draft'; state.tab='volume'; go('atelier');

function openUnlock(m, prefill){
  const opts = m ? '' : EXTRAS.concat(MODELS.filter(x=>x.price>0&&!x.pack))
      .filter(x=>!state.owned[x.id])
      .map(x=>`<option value="${x.id}">${esc(x.name)}${x.extra?` · ${eur(x.price)}`:''}</option>`).join('');
  modal(`<div class="mh"><h3>${m?`${D('Débloquer','Unlock')} « ${esc(t(m.name))} »`:D('Retrouver un achat','Restore a purchase')}</h3><button class="x" data-close>×</button></div>
    ${STEPS(2, true)}
    <div class="mb">
      <p>${D("Colle le lien d'accès Gumroad (ou la clé de licence) reçu par email.",'Paste the Gumroad access link (or the license key) you got by email.')}</p>
      ${m?'':`<div class="field"><label>${D('Forme','Shape')}</label><select id="uModel">${opts}</select></div>`}
      <div class="field"><label>${D('Lien ou clé','Link or key')}</label>
        <input id="ukey" placeholder="https://gumroad.com/d/… ou PLA-XXXX-XXXX-XXXX" value="${prefill?esc(prefill):''}"></div>
      <div class="err" id="uerr" hidden></div>
      <div class="testkey">
        <span>${D('Prototype · code de test universel','Prototype · universal test code')}</span>
        <button class="copybtn" id="ukeyfill">${MASTER_KEY}</button>
      </div>
      <div class="act"><button class="ghost" data-close>${D('Annuler','Cancel')}</button>
        <button class="btn" id="uok">${D('Débloquer','Unlock')}</button></div>
    </div>`);
  const inp=$('#ukey'); inp.focus();
  $('#ukeyfill').onclick=()=>{ inp.value=MASTER_KEY; navigator.clipboard?.writeText(MASTER_KEY).catch(()=>{}); inp.focus(); };
  const submit=()=>{
    const v=inp.value.trim();
    if(isMaster(v)){                                  // code universel : tout le catalogue
      MODELS.concat(EXTRAS).filter(x=>x.price>0).forEach(x=>state.owned[x.id]={date:Date.now(), key:MASTER_KEY});
      persist(); closeModal();
      go(m&&!m.extra?'produit':(state.route==='atelier'?'atelier':'catalogue'));
      return toast(D(`Code de test accepté : les ${MODELS.filter(x=>x.price>0).length} formes et les calculs sont débloqués`,
        `Test code accepted: all ${MODELS.filter(x=>x.price>0).length} shapes and the figures are unlocked`),4000);
    }
    const ok = /gumroad\.com\/(d|l)\/[a-z0-9]{6,}/i.test(v) || /^PLA(-[A-Z0-9]{4}){3}$/i.test(v);
    if(!ok){ const e=$('#uerr'); e.hidden=false;
      e.textContent=D("Ce lien ne ressemble pas à un lien Gumroad. Vérifie l'email de confirmation.",
                      "That doesn't look like a Gumroad link. Check your confirmation email."); return; }
    const target = m || model($('#uModel').value);
    if(!target){ closeModal(); return toast(D('Aucune forme à débloquer','Nothing to unlock')); }
    grantPurchase(target, v);
  };
  $('#uok').onclick=submit;
  inp.onkeydown=e=>{ if(e.key==='Enter') submit(); };
}
/** l'achat est enregistré : on range la forme et on montre ce qu'elle débloque */
function grantPurchase(target, key){
    track('license_ok', {shape:target.id, code_test:isMaster(String(key||''))});
    state.owned[target.id]={date:Date.now(), key};
    persist(); closeModal();
    if(target.extra){ render();

        ? D(`Pack débloqué : ${MODELS.filter(x=>x.pack===target.pack).length} formes sont à toi`,

        : D('Calculs débloqués sur toutes les formes','Figures unlocked on every shape'), 3800); }
    state.productId=target.id; state.tab='volume';
    if(!state.trial||state.trial.modelId!==target.id) state.trial=newDraft(target);
    go('produit');
    toast(D(`« ${target.name} » est à toi : planche et gabarits débloqués`,
            `“${t(target.name)}” is yours: sheet and templates unlocked`), 4000);
}

/* ==================== PLANCHE D'ASSEMBLAGE ====================
   Même logique que la fiche d'atelier des PDF : vue éclatée repérée
   A→D + fond, tableau de spécifications, gabarits à découper agrandis
   du retrait. ================================================= */
function gab(d){                                   // cotes agrandies (gabarit humide)
  const k=1/(1-state.shrink);
  if(isRelief(d)) return {...d, pw:d.pw*k, ph:d.ph*k, pd:d.pd*k, frame:d.frame*k};
  if(isTore(d)) return {...d, wetK:k};                 // torePieces agrandit lui-même
  return {...d, dBase:d.dBase*k, thick:d.thick, wetK:k, sections:d.sections.map(s=>({...s,d:s.d*k,h:s.h*k}))};
}
/* Calcul payant sur une forme gratuite : même traitement que le
   récapitulatif — flouté à l'écran (et cliquable vers l'achat), absent à
   l'impression. Jamais le chiffre en clair dans le DOM. */
const sheetCalc = (label, v) => `<tr class="calclock"><td>${label}</td><td><button class="rlock" data-calcs="1"
    title="${D('Débloquer les calculs','Unlock the figures')} · ${eur(CALCS.price)}"><span class="blurv">${maskNum(v)}</span>${LOCK_ICON}</button></td></tr>`;
/** specifications de la planche, selon le type de piece */
function sheetSpecTable(d, multi, lock){
  const shr = multi ? '' : `<tr><td>${D('RETRAIT COMPENSÉ','SHRINKAGE ALLOWED')}</td><td>${Math.round(state.shrink*100)} % · ${D('gabarits à','templates at')} ${fmt(100/(1-state.shrink))} %</td></tr>`;
  if(isRelief(d)){
    const S=reliefStats(d), u=reliefUnit(d);
    return `<table>
      <tr><td>${D('PLAQUE À ABAISSER','SLAB TO ROLL')}</td><td>${U(u/(1-state.shrink))} · ${D('niveau fini','finished level')} ${U(u)}</td></tr>
      ${lock ? sheetCalc(clayLab().toUpperCase(), uMass(clayPrep(clayG(d))))
             : `<tr><td>${clayLab().toUpperCase()}</td><td>${uMass(clayPrep(clayG(d)))} · ${D('pièce','piece')} ${uMass(clayG(d))} + ${Math.round(CLAY_MARGIN*100)} %</td></tr>`}
      ${shr}
      <tr><td>${D('PANNEAU FINI','FINISHED PANEL')}</td><td>${uNum(d.ph)} × ${U(d.pw)}</td></tr>
      <tr><td>${D('RELIEF MAXIMUM','MAXIMUM RELIEF')}</td><td>${U(d.pd)}</td></tr>
      <tr><td>${D('GABARITS','TEMPLATES')}</td><td>${S.pieces} ${D('pièces','pieces')} · ${S.cuts} ${D('découpes','cuts')}</td></tr>
      <tr><td>${D('CADRE','FRAME')}</td><td>4 × ${U(d.frameH)} ${D('de haut','tall')}</td></tr>
    </table>`;
  }
  const H=totalH(d);
  return `<table>
    <tr><td>${D('PLAQUE À ABAISSER','SLAB TO ROLL')}</td><td>${U(d.thick/(1-state.shrink))} · ${D('paroi finie','finished wall')} ${U(d.thick)}</td></tr>
    ${lock ? sheetCalc(clayLab().toUpperCase(), uMass(clayPrep(clayG(d))))
           : `<tr><td>${clayLab().toUpperCase()}</td><td>${uMass(clayPrep(clayG(d)))} · ${D('pièce','piece')} ${uMass(clayG(d))} + ${Math.round(CLAY_MARGIN*100)} %</td></tr>`}
    ${shr}
    <tr><td>${D('TAILLE FINALE','FINAL SIZE')}</td><td>${state.unit==='in'?`${uNum(H)} in · ${fmt(H)} mm`:`${U(H)} · ${mmIn(H)} in`}</td></tr>
    <tr><td>${D('Ø MAXIMUM','MAX Ø')}</td><td>${U(maxD(d))}</td></tr>
    ${rimRows(d).map(r=>`<tr><td>${r[0].toUpperCase()}</td><td>${r[1]}</td></tr>`).join('')}
    ${isTalon(d)?`<tr><td>${D('TALON','FOOT RING')}</td><td>Ø ${U(d.sections[0].d*TALON_K)} · ${D('anneau','ring')} ${U(d.talon.w||3)} × ${U(d.thick)}</td></tr>
    <tr><td>${D('MANDRIN','MANDREL')}</td><td>Ø ${U(pieces(gab(d))[3].d0)} ${D('intérieur cru · papier cartonné','inside, wet · card stock')}</td></tr>`:''}
    ${isTheiere(d)?(()=>{ const G=becGeo(d), Dc=d.sections[1].d;
      return `<tr><td>${D('BEC','SPOUT')}</td><td>Ø ${uNum(2*G.rbO)} → ${U(2*G.rtO)} · ${U(G.L)} ${D('à','at')} ${Math.round(G.a*180/Math.PI)}°</td></tr>
    <tr><td>${D('REMPLISSAGE','FILL LEVEL')}</td><td>${U(G.fill)} ${D('· le bout du bec est au-dessus','· the spout tip clears it')}</td></tr>
    <tr><td>${D('COUVERCLE','LID')}</td><td>Ø ${U(Dc+d.thick)} · ${D('collerette','flange')} Ø ${U(Dc-2*d.thick-2*TH.jeu)}, ${D('jeu','gap')} ${U(TH.jeu)}</td></tr>
    <tr><td>${D('PASSOIRE','STRAINER')}</td><td>${pieces(d).find(q=>q.id==='J').nHoles} ${D('trous','holes')} Ø ${U(TH.hole)}</td></tr>`; })():''}
    ${!FEATURES.contenance ? '' : lock ? sheetCalc(D('CONTENANCE','CAPACITY'), uVol(volumeCl(d)))
           : `<tr><td>${D('CONTENANCE','CAPACITY')}</td><td>≈ ${uVol(volumeCl(d))}</td></tr>`}
  </table>`;
}
/** ouverture et fond, en cotes finies (sondage : « il manque la mesure de
    l'ouverture du haut » sur les pièces coniques) */
function rimRows(d){
  if(isRelief(d) || isTore(d) || isTalon(d) || !d.sections || !d.sections.length) return [];
  if(isTheiere(d)) return [[`Ø ${D('col','neck')}`, U(d.sections[1].d)], [`Ø ${D('panse','belly')}`, U(d.sections[0].d)]];
  const w=dimWord(d), top=d.sections[d.sections.length-1].d;
  return [[`${w} ${D('ouverture','opening')}`, U(top)], [`${w} ${D('fond','base')}`, U(d.dBase)]];
}
/** l'ordre de montage, en clair */
function sheetAssembly(d, seq){
  if(isRelief(d)) return reliefMontage(d);
  if(isTore(d)) return D(`Laisser raffermir les deux faces A à plat. Cintrer la bande intérieure C dans le trou, entre les deux faces, et souder : c'est elle qui rend l'anneau creux.
      Cintrer la bande extérieure B autour des faces en laissant l'ouverture du col au sommet ; percer un petit trou d'évent avant de refermer.
      Rouler le col D en cylindre et le souder sur l'ouverture. Barbotine sur les tranches, scarifier chaque joint.`,
    `Let both faces A firm up flat. Bend the inner strip C inside the hole, between the two faces, and weld it: this is what makes the ring hollow.
      Bend the outer strip B around the faces, leaving the neck opening at the top; pierce a small vent hole before closing.
      Roll neck D into a cylinder and weld it onto the opening. Slip on the edges, score every joint.`);
  if(isTheiere(d)) return D(`Rouler les mandrins L (panse) et M (bec) en carton, journal par-dessus. Biseauter les petits côtés des bandes A, C, F et de l'épaule B à 45°, l'un dessus, l'autre dessous ; strier, barbotiner.
      Rouler la panse A sur le mandrin L et la poser sur la couronne striée du fond D ; colombin dans l'angle. Rouler l'épaule B, la poser sur la panse, puis le col C sur l'épaule.
      Couvercle : souder la collerette F sous le disque E, le bouton G dessus, percer le trou d'air. Bec : rouler H sur le mandrin M, tracer l'empreinte J sur la panse, percer la passoire, souder le bec. Anse I cintrée sur le profil K, posée côté opposé. Sécher lentement, couvercle en place. Le tutoriel détaille chaque geste.`,
    `Roll the card mandrels L (belly) and M (spout), newspaper over them. Bevel the short sides of strips A, C, F and of shoulder B at 45°, one on top, one underneath; score, slip.
      Roll belly A around mandrel L and set it on the scored rim of base D; coil in the corner. Roll shoulder B, set it on the belly, then neck C on the shoulder.
      Lid: weld flange F under disc E, knob G on top, pierce the air hole. Spout: roll H around mandrel M, trace outline J on the belly, pierce the strainer, weld the spout. Handle I bent on profile K, opposite the spout. Dry slowly, lid in place. The tutorial walks through every step.`);
  if(isTalon(d)) return D(`Rouler le mandrin D en carton (journal par-dessus). Biseauter les deux petits côtés de la paroi A à 45°, l'un dessus, l'autre dessous ; strier, barbotiner, rouler A sur le mandrin.
      Poser le cylindre sur la couronne striée du fond B, au ras du bord, colombin dans l'angle intérieur.
      À consistance cuir, retourner, tracer le cercle du talon à la tournette et poser la rondelle C, gardée humide sous le même plastique. Le tutoriel détaille chaque geste.`,
    `Roll the card mandrel D (newspaper over it). Bevel the two short sides of wall A at 45°, one on top, one underneath; score, slip, roll A around the mandrel.
      Set the cylinder on the scored rim of base B, flush with the edge, coil in the inside corner.
      At leather-hard, turn it over, mark the foot circle on the banding wheel and attach ring C, kept damp under the same plastic. The tutorial walks through every step.`);
  return D(`Chaque secteur se roule en tronc de cône : ses deux bords droits se rejoignent, c'est la couture. Le FOND ferme le bas : la pièce n'est ouverte que par le haut.
      Séquence conseillée : monter le corps ${seq}, puis rapporter le FOND.
      Barbotine sur les tranches, chanfrein à 45° sur les raccords, lissage à l'estèque après prise.`,
    `Each sector rolls into a cone band: its two straight edges meet at the seam. The BASE closes the bottom: the piece is only open at the top.
      Suggested sequence: build the body ${seq}, then attach the BASE.
      Slip on the edges, 45° bevel on the joints, rib them smooth once set.`)
    + (d.ears?`<br>${esc(t(d.earsLabel||'ANSES'))}${COLON()} ${D('à poser quand la pièce est à consistance cuir.','attach at leather-hard.')}`:'');
}
/** texte de montage d'un panneau en bas-relief */
function reliefMontage(d){
  const S=reliefStats(d), u=reliefUnit(d);
  return D(`Aucune pièce ne se pose sur une autre : toutes reposent à plat sur la plaque de fond, bord à bord, et le relief ne vient que de leur épaisseur. Une pièce de ${U(d.pd)} se fait en collant quatre plaques de ${U(u)} découpées au même gabarit.
      Monter d'abord le caisson (plaque de fond et quatre baguettes de ${U(d.frameH)} de haut sur le chant), puis poser les ${S.pieces} pièces à blanc avant de coller, en partant d'un angle.
      Finir par les pièces encastrées, celles qui se logent dans un évidement.`,
    `No piece sits on top of another: they all lie flat on the backing board, edge to edge, and the relief comes only from their thickness. A ${U(d.pd)} piece is four ${U(u)} slabs glued together, all cut from the same template.

/* planche-leurre : le tracé garde son allure mais perd ses mesures —
   coordonnées ramenées à une taille arbitraire (les chemins portaient les mm) */
function normPat(p){
  const L=['R','r','d0','d1','w','hh','w0','w1'];
  const all=[...L.map(f=>Math.abs(p[f]||0)), ...(p.pts||[]).flat().map(Math.abs)];
  const k=100/(Math.max(...all)||1), q={...p};
  L.forEach(f=>{ if(typeof q[f]==='number') q[f]*=k; });
  if(p.pts) q.pts=p.pts.map(v=>[v[0]*k,v[1]*k]);
  if(p.holes) q.holes=p.holes.map(h=>h.map(v=>[v[0]*k,v[1]*k]));
  return q;
}
/* Planche verrouillée : un leurre, pas la vraie planche floutée. Le flou
   n'est qu'un filtre CSS — les cotes des gabarits restaient en clair dans
   le DOM (copier-coller, mode lecture). Ici chaque chiffre hors dessin
   devient « • », et les SVG perdent leurs métadonnées d'échelle. */
function decoySheetHTML(st, m){
  const tpl=document.createElement('template');
  tpl.innerHTML=sheetHTML(st, m, {decoy:true});
  const w=document.createTreeWalker(tpl.content, NodeFilter.SHOW_TEXT);
  for(let n=w.nextNode(); n; n=w.nextNode())
    if(!(n.parentElement && n.parentElement.closest('svg'))) n.nodeValue=maskNum(n.nodeValue);
  tpl.content.querySelectorAll('svg[data-sc]').forEach(el=>
    ['data-sc','data-wx0','data-wy1','data-w2','data-h2'].forEach(a=>el.removeAttribute(a)));
  return tpl.innerHTML;
}
function patternSVG(p){
  const W=120,H=78,pad=4, stroke=' fill="#FFFEFA" stroke="#23271F" stroke-width=".9" vector-effect="non-scaling-stroke"';
  let pts=[], d='';
  const poly = q => { pts=q; d=`<path d="${q.map((v,i)=>(i?'L':'M')+v[0].toFixed(2)+' '+v[1].toFixed(2)).join(' ')} Z"${stroke}/>`; };
  switch(p.kind){
    case 'disque': { const r=p.d0/2; pts=[[-r,-r],[r,r]];
      d=`<circle cx="0" cy="0" r="${r}"${stroke}/>`; break; }
    case 'ellipse': { const a=p.w/2,b=p.hh/2; pts=[[-a,-b],[a,b]];
      d=`<ellipse cx="0" cy="0" rx="${a}" ry="${b}"${stroke}/>`; break; }
    case 'polygone': { const n=p.n||6, R=p.R;
      poly(Array.from({length:n},(_,i)=>{ const t=2*Math.PI*i/n+Math.PI/n;
        return [R*Math.cos(t), R*Math.sin(t)]; })); break; }
    case 'panneau':
    case 'bande': { const w=p.w,h=p.hh; pts=[[-w/2,-h/2],[w/2,h/2]];
      d=`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}"${stroke}/>`; break; }
    case 'trapeze': { const a=p.w0/2,b=p.w1/2,h=p.hh;
      poly([[-a,h/2],[a,h/2],[b,-h/2],[-b,-h/2]]); break; }
    case 'contour': { pts=p.pts.slice();
      const ring=q=>'M'+q.map(v=>v[0].toFixed(2)+' '+v[1].toFixed(2)).join('L')+'Z';
      d=`<path fill-rule="evenodd" d="${ring(p.pts)}${(p.holes||[]).map(ring).join('')}"${stroke}/>`; break; }
    default: {                                        // secteur annulaire
      const ang=Math.min(p.ang,359.5)*Math.PI/180, a0=-ang/2, R=p.R, r=p.r, N=48, all=[];
      for(let i=0;i<=N;i++){ const t=a0+ang*i/N; all.push([R*Math.sin(t),-R*Math.cos(t)]); }
      for(let i=N;i>=0;i--){ const t=a0+ang*i/N; all.push([r*Math.sin(t),-r*Math.cos(t)]); }
      poly(all);
    }
  }
  const xs=pts.map(q=>q[0]||0), ys=pts.map(q=>q[1]||0);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sc=Math.min((W-2*pad)/(x1-x0||1),(H-2*pad)/(y1-y0||1));
  const tx=W/2-((x0+x1)/2)*sc, ty=H/2-((y0+y1)/2)*sc;
  const tag = p.count>1 ? `<text x="${W-5}" y="${H-5}" text-anchor="end" style="font-size:8px" fill="#23271F">×${p.count}</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}"><g transform="translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${sc.toFixed(4)})">${d}</g>${tag}</svg>`;
}
